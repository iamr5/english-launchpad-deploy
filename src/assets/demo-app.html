  /* Sección recién desbloqueada */
  .block.just-unlocked { animation: unlockIn .7s cubic-bezier(.2,1,.3,1) both; }
  @keyframes unlockIn { from { opacity: 0; transform: translateY(22px) scale(.98); } to { opacity: 1; transform: none; } }
  .boti-cheer { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 80;
    display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 999px;
    padding: 8px 16px 8px 8px; box-shadow: 0 8px 22px rgba(0,0,0,.18); animation: cheerIn .35s cubic-bezier(.2,1.3,.3,1) both; }
  .boti-cheer img { width: 34px; height: 34px; }
  .boti-cheer .bc-txt { font-size: 15px; font-weight: 800; color: var(--ink); }
  .boti-cheer.out { animation: cheerOut .35s ease forwards; }
  @keyframes cheerIn { from { opacity: 0; transform: translate(-50%, -14px) scale(.9); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
  @keyframes cheerOut { to { opacity: 0; transform: translate(-50%, -14px) scale(.94); } }

  /* Celebración de lección completada — la recompensa "grande" del curso */
  .win { position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; padding: 24px;
    background: radial-gradient(120% 90% at 50% 20%, #EAFBE2 0%, #FFFFFF 62%); animation: winIn .28s ease both; }
  @keyframes winIn { from { opacity: 0 } to { opacity: 1 } }
  .win.out { animation: winOut .3s ease both; }
  @keyframes winOut { to { opacity: 0 } }
  .win .w-boti { width: 132px; height: 132px; animation: winPop .7s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes winPop { 0% { transform: scale(.2) rotate(-14deg); opacity: 0 } 60% { transform: scale(1.12) rotate(6deg); opacity: 1 } 100% { transform: scale(1) rotate(0) } }
  .win .w-t { font-family: var(--font-round); font-size: 30px; font-weight: 800; color: var(--okDark, #2E7D1A); text-align: center; margin-top: 8px; }
  .win .w-s { font-size: 16px; font-weight: 700; color: var(--muted2, #5C5159); text-align: center; max-width: 320px; }
  .win .w-stats { display: flex; gap: 10px; margin: 16px 0 4px; }
  .win .w-chip { background: #fff; border: 2px solid var(--line, #E6E4EA); border-radius: 16px;
    padding: 10px 16px; text-align: center; box-shadow: 0 2px 0 rgba(0,0,0,.05); animation: winIn .4s .25s ease both; }
  .win .w-chip b { display: block; font-size: 20px; font-weight: 800; color: var(--ink); }
  .win .w-chip span { font-size: 12px; font-weight: 700; color: var(--muted2, #5C5159); }
  .win .btn { max-width: 320px; width: 100%; margin-top: 18px; }
  .win .cft { position: absolute; top: -12px; width: 10px; height: 16px; border-radius: 3px; animation: cft 2.6s linear infinite; }
  @keyframes cft { 0% { transform: translateY(-20px) rotate(0) } 100% { transform: translateY(105vh) rotate(720deg) } }

  /* Momento "sombrero seleccionador": revelación del nivel tras el test de ubicación.
     Todo aquí busca sentirse vivo: nada entra "de golpe", nada se repite idéntico. */
  .sort { position: fixed; inset: 0; z-index: 95; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; padding: 24px; overflow: hidden;
    background: radial-gradient(circle at 50% 42%, #123a5c 0%, #0a1b2b 70%);
    /* background-size > 100%: sin margen sobrante, animar background-position no
       movía absolutamente nada. Ahora el foco de luz del fondo deriva de verdad. */
    background-size: 165% 165%; background-position: 50% 42%;
    animation: winIn .7s cubic-bezier(.2,.8,.3,1) both, sortAmbient 17s ease-in-out infinite; }
  @keyframes sortAmbient {
    0%,100% { background-position: 44% 38% }
    35% { background-position: 58% 48% }
    68% { background-position: 50% 34% } }
  /* SALIDA — la parte que faltaba en todo esto.
     Antes el cierre era un único winOut de 350ms sobre la pantalla entera: todo
     desaparecía de golpe. Ahora cada pieza tiene su propia salida (`leave`) y se
     van escalonadas de abajo a arriba — primero lo último que llegó — y el fondo
     se disuelve al final, cuando ya no queda nada encima.
     Los !important son necesarios: casi todo aquí termina con el fill de una
     animación, y sin ellos la salida no llegaría a aplicarse. */
  .sort .leave { opacity: 0 !important; transform: translateY(22px) scale(.965) !important;
    filter: blur(7px) !important; animation: none !important;
    transition: opacity .55s ease, transform .7s cubic-bezier(.4,0,.65,1), filter .55s ease !important; }
  .sort.out { animation: sortOut .95s cubic-bezier(.4,0,.6,1) .32s both; }
  @keyframes sortOut { 0% { opacity: 1 } 100% { opacity: 0 } }

  /* EL ARREGLO DE FONDO ————————————————————————————————————
     Antes la columna se centraba con `justify-content:center`. Cada vez que
     entraba contenido nuevo (tarjeta, filas, total, botón) el navegador
     re-centraba en un solo fotograma: la escena entera pegaba un salto seco,
     cinco veces seguidas. Ningún easing puede tapar eso — es reflow, no
     animación. Ahora la columna se posiciona sola con transform y un
     ResizeObserver la re-centra; cualquier cambio de altura se convierte en un
     deslizamiento de 1.15s en vez de un corte. Es la diferencia entre
     "pa, pa, pa" y algo que se acomoda. */
  /* padding propio: al ser absoluta se posiciona contra la caja de padding de
     .sort, así que el padding del contenedor no la separa de los bordes. */
  .sort .s-col { position: absolute; left: 0; right: 0; top: 0; z-index: 1; padding: 20px 24px;
    display: flex; flex-direction: column; align-items: center; will-change: transform; }
  .sort .s-col.glide { transition: transform 1.15s cubic-bezier(.24,.86,.26,1); }

  /* Aire de la escena: DOS halos con periodos que no encajan (6.8s y 9.3s) y
     deriva propia. Al no coincidir nunca, la luz jamás repite el mismo estado:
     es lo que separa "respira" de "loop". */
  .sort .s-aura { position: absolute; left: 50%; top: 42%; width: 470px; height: 470px; margin: -235px 0 0 -235px;
    border-radius: 50%; pointer-events: none; z-index: 0;
    background: radial-gradient(circle, rgba(255,216,107,.26) 0%, rgba(255,216,107,.09) 40%, transparent 68%);
    animation: sortBreathe 6.8s ease-in-out infinite; transition: transform .6s ease, opacity .6s ease; }
  @keyframes sortBreathe {
    0%,100% { transform: translate(0,0) scale(.92); opacity: .5 }
    38% { transform: translate(-15px,-11px) scale(1.09); opacity: .98 }
    64% { transform: translate(11px,7px) scale(1); opacity: .68 }
    83% { transform: translate(5px,-5px) scale(1.05); opacity: .84 } }
  .sort .s-aura.b2 { width: 330px; height: 330px; margin: -165px 0 0 -165px; top: 46%;
    background: radial-gradient(circle, rgba(28,176,246,.26) 0%, rgba(28,176,246,.08) 44%, transparent 70%);
    animation: sortBreathe2 9.3s ease-in-out infinite; }
  @keyframes sortBreathe2 {
    0%,100% { transform: translate(20px,12px) scale(1.06); opacity: .3 }
    45% { transform: translate(-18px,-15px) scale(.84); opacity: .66 }
    72% { transform: translate(9px,-5px) scale(1); opacity: .4 } }
  /* Inhalación previa al veredicto: la escena se recoge y se apaga un instante */
  .sort.hush .s-aura { animation: none; transform: scale(.82); opacity: .28; }
  .sort .s-dust { position: absolute; bottom: -12px; width: 5px; height: 5px; border-radius: 50%;
    background: rgba(255,216,107,.55); pointer-events: none; z-index: 0; opacity: 0;
    animation: sortDust 12s linear infinite; }
  @keyframes sortDust {
    0% { transform: translate(0, 0) scale(.6); opacity: 0 }
    12% { opacity: .8 }
    50% { transform: translate(14px, -46vh) scale(1); opacity: .55 }
    88% { opacity: .25 }
    100% { transform: translate(-10px, -96vh) scale(.5); opacity: 0 } }

  .sort .s-stage { position: relative; z-index: 1; width: 280px; height: 280px; display: flex; align-items: center; justify-content: center; }
  /* Anticipación → liberación, un solo arco continuo. Antes el hush terminaba
     congelado en scale(.93) y al revelar se le quitaba la clase: la escena
     pegaba un salto instantáneo a su tamaño. Ahora `boom` arranca justo donde
     `hush` acabó y sigue el movimiento hasta pasarse y asentarse. */
  .sort .s-stage.hush { animation: sortHush 1.05s cubic-bezier(.36,0,.22,1) both; }
  @keyframes sortHush {
    0% { transform: scale(1); filter: blur(0) }
    70% { transform: scale(.89); filter: blur(1.6px) }
    100% { transform: scale(.925); filter: blur(1.1px) } }
  .sort .s-stage.hush .s-bpos { opacity: .3 !important; filter: blur(2px); }
  .sort .s-stage.boom { animation: sortBoom 1.5s cubic-bezier(.2,1.18,.3,1) both; }
  @keyframes sortBoom {
    0% { transform: scale(.925); filter: blur(1.1px) }
    30% { transform: scale(1.095); filter: blur(0) }
    52% { transform: scale(.978) }
    70% { transform: scale(1.022) }
    84% { transform: scale(.993) }
    94% { transform: scale(1.003) }
    100% { transform: scale(1) } }
  /* Boti llega a escena: el envoltorio hace la entrada, el img sigue con su
     respiración propia (no se pueden animar dos transforms en el mismo nodo) */
  .sort .s-botiw { position: relative; z-index: 2; animation: sortBotiIn 1.45s cubic-bezier(.2,1.05,.3,1) both; }
  @keyframes sortBotiIn {
    0% { opacity: 0; transform: translateY(34px) scale(.58); filter: blur(8px) }
    54% { opacity: 1; transform: translateY(-9px) scale(1.08); filter: blur(0) }
    78% { transform: translateY(3px) scale(.985) }
    92% { transform: translateY(-1px) scale(1.004) }
    100% { opacity: 1; transform: none; filter: blur(0) } }
  /* Boti cede el escenario en vez de desaparecer: se hunde, se encoge y se
     desenfoca mientras la insignia del nivel ya está creciendo encima. */
  .sort .s-botiw.out { animation: none; opacity: 0; transform: translateY(18px) scale(.48); filter: blur(9px);
    transition: opacity .72s ease, transform .9s cubic-bezier(.42,0,.66,1), filter .72s ease; }
  /* La mascota pensando: dos ritmos superpuestos = respiración irregular, no
     loop de GIF.
     object-fit porque el icono de cabeza no tiene por qué ser cuadrado: cada
     demo trae la suya (gallito, ozito…) y aquí entra sin deformarse. */
  .sort .s-boti { width: 118px; height: 118px; object-fit: contain; transform-origin: 50% 78%;
    animation: sortThink 3.9s cubic-bezier(.45,.05,.55,.95) infinite, sortTilt 5.8s ease-in-out infinite; }
  @keyframes sortThink {
    0%,100% { transform: translateY(0) scale(1) }
    28% { transform: translateY(-7px) scale(1.02) }
    46% { transform: translateY(-3px) scale(1.005) }
    68% { transform: translateY(-10px) scale(1.03) } }
  @keyframes sortTilt {
    0%,100% { rotate: -3.5deg } 33% { rotate: 2deg } 61% { rotate: -1deg } 80% { rotate: 3.5deg } }

  /* Órbita con peso: arranca lento, acelera, se pasa de largo y vuelve */
  /* Dos anillos anidados. El de fuera va SIEMPRE, lentísimo (74s/vuelta): así el
     conjunto nunca queda congelado, ni antes de girar ni después de parar —
     antes se quedaba clavado 2.8s esperando el veredicto y se notaba muerto.
     El de dentro hace el giro grande. Se componen porque son nodos distintos:
     dos animaciones de transform en el mismo nodo se anulan entre sí. */
  .sort .s-orbit { position: absolute; inset: 0; animation: orbDrift 26s linear infinite; }
  @keyframes orbDrift { to { transform: rotate(360deg) } }
  .sort .s-orbin { position: absolute; inset: 0; will-change: transform; }
  .sort .s-orbin.spin { animation: sortSpin 8.2s cubic-bezier(.42,0,.24,1) both; }
  /* Tres tiempos: arranca pesado, duda a media vuelta, y se apaga girando casi parado */
  @keyframes sortSpin {
    0% { transform: rotate(0deg) }
    7% { transform: rotate(38deg) }
    17% { transform: rotate(300deg) }
    28% { transform: rotate(700deg) }
    36% { transform: rotate(940deg) }   /* velocidad máxima */
    44% { transform: rotate(1078deg) }  /* se pasa de largo */
    49% { transform: rotate(1050deg) }  /* retrocede por inercia */
    54% { transform: rotate(1064deg) }
    64% { transform: rotate(1340deg) }  /* vuelve a coger vuelo: sigue dudando */
    76% { transform: rotate(1596deg) }
    86% { transform: rotate(1728deg) }
    94% { transform: rotate(1782deg) }  /* casi detenido, aún buscando */
    100% { transform: rotate(1800deg) } }
  /* DOS NODOS POR INSIGNIA — el motivo de que antes entraran tan secas.
     El transform de un elemento es UNO solo: si lo usa la posición en la órbita,
     no queda con qué animar la escala. Por eso las insignias solo se trasladaban
     y, una vez colocadas, se quedaban congeladas.
     Ahora `.s-bpos` se encarga de viajar (translate) y `.s-badge`, dentro, solo
     de la escala: entra con un rebote elástico y sigue respirando para siempre. */
  .sort .s-bpos { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px;
    margin: -27px 0 0 -27px; border-radius: 50%; opacity: 0;
    transition: opacity .72s ease, filter .72s ease; }
  .sort .s-bpos.here { opacity: 1; }
  /* Contrarrota el giro lento del anillo, mismo periodo y sentido opuesto, para
     que las etiquetas no se vuelquen mientras dan vueltas alrededor de Boti.
     Cancela exacto porque ambas animaciones nacen en el mismo innerHTML y por
     tanto arrancan en el mismo instante. (El giro grande de la deliberación sí
     las voltea, a propósito — es una rueda girando — y acaba en 1800°, múltiplo
     de 360, así que aterrizan derechas.)
     Lleva además el pulso de luz: box-shadow y transform no compiten entre sí. */
  .sort .s-bin { width: 100%; height: 100%; border-radius: 50%;
    animation: orbDriftBack 26s linear infinite, badgePulse 4.4s ease-in-out infinite; }
  @keyframes orbDriftBack { to { transform: rotate(-360deg) } }
  .sort .s-badge { width: 100%; height: 100%; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-round); font-weight: 800; font-size: 16px; color: #0a1b2b;
    background: #FFD86B; box-shadow: 0 6px 18px rgba(0,0,0,.35); transform: scale(0); }
  /* Se pasa de tamaño, rebota dos veces y se asienta; luego no para de respirar */
  .sort .s-bpos.here .s-badge { animation: badgeIn 1.15s cubic-bezier(.2,1.5,.35,1) both,
    badgeBreathe 4.2s ease-in-out 1.15s infinite; }
  @keyframes badgeIn {
    0% { transform: scale(0); filter: blur(7px) }
    36% { transform: scale(1.45); filter: blur(0) }
    54% { transform: scale(.86) }
    69% { transform: scale(1.15) }
    81% { transform: scale(.95) }
    90% { transform: scale(1.04) }
    96% { transform: scale(.99) }
    100% { transform: scale(1); filter: blur(0) } }
  @keyframes badgeBreathe {
    0%,100% { transform: scale(1) } 50% { transform: scale(1.13) } }
  /* Periodos distintos por insignia: si respiran todas al mismo compás se lee
     como un efecto; desincronizadas se lee como cinco cosas vivas. */
  .sort .s-bpos:nth-child(2) .s-badge { animation-duration: 1.15s, 5.3s; animation-delay: 0s, 1.9s; }
  .sort .s-bpos:nth-child(3) .s-badge { animation-duration: 1.15s, 3.7s; animation-delay: 0s, 2.8s; }
  .sort .s-bpos:nth-child(4) .s-badge { animation-duration: 1.15s, 4.8s; animation-delay: 0s, 1.4s; }
  .sort .s-bpos:nth-child(5) .s-badge { animation-duration: 1.15s, 3.3s; animation-delay: 0s, 3.4s; }
  /* Una luz recorre el anillo insignia a insignia. El desfase va sobre el
     SEGUNDO valor del delay: el primero es la contrarrotación, que tiene que
     seguir arrancando en cero o dejaría de cancelar el giro del anillo. */
  @keyframes badgePulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,246,218,0) }
    50% { box-shadow: 0 0 30px 7px rgba(255,246,218,.6) } }
  .sort .s-bpos:nth-child(2) .s-bin { animation-delay: 0s, .88s; }
  .sort .s-bpos:nth-child(3) .s-bin { animation-delay: 0s, 1.76s; }
  .sort .s-bpos:nth-child(4) .s-bin { animation-delay: 0s, 2.64s; }
  .sort .s-bpos:nth-child(5) .s-bin { animation-delay: 0s, 3.52s; }
  /* Salida. 4 clases y !important porque durante el hush la regla
     `.s-stage.hush .s-bpos` fija opacity .3 con !important y, al ser más
     específica, ganaría: saldrían despedidas pero sin desvanecerse.
     Sin `animation:none` — la trayectoria de salida es una animación generada
     por insignia (bout0..4) y esto la anularía. */
  .sort .s-stage .s-bpos.gone { opacity: 0 !important; filter: blur(6px) !important; }
  /* !important: el JS pone opacity inline al colocar cada insignia en órbita,
     y sin esto ni el atenuado del hush ni el fundido final llegarían a verse. */
  .sort .s-orbit.fade .s-bpos { opacity: 0 !important; filter: blur(3px); }

  /* Veredicto: aterriza con rebotes decrecientes */
  .sort .s-final { position: relative; z-index: 2; width: 132px; height: 132px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-family: var(--font-round);
    font-weight: 800; font-size: 44px; color: #0a1b2b;
    background: radial-gradient(circle at 40% 35%, #FFF3C4, #FFC53D);
    box-shadow: 0 0 0 10px rgba(255,216,107,.18), 0 0 60px 18px rgba(255,197,61,.55);
    /* finalFloat va el último: toma el relevo del transform cuando sortSettle
       acaba, así la insignia no se queda clavada tras aterrizar. */
    animation: sortSettle 2s cubic-bezier(.33,.8,.34,1) both,
      sortGlow 4.4s ease-in-out 2s infinite,
      finalFloat 9.1s ease-in-out 2s infinite; }
  /* La insignia CAMBIA DE TAMAÑO, no solo de sitio. Antes solo subía y bajaba
     7px: el resultado era una bola quieta con un brillo detrás. */
  @keyframes finalFloat {
    0%,100% { transform: translateY(0) scale(1) rotate(0deg) }
    36% { transform: translateY(-8px) scale(1.06) rotate(-1.4deg) }
    67% { transform: translateY(3px) scale(.975) rotate(1deg) } }
  /* Halo giratorio detrás del nivel. Gira Y late: al ser un mismo nodo, rotación
     y escala tienen que ir en el mismo keyframe — dos animaciones de transform
     sobre el mismo elemento se anularían. */
  .sort .s-final::before { content: ''; position: absolute; inset: -30px; border-radius: 50%; z-index: -1;
    background: conic-gradient(from 0deg, rgba(255,216,107,0) 0deg, rgba(255,216,107,.5) 90deg,
      rgba(255,255,255,.3) 160deg, rgba(255,216,107,.22) 240deg, rgba(255,216,107,0) 360deg);
    filter: blur(14px); animation: sortHalo 7.5s linear 1.2s infinite; }
  @keyframes sortHalo {
    0% { transform: rotate(0deg) scale(1) }
    25% { transform: rotate(90deg) scale(1.14) }
    50% { transform: rotate(180deg) scale(.94) }
    75% { transform: rotate(270deg) scale(1.1) }
    100% { transform: rotate(360deg) scale(1) } }
  @keyframes sortSettle {
    0% { transform: scale(.06) rotate(-42deg); opacity: 0; filter: blur(9px) }
    24% { transform: scale(1.34) rotate(9deg); opacity: 1; filter: blur(0) }
    41% { transform: scale(.9) rotate(-5deg) }
    56% { transform: scale(1.12) rotate(3deg) }
    69% { transform: scale(.96) rotate(-1.5deg) }
    80% { transform: scale(1.045) rotate(.6deg) }
    89% { transform: scale(.985) rotate(-.2deg) }
    95% { transform: scale(1.006) }
    100% { transform: scale(1) rotate(0); filter: blur(0) } }
  /* El halo se abre y se cierra de verdad: 8→26px de anillo y 40→104 de
     difusión. El recorrido anterior (10→16) no se llegaba a percibir. */
  @keyframes sortGlow {
    0%,100% { box-shadow: 0 0 0 8px rgba(255,216,107,.18), 0 0 40px 10px rgba(255,197,61,.4) }
    50% { box-shadow: 0 0 0 26px rgba(255,216,107,.07), 0 0 104px 34px rgba(255,197,61,.72) } }

  /* Dos ondas de distinta velocidad y grosor */
  .sort .s-wave { position: absolute; left: 50%; top: 50%; width: 140px; height: 140px; margin: -70px 0 0 -70px;
    border-radius: 50%; border: 3px solid rgba(255,216,107,.7);
    animation: sortWave 2.1s cubic-bezier(.15,.75,.25,1) both; }
  @keyframes sortWave { 0% { transform: scale(.35); opacity: .95 } 68% { opacity: .28 } 100% { transform: scale(3.8); opacity: 0 } }
  .sort .s-wave.w2 { animation-duration: 3.1s; animation-delay: .34s; border-width: 1.5px; border-color: rgba(255,255,255,.42); }

  /* RELEVO DE TEXTO ————————————————————————————————————————
     Un cross-fade de dos bloques estáticos se lee como diapositivas. Aquí el
     texto que se va se eleva y se deshace en desenfoque, y el que llega emerge
     desde abajo saliendo de foco. El blur es lo que da sensación de aire y de
     masa: sin él, cualquier entrada se siente recortada.
     Además ambos tienen deriva permanente (periodos 8.6s y 11.4s, que no
     encajan entre sí): aterrizan, pero nunca se quedan clavados. */
  .sort .s-t { font-family: var(--font-round); font-size: 26px; font-weight: 800; color: #FFF3C4; margin-top: 10px;
    text-align: center; min-height: 34px; animation: tIdle 8.6s ease-in-out infinite;
    transition: opacity .58s cubic-bezier(.4,0,.35,1), transform .58s cubic-bezier(.4,0,.35,1), filter .58s ease; }
  .sort .s-t.fade { animation: none; opacity: 0; transform: translateY(-13px) scale(.955); filter: blur(9px); }
  .sort .s-t.tin { animation: tIn .95s cubic-bezier(.16,.86,.26,1) both, tIdle 8.6s ease-in-out .95s infinite; }
  @keyframes tIn {
    0% { opacity: 0; transform: translateY(15px) scale(.96); filter: blur(9px) }
    48% { opacity: 1 }
    78% { transform: translateY(-1.5px) scale(1.004) }
    100% { opacity: 1; transform: none; filter: blur(0) } }
  @keyframes tIdle {
    0%,100% { transform: translateY(0) } 42% { transform: translateY(-4px) } 71% { transform: translateY(1.6px) } }
  /* Cada letra del nivel sigue meciéndose después de caer, y desfasada entre sí:
     un bloque de texto quieto delata que la animación "terminó". */
  .sort .s-t i { display: inline-block; font-style: normal;
    animation: sortPop .78s cubic-bezier(.2,1.5,.35,1) both, letterSway 6.4s ease-in-out .78s infinite; }
  @keyframes sortPop {
    0% { opacity: 0; transform: translateY(14px) scale(.62); filter: blur(8px) }
    52% { transform: translateY(-4px) scale(1.17); filter: blur(0) }
    72% { transform: translateY(1.5px) scale(.975) }
    87% { transform: translateY(-.5px) scale(1.008) }
    100% { opacity: 1; transform: none; filter: blur(0) } }
  @keyframes letterSway {
    0%,100% { transform: translateY(0) rotate(0deg) }
    31% { transform: translateY(-3.6px) rotate(-1.9deg) }
    64% { transform: translateY(2.4px) rotate(1.3deg) } }
  .sort .s-t i:nth-child(2) { animation-delay: 0s, 1.6s; }
  .sort .s-t i:nth-child(3) { animation-delay: 0s, 3.1s; }
  .sort .s-t i:nth-child(4) { animation-delay: 0s, .9s; }
  .sort .s-t i:nth-child(5) { animation-delay: 0s, 2.4s; }
  .sort .s-s { font-size: 15px; font-weight: 700; color: #CFE6F7; text-align: center; max-width: 300px; margin-top: 8px;
    min-height: 20px; opacity: 0; transform: translateY(11px); filter: blur(7px);
    transition: opacity .72s ease, transform .78s cubic-bezier(.2,.9,.3,1), filter .72s ease; }
  .sort .s-s.in { opacity: 1; transform: none; filter: blur(0);
    animation: sIdle 11.4s ease-in-out .82s infinite; }
  @keyframes sIdle {
    0%,100% { transform: translateY(0) } 38% { transform: translateY(-3px) } 69% { transform: translateY(1.8px) } }

  /* Resultados: una sola tarjeta (cabecera + filas + total), no piezas sueltas */
  /* display:none hasta el veredicto para que TODO el contenido (filas, total,
     botón) entre en el layout de una sola vez. Un único reflow, deslizado por
     .s-col; a partir de ahí solo opacidad y transform: cero saltos. */
  .sort .s-panel { display: none;
    width: 100%; max-width: 320px; z-index: 1; margin: 20px 0 2px; padding: 14px 14px 12px;
    background: rgba(255,255,255,.055); border: 1.5px solid rgba(255,255,255,.13); border-radius: 20px;
    opacity: 0; transform: translateY(22px) scale(.965); filter: blur(8px);
    transition: opacity 1.05s ease, transform 1.05s cubic-bezier(.2,.95,.3,1), filter 1.05s ease; }
  .sort .s-panel.on { display: block; }
  /* Respira: deriva vertical + el borde recogiendo y soltando luz, muy lento */
  .sort .s-panel.in { opacity: 1; transform: none; filter: blur(0);
    animation: panelBreathe 8.4s ease-in-out 1.4s infinite; }
  @keyframes panelBreathe {
    0%,100% { transform: translateY(0); box-shadow: 0 0 0 rgba(255,216,107,0), inset 0 0 0 rgba(255,216,107,0); border-color: rgba(255,255,255,.13) }
    52% { transform: translateY(-3.5px); box-shadow: 0 0 30px rgba(255,216,107,.14), inset 0 0 26px rgba(255,216,107,.06); border-color: rgba(255,216,107,.24) } }
  .sort .s-ph { opacity: 0; transform: translateY(9px); filter: blur(5px);
    transition: opacity .85s ease, transform .85s cubic-bezier(.2,.9,.3,1), filter .85s ease; }
  .sort .s-ph.in { opacity: 1; transform: none; filter: blur(0); }
  .sort .s-ph { font-size: 10.5px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase;
    color: rgba(207,230,247,.55); margin: 0 2px 11px; }
  .sort .s-credits { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .sort .s-credit { position: relative; display: flex; align-items: center; gap: 11px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.10); border-radius: 14px; padding: 9px 11px; color: #fff;
    opacity: 0; transform: translateY(14px); }
  /* Entra desde abajo saliendo de foco, se adelanta y se asienta — y después
     sigue flotando (rowFloat), con periodo distinto por fila para que no vayan
     al unísono. Una fila inmóvil delata el corte de la animación. */
  .sort .s-credit.in { animation: sortRowIn 1.25s cubic-bezier(.22,1.12,.32,1) both,
    rowFloat 9.2s ease-in-out 1.25s infinite; }
  @keyframes sortRowIn {
    0% { opacity: 0; transform: translateY(26px) scale(.95); filter: blur(7px) }
    48% { opacity: 1; transform: translateY(-5px) scale(1.018); filter: blur(0) }
    70% { transform: translateY(2px) scale(.995) }
    85% { transform: translateY(-1px) scale(1.004) }
    94% { transform: translateY(.3px) }
    100% { opacity: 1; transform: none; filter: blur(0) } }
  @keyframes rowFloat {
    0%,100% { transform: translateY(0) } 44% { transform: translateY(-3.2px) } 73% { transform: translateY(1.4px) } }
  .sort .s-credits .s-credit:nth-child(2).in { animation-delay: 0s, 3.4s; }
  .sort .s-credits .s-credit:nth-child(3).in { animation-delay: 0s, 6.1s; }
  .sort .s-credits .s-credit:nth-child(4).in { animation-delay: 0s, 1.7s; }
  /* Acción solapada: las tres zonas de la fila no llegan a la vez. Es lo que
     separa "entró un div" de algo animado a mano. */
  .sort .s-credit.in .cl { animation: partIn .95s cubic-bezier(.2,1.25,.3,1) .12s backwards; }
  .sort .s-credit.in .cm { animation: partIn .95s cubic-bezier(.2,1.1,.3,1) .26s backwards; }
  .sort .s-credit.in .cx { animation: partIn .95s cubic-bezier(.2,1.1,.3,1) .4s backwards; }
  @keyframes partIn {
    0% { opacity: 0; transform: translateX(-11px) scale(.86); filter: blur(4px) }
    100% { opacity: 1; transform: none; filter: blur(0) } }
  /* Insignia del nivel a la izquierda: ancla la fila y se lee de un vistazo */
  .sort .s-credit .cl { position: relative; overflow: hidden;
    flex: 0 0 auto; width: 36px; height: 36px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-round); font-weight: 800; font-size: 14px; color: #0a1b2b;
    background: linear-gradient(155deg, #FFEEB8, #FFC53D); box-shadow: 0 3px 10px rgba(255,197,61,.3); }
  /* Un brillo cruza cada insignia cada pocos segundos, desfasado por fila */
  .sort .s-credit .cl::after { content: ''; position: absolute; top: -60%; left: -130%;
    width: 55%; height: 220%; transform: skewX(-18deg); pointer-events: none;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.6), transparent);
    animation: clSheen 6.2s cubic-bezier(.4,0,.3,1) 1.8s infinite; }
  @keyframes clSheen { 0% { left: -130% } 20%,100% { left: 190% } }
  .sort .s-credits .s-credit:nth-child(2) .cl::after { animation-delay: 3.9s; }
  .sort .s-credits .s-credit:nth-child(3) .cl::after { animation-delay: 6s; }
  .sort .s-credits .s-credit:nth-child(4) .cl::after { animation-delay: 2.7s; }
  .sort .s-credit .cm { display: flex; flex-direction: column; gap: 2px; min-width: 0; line-height: 1.2; }
  .sort .s-credit .cm b, .sort .s-credit .cm small {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sort .s-credit .cm b { font-size: 13.5px; font-weight: 800; }
  .sort .s-credit .cm small { font-size: 11px; font-weight: 700; color: rgba(207,230,247,.6); }
  .sort .s-credit .cx { margin-left: auto; color: #FFD86B; display: flex; align-items: center; gap: 5px;
    font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sort .s-credit .ck svg { display: block; }
  .sort .s-credit .ck path { stroke-dasharray: 26; stroke-dashoffset: 26; transition: stroke-dashoffset .5s cubic-bezier(.3,.9,.3,1); }
  .sort .s-credit .ck.draw path { stroke-dashoffset: 0; }
  .sort .btn { max-width: 320px; width: 100%; margin-top: 18px; }
  .sort .s-skip { margin-top: 10px; background: none; border: 0; color: #9FC2DA; font-weight: 700; cursor: pointer; z-index: 1;
    transition: opacity .6s ease, transform .6s ease; }
  /* Con el veredicto ya en pantalla, "Saltar" sobra: manda "Empezar en X" */
  .sort .s-skip.gone { opacity: 0; transform: translateY(8px); pointer-events: none; }
  .sort .s-flash { position: fixed; inset: 0; pointer-events: none; z-index: 3; opacity: 0;
    background: radial-gradient(circle at 50% 42%, #FFF6DA 0%, #FFE49A 45%, rgba(255,228,154,0) 78%);
    animation: sortFlash 1.15s cubic-bezier(.16,.7,.3,1) both; }
  /* Fogonazo más largo y menos violento: un pico a 0.88 en 60ms es un golpe
     seco de fotograma. Sube en 170ms y se apaga en cola larga. */
  @keyframes sortFlash {
    0% { opacity: 0 } 15% { opacity: .68 } 38% { opacity: .26 } 66% { opacity: .09 } 100% { opacity: 0 } }
  /* Boti reacciona: sobresalto y luego alegría que se calma */
  /* El brillo va en --own-filter, no directo en `filter`: esta es la cabeza de
     la mascota, y si el demo la recolorea (mascot-tint.js) la regla del teñido
     manda sobre este elemento y le devuelve el brillo leyendo esta variable.
     Escrito como filter: drop-shadow(...) se perdía el teñido justo aquí, en
     la pantalla del veredicto. */
  .sort .s-boti.cheer { animation: sortCheer 1.9s cubic-bezier(.28,1.1,.35,1) both, sortHover 2.4s ease-in-out 1.9s infinite;
    --own-filter: drop-shadow(0 0 18px rgba(255,216,107,.85));
    filter: var(--own-filter); }
  @keyframes sortCheer {
    0% { transform: translateY(4px) scale(.86) rotate(0deg) }
    12% { transform: translateY(-2px) scale(1.12) rotate(-8deg) }
    30% { transform: translateY(-22px) scale(1.14) rotate(8deg) }
    48% { transform: translateY(0) scale(.96) rotate(-4deg) }
    64% { transform: translateY(-12px) scale(1.06) rotate(4deg) }
    80% { transform: translateY(0) scale(.99) rotate(-1.5deg) }
    100% { transform: translateY(-4px) scale(1) rotate(0) } }
  @keyframes sortHover { 0%,100% { transform: translateY(-4px) rotate(-2deg) } 50% { transform: translateY(-11px) rotate(2.5deg) } }
  /* Total: pie de la misma tarjeta, separado por una línea. Etiqueta izq., cifra der. */
  .sort .s-total { display: none; align-items: baseline; justify-content: space-between; gap: 10px;
    margin-top: 12px; padding-top: 11px; border-top: 1px solid rgba(255,255,255,.11);
    font-weight: 800; font-size: 13px; color: rgba(207,230,247,.7);
    opacity: 0; transform: translateY(6px); transition: opacity .45s ease, transform .45s cubic-bezier(.2,1.1,.3,1); }
  .sort .s-total.on { display: flex; }
  .sort .s-total .tv { font-family: var(--font-round); font-size: 20px; color: #FFD86B;
    font-variant-numeric: tabular-nums; }
  .sort .s-total.in { opacity: 1; transform: none; }
  .sort .s-total.in .tv { animation: sortTotalGlow 1.4s ease-out both; }
  @keyframes sortTotalGlow {
    0% { text-shadow: 0 0 0 rgba(255,216,107,0) } 30% { text-shadow: 0 0 22px rgba(255,216,107,.95) }
    100% { text-shadow: 0 0 8px rgba(255,216,107,.25) } }
  /* El pulso vive en un ::after y no en la lista de animaciones de la fila: si
     compartiera lista pisaría el rowFloat y la fila volvería a quedarse quieta. */
  .sort .s-credit.pulse::after { content: ''; position: absolute; inset: 0; border-radius: inherit;
    pointer-events: none; animation: sortPulse 1.15s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes sortPulse { 0% { box-shadow: 0 0 0 0 rgba(255,216,107,.5) } 100% { box-shadow: 0 0 0 20px rgba(255,216,107,0) } }
  /* Confeti que estalla desde el centro y luego cae */
  .sort .cftb { position: absolute; left: 50%; top: 40%; width: 9px; height: 14px; border-radius: 3px;
    pointer-events: none; z-index: 4; opacity: 0; animation: cftBurst 2.8s cubic-bezier(.12,.7,.3,1) both; }
  @keyframes cftBurst {
    0% { opacity: 0; transform: translate(0,0) rotate(0deg) scale(.4) }
    8% { opacity: 1 }
    32% { transform: translate(var(--dx), var(--dy)) rotate(220deg) scale(1) }
    100% { opacity: 0; transform: translate(calc(var(--dx) * 1.35), 76vh) rotate(880deg) scale(.9) } }
  /* Ruta A1→C1 cuando no hay módulos convalidados.
     Semántica: NO es una barra de progreso. Es la ruta *prevista*. El trazo que
     se dibuja es un reconocimiento del camino (tenue, se apaga al llegar), no
     terreno conquistado. Solo A1 queda encendido — ahí estás. C1 es una meta
     hueca: se ve, no se ha alcanzado. */
  .sort .s-route { position: relative; display: flex; justify-content: space-between; align-items: flex-start;
    width: 100%; margin-top: 6px; padding: 2px 2px 0; }
  .sort .s-route i { position: absolute; left: 9px; right: 9px; top: 8px; height: 4px; border-radius: 999px;
    background: rgba(255,255,255,.12); }
  /* Del oro (donde estás) al azul apagado (lo que falta): se lee de un vistazo */
  .sort .s-route i::after { content: ''; position: absolute; inset: 0; width: 0; border-radius: 999px;
    background: linear-gradient(90deg, rgba(255,216,107,.75) 0%, rgba(255,216,107,.28) 22%, rgba(159,194,218,.22) 60%, rgba(159,194,218,.16) 100%);
    transition: width 3.5s cubic-bezier(.48,.04,.24,1); }
  .sort .s-route.go i::after { width: 100%; }
  /* Un destello recorre la ruta cada pocos segundos: sigue viva, sin avanzar */
  .sort .s-route.done i::before { content: ''; position: absolute; inset: 0; border-radius: 999px;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.3) 50%, transparent 100%);
    background-size: 38% 100%; background-repeat: no-repeat;
    animation: routeShimmer 4.2s cubic-bezier(.45,.05,.5,.95) 1s infinite; }
  @keyframes routeShimmer { 0% { background-position: -42% 0 } 60%,100% { background-position: 142% 0 } }
  /* Cabeza de cometa: recorre la ruta una vez y se apaga al llegar */
  .sort .s-route u { position: absolute; top: 10px; left: 9px; width: 0; height: 0; z-index: 2; opacity: 0;
    transition: left 3.5s cubic-bezier(.48,.04,.24,1), opacity .6s ease; }
  .sort .s-route.go u { left: calc(100% - 9px); opacity: 1; }
  .sort .s-route.done u { opacity: 0; }
  .sort .s-route u::before { content: ''; position: absolute; left: -9px; top: -9px; width: 18px; height: 18px;
    border-radius: 50%; background: radial-gradient(circle, #FFF6DA 0%, rgba(255,216,107,.8) 40%, rgba(255,216,107,0) 72%); }
  .sort .s-route span { position: relative; z-index: 1; display: flex; flex-direction: column;
    align-items: center; gap: 7px; }
  /* TODOS los nodos respiran, siempre — no solo el de "estás aquí". La escala
     la lleva SIEMPRE una animación (nunca una declaración suelta en `.lit`),
     porque una animación gana a la declaración y dejaría el nodo clavado. */
  .sort .s-route span b { width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box;
    background: #10293e; border: 3px solid rgba(255,255,255,.2);
    animation: dotBreathe 5.2s ease-in-out infinite;
    transition: background .45s ease, border-color .45s ease, box-shadow .45s ease; }
  @keyframes dotBreathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.17) } }
  /* Los <span> son los hijos 3..7 del track: antes van el <i> de la línea y el
     <u> del cometa. Cada uno con su periodo, para que no respiren a la vez. */
  .sort .s-route span:nth-child(4) b { animation-duration: 4.3s; animation-delay: .9s; }
  .sort .s-route span:nth-child(5) b { animation-duration: 6.1s; animation-delay: 2.1s; }
  .sort .s-route span:nth-child(6) b { animation-duration: 4.8s; animation-delay: 1.4s; }
  .sort .s-route span:nth-child(7) b { animation-duration: 5.7s; animation-delay: 3s; }
  .sort .s-route span em { font-style: normal; font-weight: 800; font-size: 11px; color: rgba(255,255,255,.4);
    transition: color .45s ease, text-shadow .45s ease, transform .45s cubic-bezier(.2,1.3,.3,1); }
  /* Destello al paso del cometa: se enciende, respira más fuerte y se apaga */
  .sort .s-route span.lit b { background: #FFD86B; border-color: rgba(255,216,107,.35);
    box-shadow: 0 0 14px rgba(255,216,107,.75);
    animation: dotBreatheLit 2.6s ease-in-out infinite; }
  @keyframes dotBreatheLit { 0%,100% { transform: scale(1.16) } 50% { transform: scale(1.36) } }
  .sort .s-route span.lit em { color: #FFD86B; text-shadow: 0 0 12px rgba(255,216,107,.6); transform: scale(1.1); }
  /* "Estás aquí": el único que se queda encendido. Late de tamaño y de luz a la
     vez — dos animaciones que tocan propiedades distintas, así que conviven. */
  .sort .s-route span.lit.hold b { animation: dotBreatheLit 2.6s ease-in-out infinite,
    routeHere 3.4s ease-in-out infinite; }
  @keyframes routeHere {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,216,107,.5), 0 0 12px rgba(255,216,107,.7) }
    55% { box-shadow: 0 0 0 10px rgba(255,216,107,0), 0 0 26px rgba(255,216,107,1) } }
  .sort .s-route span.lit.hold em { animation: sortLabelBeat 2.8s ease-in-out infinite; }
  @keyframes sortLabelBeat { 0%,100% { transform: scale(1.1) } 50% { transform: translateY(-2px) scale(1.18) } }
  /* Meta: anillo hueco. Visible, deseable, claramente no alcanzado — pero vivo */
  /* Relleno opaco como el resto: con `transparent` se veía el trazo cruzando
     por dentro y el nodo parecía un agujero. La meta se distingue por el aro
     claro y su pulso, no por estar hueca. */
  .sort .s-route span.goal b { background: #10293e; border-color: rgba(207,230,247,.62);
    box-shadow: 0 0 0 0 rgba(207,230,247,.35);
    animation: dotBreathe 4.6s ease-in-out infinite, routeGoal 3.4s ease-in-out infinite; }
  .sort .s-route span.goal em { color: rgba(207,230,247,.7); }
  @keyframes routeGoal {
    0%,100% { box-shadow: 0 0 0 0 rgba(207,230,247,.3) }
    60% { box-shadow: 0 0 0 8px rgba(207,230,247,0) } }
  /* Rótulos que dejan explícito qué es cada extremo */
  .sort .s-rcap { display: flex; justify-content: space-between; margin: 2px 1px 0;
    font-size: 9.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    opacity: 0; transition: opacity .6s ease; }
  .sort .s-rcap.in { opacity: 1; }
  .sort .s-rcap span:first-child { color: rgba(255,216,107,.85); }
  .sort .s-rcap span:last-child { color: rgba(207,230,247,.5); }
  /* Fila "desde cero": misma anatomía que una convalidación, otro color */
  .sort .s-credit.zero { background: none; border: 0; padding: 0 2px; }
  .sort .s-credit.zero .cl { background: linear-gradient(155deg, #CDEBFF, #1CB0F6); color: #05263c;
    box-shadow: 0 3px 10px rgba(28,176,246,.28); }
  .sort .s-credit.zero .cx { color: rgba(207,230,247,.75); font-size: 11px; letter-spacing: .06em;
    text-transform: uppercase; background: rgba(255,255,255,.08); border-radius: 999px; padding: 4px 9px; }
  /* CTA: se pinta con el resto (para no provocar otro reflow) pero invisible;
     `in` la trae. Luego respira despacio como todo lo demás. */
  .sort #s-cta .btn { position: relative; overflow: hidden; opacity: 0; }
  .sort #s-cta .btn.in { animation: sortCtaIn .85s cubic-bezier(.2,1.05,.3,1) both,
    ctaFloat 6.7s ease-in-out .85s infinite; }
  @keyframes sortCtaIn {
    0% { opacity: 0; transform: translateY(16px) scale(.97); filter: blur(5px) }
    100% { opacity: 1; transform: none; filter: blur(0) } }
  @keyframes ctaFloat {
    0%,100% { transform: translateY(0) } 47% { transform: translateY(-2.6px) } 76% { transform: translateY(1px) } }
  /* El brillo no se dispara al pintar el botón sino al mostrarlo, y vuelve a
     pasar cada 7.4s: un CTA que brilla una sola vez se apaga para siempre. */
  .sort #s-cta .btn::after { content: ''; position: absolute; top: 0; bottom: 0; width: 55%; left: -70%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
    transform: skewX(-18deg); }
  .sort #s-cta .btn.in::after { animation: sortSheen 7.4s cubic-bezier(.35,0,.3,1) .7s infinite; }
  @keyframes sortSheen { 0% { left: -70% } 16%,100% { left: 130% } }

  /* MENOS MOVIMIENTO — versión calmada, no cadáver.
     Antes esto era `animation:none` + `transition:none` sobre `.sort *`: mataba
     hasta los fundidos y dejaba la pantalla apareciendo a golpes. La norma de
     accesibilidad pide quitar el movimiento grande (desplazamientos, giros,
     paralaje), no prohibir que algo aparezca suavemente. Así que aquí se
     conserva la opacidad y se quita todo lo que se desplaza o gira.
     `html[data-motion="full"]` lo anula — ver prefersReduced() en el JS. */
  @media (prefers-reduced-motion: reduce) {
    /* Sin `transform: none` universal: se lo comería el centrado de .s-col (que
       ES un transform) y la posición en órbita de cada .s-bpos. Solo se apagan
       las animaciones y las transiciones se reducen a opacidad. */
    html:not([data-motion="full"]) .sort,
    html:not([data-motion="full"]) .sort *,
    html:not([data-motion="full"]) .sort *::before,
    html:not([data-motion="full"]) .sort *::after {
      animation: none !important;
      transition-property: opacity !important; transition-duration: .5s !important; }
    /* Reposo visible de lo que arranca desplazado o invisible y dependía de la
       animación para llegar a su sitio. */
    html:not([data-motion="full"]) .sort .s-credit,
    html:not([data-motion="full"]) .sort .s-s,
    html:not([data-motion="full"]) .sort .s-t,
    html:not([data-motion="full"]) .sort .s-t i,
    html:not([data-motion="full"]) .sort .s-panel,
    html:not([data-motion="full"]) .sort .s-ph,
    html:not([data-motion="full"]) .sort .s-total,
    html:not([data-motion="full"]) .sort .s-badge,
    html:not([data-motion="full"]) .sort .s-botiw,
    html:not([data-motion="full"]) .sort #s-cta .btn {
      opacity: 1 !important; transform: none !important; filter: none !important; }
    html:not([data-motion="full"]) .sort .s-route.go i::after { width: 100%; }
    html:not([data-motion="full"]) .sort .s-flash,
    html:not([data-motion="full"]) .sort .s-dust,
    html:not([data-motion="full"]) .sort .cftb,
    html:not([data-motion="full"]) .sort .s-route u,
    html:not([data-motion="full"]) .sort .s-wave,
    html:not([data-motion="full"]) .sort .s-credit .cl::after { display: none !important; }
    html:not([data-motion="full"]) .sort .s-aura { opacity: .5; }
  }

  /* Llegada al mapa: cascada de módulos/nodos convalidados */
  .mod-card.fill-pending { filter: grayscale(1); opacity: .55; }
  .mod-card.fill-in { animation: cardPop .5s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes cardPop { 0% { transform: scale(.94); filter: grayscale(1); opacity: .6 }
    60% { transform: scale(1.04); filter: grayscale(0); opacity: 1 }
    100% { transform: scale(1); filter: grayscale(0); opacity: 1 } }
  .mod-card .fill-flash { position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(circle at 50% 50%, rgba(255,216,107,.85), rgba(255,216,107,0) 70%);
    animation: sortFlash .7s ease-out both; }
  .mod-card .sec-bar .fill { transition: width .7s cubic-bezier(.3,.9,.3,1); }
  .lpath .node.fill-pending { filter: grayscale(1); opacity: .45; }
  .lpath .node.fill-in { animation: nodePop .5s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes nodePop { 0% { transform: scale(.7); opacity: .4 } 55% { transform: scale(1.16); opacity: 1 } 100% { transform: scale(1) } }
  .lpath .node.here-pulse { animation: herePulse 1.1s ease-in-out 3; }
  @keyframes herePulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.1) } }
  .fill-xp { position: absolute; right: 12px; top: 54px; z-index: 40; background: #fff;
    border: 2px solid #FFD86B; border-radius: 999px; padding: 6px 14px; font-weight: 800;
    color: var(--ink); box-shadow: 0 6px 18px rgba(0,0,0,.16); }
  @media (prefers-reduced-motion: reduce) {
    html:not([data-motion="full"]) .mod-card.fill-in,
    html:not([data-motion="full"]) .lpath .node.fill-in,
    html:not([data-motion="full"]) .lpath .node.here-pulse,
    html:not([data-motion="full"]) .mod-card .fill-flash { animation: none !important; }
  }



  /* CTA al panel completo (ruta /dashboard) */
  .dash-cta { display: flex; align-items: center; gap: 12px; width: 100%; margin: 6px 0 18px;
    background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 14px 16px;
    cursor: pointer; text-align: left; font-family: inherit; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .dash-cta .dc-em { font-size: 24px; }
  .dash-cta .dc-txt { flex: 1; }
  .dash-cta b { display: block; font-size: 16.5px; font-weight: 800; color: var(--ink); }
  .dash-cta small { display: block; font-size: 13px; font-weight: 600; color: var(--muted2); margin-top: 2px; }

  /* Lista "esto vamos a practicar": sin contorno de botón */
  .ob-point.plain, .ob-point.big.plain { border: none; background: transparent; box-shadow: none; padding-left: 0; padding-right: 0; }

  /* Test de ubicación dentro del onboarding */
  .pl-count { font-size: 12.5px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase;
    color: var(--muted2); margin-bottom: 8px; }
  .pl-q { font-size: 19px; font-weight: 800; line-height: 1.3; color: var(--ink); margin-bottom: 14px; }
  .ob-opt.pl-opt { font-size: 16px; }
  .pl-skip { display: block; margin: 14px auto 0; border: none; background: none; cursor: pointer;
    font-family: inherit; font-size: 14.5px; font-weight: 700; color: var(--muted2); text-decoration: underline; }
  /* Cada pregunta entra escalonada en vez de aparecer de golpe.
     `backwards` y no `both`: al terminar, el elemento vuelve a sus estilos
     normales y :active sigue dando feedback al pulsar. La clase `enter` solo
     se pone al cambiar de pregunta — al seleccionar una opción se re-renderiza
     y no queremos que todo vuelva a entrar. */
  @keyframes plRise { 0% { opacity: 0; transform: translateY(11px) } 100% { opacity: 1; transform: none } }
  .pl-count.enter { animation: plRise .4s cubic-bezier(.2,.9,.3,1) backwards; }
  .pl-q.enter { animation: plRise .46s cubic-bezier(.2,.9,.3,1) .06s backwards; }
  .pl-opt.enter { animation: plRise .44s cubic-bezier(.2,.9,.3,1) backwards; }
  .pl-opt.enter:nth-child(1) { animation-delay: .14s; }
  .pl-opt.enter:nth-child(2) { animation-delay: .21s; }
  .pl-opt.enter:nth-child(3) { animation-delay: .28s; }
  .pl-opt.enter:nth-child(4) { animation-delay: .35s; }
  .pl-skip.enter { animation: plRise .4s ease .42s backwards; }
  .pl-result { text-align: center; padding: 10px 0; }
  .pl-result .pl-txt { animation: plRise .5s cubic-bezier(.2,.9,.3,1) .2s backwards; }
  .pl-result .pl-sub { animation: plRise .5s cubic-bezier(.2,.9,.3,1) .34s backwards; }
  @media (prefers-reduced-motion: reduce) {
    html:not([data-motion="full"]) .pl-count.enter,
    html:not([data-motion="full"]) .pl-q.enter,
    html:not([data-motion="full"]) .pl-opt.enter,
    html:not([data-motion="full"]) .pl-skip.enter,
    html:not([data-motion="full"]) .pl-result .pl-txt,
    html:not([data-motion="full"]) .pl-result .pl-sub { animation: none !important; }
  }
  /* Colores vía color-mix sobre --blue: los trae el trabajo de tematización por
     institución, para que la insignia siga la marca de cada demo. */
  .pl-badge { width: 96px; height: 96px; margin: 0 auto 14px; border-radius: 28px; background: color-mix(in srgb, var(--blue) 12%, transparent);
    border: 2px solid color-mix(in srgb, var(--blue) 35%, transparent); color: var(--blueDark, #1488C0);
    display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 900;
    animation: fbPop .4s cubic-bezier(.2,1.3,.3,1) both; }
  .pl-txt { font-size: 18px; font-weight: 800; color: var(--ink); }
  .pl-sub { font-size: 14px; font-weight: 600; color: var(--muted2); margin-top: 6px; line-height: 1.4; }

  /* ===== Práctica: los quizzes ya desbloqueados, en un solo sitio =====
     Esta pestaña no enseña nada nuevo: es un atajo a lo que ya abriste en la
     ruta. Por eso es una lista plana —módulo › lección › quizzes— y no repite el
     caminito: quien entra aquí no viene a navegar, viene a repetir un quiz.
     Clases propias (pr-*) aunque se parezcan a las de Vocabulary: son dos
     pestañas distintas y compartir clases ata el retoque de una a la otra. */
  /* Saludo de la Ruta (home) */
  .home-hi { background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 62%, #fff));
    color: #fff; border-radius: 20px; padding: 16px 17px 14px; margin: 2px 2px 16px;
    box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 26%, transparent);
    animation: tr-rise .3s ease both; }
  .home-hi .hh-top { display: flex; align-items: center; gap: 12px; }
  .home-hi .hh-txt { flex: 1 1 auto; min-width: 0; }
  .home-hi .hh-txt b { display: block; font-size: 18px; font-weight: 800; line-height: 1.25;
    color: var(--brand-ink, #fff); }
  .home-hi .hh-txt small { display: block; margin-top: 3px; font-size: 13px; font-weight: 600;
    line-height: 1.35; opacity: .9; }
  .home-hi .hh-ring { position: relative; flex: 0 0 auto; width: 62px; height: 62px; }
  .home-hi .hh-ring svg { display: block; transform: rotate(-90deg); }
  .home-hi .hh-ring circle { fill: none; stroke-width: 7; }
  .home-hi .hh-ring .track { stroke: rgba(255,255,255,.28); }
  .home-hi .hh-ring .prog { stroke: #fff; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .home-hi .hh-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; }
  .home-hi .hh-stats { display: flex; gap: 8px; margin-top: 13px; }
  .home-hi .hh-st { flex: 1; background: rgba(255,255,255,.16); border-radius: 13px; padding: 7px 6px;
    text-align: center; }
  .home-hi .hh-st b { display: block; font-size: 16px; font-weight: 800; }
  .home-hi .hh-st i { display: block; font-style: normal; font-size: 11px; font-weight: 700; opacity: .88; margin-top: 1px; }
  .pr-intro { margin: 2px 2px 18px; }
  .pr-intro b { display: block; font-size: 19px; font-weight: 800; color: var(--ink); }
  .pr-intro small { display: block; margin-top: 3px; font-size: 13px; line-height: 1.4; color: var(--muted); }
  .pr-intro .pr-count { display: inline-block; margin-top: 9px; font-size: 12px; font-weight: 800;
    letter-spacing: .3px; color: var(--amberInk); background: #FDF0D5;
    border-radius: 999px; padding: 5px 11px; }
  .pr-mod { margin-bottom: 24px; }
  .pr-mod-h { display: flex; align-items: center; gap: 9px; margin: 0 2px 10px; }
  /* El número va con el color del módulo: es el mismo código de color que la
     ruta, y sin él tres módulos seguidos se leen como una sola lista larga. */
  .pr-mod-n { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 9px; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; }
  .pr-mod-t { font-size: 17px; font-weight: 800; color: var(--ink); line-height: 1.2; }
  .pr-les { margin-bottom: 13px; }
  .pr-les-h { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 7px; }
  .pr-les-t { flex: 1 1 auto; font-size: 14px; font-weight: 800; color: var(--muted); line-height: 1.25; }
  .pr-les-c { flex: 0 0 auto; font-size: 11px; font-weight: 800; color: var(--muted2);
    font-variant-numeric: tabular-nums; }
  .pr-list { display: flex; flex-direction: column; gap: 8px; }
  /* Mismo relieve de botón (borde inferior grueso) que las tarjetas de la ruta y
     las fichas de Vocabulary: aquí también todo lo que se ve se toca. */
  .pr-q { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    background: #fff; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px;
    padding: 11px 12px; cursor: pointer; font-family: inherit;
    -webkit-tap-highlight-color: transparent; }
  .pr-q:active { transform: translateY(2px); border-bottom-width: 2px; }
  .pr-q-ic { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--blue) 12%, transparent); color: var(--blue); }
  .pr-q-ic svg { display: block; }
  /* Superado = palomita verde; pendiente = triángulo de play. El estado vive en
     el icono y no en un texto suelto, que es lo que se busca de un vistazo. */
  .pr-q.done .pr-q-ic { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .pr-q-t { flex: 1 1 auto; min-width: 0; }
  .pr-q-t b { display: block; font-size: 15px; font-weight: 800; color: var(--ink); line-height: 1.2; }
  .pr-q-t small { display: block; margin-top: 2px; font-size: 12px; font-weight: 700; color: var(--muted2); }
  .pr-q-go { flex: 0 0 auto; display: flex; color: var(--gray); }
  /* El quiz final cierra la lección: se marca con un fondo tenue para que no se
     lea como un mini-quiz más de la fila. */
  .pr-q.final { background: #FAFBFF; border-color: #DCE3F2; }
  .pr-empty { margin: 2px; padding: 20px 18px; background: #fff; border: 2px solid var(--line);
    border-radius: 18px; text-align: center; }
  .pr-empty b { display: block; font-size: 16px; font-weight: 800; color: var(--ink); }
  .pr-empty small { display: block; margin-top: 5px; font-size: 13px; line-height: 1.45; color: var(--muted2); }

</style>

<!-- Mascota. El servidor sustituye este marcador por el pack que use el demo:
     'ozito' (capas SVG + CSS) o 'boti' (SVG + resortes en JS). Ver
     src/lib/demo-page.ts y public/demo-assets/mascots/README.md.
     Abierto suelto, sin servidor, el marcador se queda tal cual y la pagina
     funciona sin mascota. -->
<!--MASCOT-SCRIPTS-->
<!-- La biblioteca de Vocabulary. Va aparte y no incrustada porque esta pagina se
     sirve con `no-store`: lo que viva dentro se redescarga entero en cada
     visita. Suelto lo cachea el navegador, y es el trozo que mas pesa y menos
     cambia. Sin `defer` ni `async` a proposito: tiene que haber definido
     window.VOCAB antes de que corra el script de abajo.
     Al editar vocab.js hay que subir el ?v= o quedaran copias viejas en cache. -->
<script src="vocab.js?v=2"></script>
<!-- Los items de "¿para que se usa?" del examen de vocabulario. Aparte de
     vocab.js porque son otra cosa (texto escrito a mano, no la biblioteca) y
     porque cambian por su cuenta. Mismo trato: sin defer, y subir el ?v= al
     editarlo. -->
<script src="vocab-quiz.js?v=1"></script>
<!-- El contenido del curso ya no viaja como archivos sueltos: se pide a
     /api/course/bundle con el pase que trae la pagina. Asi no se lo lleva nadie
     con una sola peticion, y guardar el HTML no guarda las lecciones. -->
<script>
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// CONFIGURACION DEL DEMO
// El servidor inyecta window.DEMO antes de este script (ver src/lib/demo-page.ts).
// Abierto suelto, sin servidor, DEMO no existe y todo cae a los valores de
// siempre — asi este archivo se sigue pudiendo abrir a mano para depurar.
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
const DEMO = window.DEMO || {};
const CFG = {
  colors: DEMO.colors || {},
  // goal vacio = se conserva el anillo de progreso de siempre; si se define un
  // emoji o una imagen, ese icono sustituye al anillo.
  icons: Object.assign({ streak: '🔥', goal: '', dashboard: '📊' }, DEMO.icons),
  copy: Object.assign({
    audience: 'estudiante',
    dashboardCta: 'Ver mi panel de progreso',
    dashboardCtaSub: 'Racha, XP, niveles y logros',
  }, DEMO.copy),
  brand: DEMO.brand || {},
  mascot: DEMO.mascot || { engine: 'script', global: 'Boti', name: 'Boti', emoji: '🤖',
                           kind: 'robot guía', fullName: 'Boti', headIcon: 'mascots/boti/boti_head.svg',
                           artboard: { width: 757.6, height: 1139.5 } },
  map: DEMO.map || {},
};

// Un icono puede ser un emoji o una imagen subida. iconHTML() decide cual.
function iconHTML(v, cls) {
  if (!v) return '';
  const c = cls ? ' class="' + cls + '"' : '';
  return /^(https?:|\/|data:)/.test(v) || /\.(svg|png|jpg|webp)$/i.test(v)
    ? '<img' + c + ' src="' + v + '" alt="" aria-hidden="true">'
    : '<span' + c + ' aria-hidden="true">' + v + '</span>';
}

// El texto del curso trae marcadores en vez del nombre de la mascota, para que
// el mismo contenido sirva a cualquier demo. Ver public/demo-assets/README.md.
function tpl(s) {
  return typeof s === 'string' && s.indexOf('{{') >= 0
    ? s.replace(/\{\{mascotFull\}\}/g, CFG.mascot.fullName || CFG.mascot.name || '')
       .replace(/\{\{mascotEmoji\}\}/g, CFG.mascot.emoji || '')
       .replace(/\{\{mascotKind\}\}/g, CFG.mascot.kind || '')
       .replace(/\{\{mascot\}\}/g, CFG.mascot.name || '')
       .replace(/\{\{audience\}\}/g, CFG.copy.audience)
    : s;
}
// Sustituye los marcadores en todo el arbol del curso, una sola vez al arrancar.
function applyTokens(node, seen) {
  seen = seen || new Set();
  if (!node || typeof node !== 'object' || seen.has(node)) return node;
  seen.add(node);
  for (const k of Object.keys(node)) {
    const v = node[k];
    if (typeof v === 'string') node[k] = tpl(v);
    else if (v && typeof v === 'object') applyTokens(v, seen);
  }
  return node;
}

// --- Mascota -----------------------------------------------------------------
// Dos motores: 'script' (la mascota trae su propio JS, como Boti) y 'layers'
// (capas SVG animadas por CSS, como Ozito). El resto del codigo no distingue.
function mascotRatio() {
  const a = CFG.mascot.artboard;
  return a && a.width ? a.height / a.width : 1.5;
}
function mascotHeadIcon() { return CFG.mascot.headIcon || ''; }
function mascotEngine() {
  return CFG.mascot.engine === 'layers' ? (window.Mascot ? 'layers' : null)
       : (window[CFG.mascot.global || 'Boti'] ? 'script' : null);
}
function mascotMount(el, opts) {
  const eng = mascotEngine();
  if (!el || !eng) return;
  if (eng === 'script') window[CFG.mascot.global || 'Boti'].mount(el, opts || {});
  else window.Mascot.mount(el, opts || {});
}
// Monta las mascotas que ya tienen su hueco fijo en el HTML (la del onboarding).
function mascotMountStatic() {
  const eng = mascotEngine();
  if (!eng) return;
  if (eng === 'script') window[CFG.mascot.global || 'Boti'].mountAll();
  else mascotMount(document.getElementById('ob-boti'), { interactive: true });
}

// --- Iconos y fondos ---------------------------------------------------------
// Los iconos que viven en HTML estatico (no en plantillas) se sustituyen una vez
// al arrancar. Los que se generan dentro de plantillas usan iconHTML() directo.
function applyIcons() {
  document.querySelectorAll('.streak-chip .sc-em').forEach(el => {
    el.outerHTML = iconHTML(CFG.icons.streak, 'sc-em');
  });
  // Manda el icono que haya subido el demo; la cabeza de la mascota es sólo el
  // respaldo. Al reves —que era como estaba— el icono propio nunca se veia.
  document.querySelectorAll('.appbar-en').forEach(img => {
    // 'none' quita el icono y deja el titulo solo. Si no, manda el que haya
    // subido el demo y la cabeza de la mascota queda de respaldo.
    if (CFG.brand.appbarIcon === 'none') { img.hidden = true; return; }
    const ic = CFG.brand.appbarIcon || mascotHeadIcon();
    if (ic) { img.src = ic; img.classList.toggle('brand-icon', !!CFG.brand.appbarIcon); }
  });
  if (!CFG.icons.goal) return;   // sin icono propio se conserva el anillo
  document.querySelectorAll('.goal-chip .gc-ring').forEach(ring => {
    ring.outerHTML = iconHTML(CFG.icons.goal, 'gc-em');
  });
}

// Fondo del mapa de cada modulo: el demo puede subir los suyos; cualquier hueco
// cae al de fabrica (modulebg1..5.png).
function moduleBg(n) {
  const custom = (CFG.map.backgrounds || [])[n - 1];
  return custom || ('modulebg' + n + '.png');
}
// La ola de la cabecera del onboarding. De serie, ola.svg repitiendo sin costura
// y pintada del color del demo. Si el demo sube su propia imagen se usa esa y se
// estira de lado a lado: una imagen cualquiera no empalma consigo misma.
// brand.ola = 'none' la quita.
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// Bienvenida y presencia de marca.

// El splash ya viene pintado desde el servidor (splashHTML en demo-page.ts).
// Aquí solo se decide cuándo se va: por tiempo o porque lo tocan.
function mountSplash() {
  const sp = document.getElementById('demo-splash');
  if (!sp) return;
  // Con "menos movimiento" no tiene sentido retener la pantalla: la puesta en
  // escena no se ve, así que se acorta a lo justo para leer la frase.
  const dur = prefersReduced() ? 900 : Math.max(600, +sp.dataset.dur || 2600);
  let gone = false;
  const close = () => {
    if (gone) return; gone = true;
    sp.classList.add('out');
    // Se retira del DOM al acabar la transición: dejarlo aunque sea invisible
    // mantiene vivas sus animaciones infinitas por nada.
    setTimeout(() => sp.remove(), 900);
  };
  // Saltable con un toque, como se pidió: impacto de marca sin hacer esperar.
  sp.addEventListener('click', close);
  sp.addEventListener('touchstart', close, { passive: true });
  setTimeout(close, dur);
}

// La imagen de la marca de agua: el logo de la cabecera por defecto, el icono
// de la barra superior (con la cabeza de la mascota de respaldo), o una imagen
// propia subida sólo para esto.
function watermarkSrc() {
  const b = CFG.brand || {};
  const src = b.watermarkSource || 'logo';
  if (src === 'custom') return b.watermarkImage || '';
  if (src === 'icon') return brandIconSrc();
  return b.logo || '';
}

// El icono de la marca: el de la barra superior, con la cabeza de la mascota de
// respaldo. Ojo con 'none': significa "la barra va sin icono", no "no hay
// imagen", así que ahí se cae al respaldo igual que si estuviera vacío.
function brandIconSrc() {
  const b = CFG.brand || {};
  if (b.appbarIcon === 'none') return mascotHeadIcon() || '';
  return b.appbarIcon || mascotHeadIcon() || '';
}

// La imagen que representa a la institución allí donde sólo cabe una. El logo
// de la cabecera manda, pero hay demos que no tienen logo y guardan su
// logotipo en el icono de la barra (democip): mirar sólo `brand.logo` los
// dejaría sin marca.
function brandMarkSrc() {
  return (CFG.brand && CFG.brand.logo) || brandIconSrc();
}

// El logo de la institución, repetido donde toca. Cada sitio se enciende por
// separado desde el panel; sin imagen cargada esto no hace nada.
function mountBrandLogos() {
  const logo = (CFG.brand && CFG.brand.logo) || '';
  const spots = (CFG.brand && CFG.brand.logoSpots) || {};
  const alt = escapeHtml((CFG.brand && CFG.brand.headerText) || CFG.institution || '');

  if (spots.watermark) {
    const wmSrc = watermarkSrc();
    if (wmSrc) {
      const b = CFG.brand || {};
      const pos = ['tl','tc','tr','cc','bl','bc','br'].includes(b.watermarkPos) ? b.watermarkPos : 'bl';
      const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
      const wm = document.createElement('img');
      wm.className = 'brand-wm wm-' + pos;
      wm.style.setProperty('--wm-x', num(b.watermarkX, 12) + 'px');
      wm.style.setProperty('--wm-y', num(b.watermarkY, 10) + 'px');
      wm.style.setProperty('--wm-size', num(b.watermarkSize, 84) + 'px');
      wm.style.setProperty('--wm-op', String(num(b.watermarkOpacity, 0.28)));
      wm.src = wmSrc; wm.alt = ''; wm.setAttribute('aria-hidden', 'true');
      document.body.appendChild(wm);
    }
  }

  // Logo flotante en la pantalla de módulo. Cuelga del propio <section>, no de
  // <body> como la marca de agua: así .screen{display:none} ya lo apaga en el
  // resto del recorrido y no hay que vigilar los cambios de pantalla.
  if (spots.modules) {
    const scr = document.getElementById('screen-module');
    const markSrc = brandMarkSrc();
    if (scr && markSrc && !scr.querySelector('.brand-float')) {
      const fl = document.createElement('img');
      fl.className = 'brand-float';
      fl.src = markSrc; fl.alt = ''; fl.setAttribute('aria-hidden', 'true');
      scr.appendChild(fl);
    }
  }

  if (!logo) return;
  if (spots.onboarding) {

    // Sobre la barra de pasos: se ve desde el primer segundo y no empuja nada,
    // porque .ob-top ya reserva su alto.
    const top = document.querySelector('#screen-onboard .ob-top');
    if (top && !top.previousElementSibling?.classList.contains('brand-spot')) {
      top.insertAdjacentHTML('beforebegin',
        `<img class="brand-spot" src="${logo}" alt="${alt}">`);
    }
  }
}

/** El logo para las pantallas de celebración (fondo oscuro). '' si no toca. */
function brandSpotHTML(onDark) {
  const logo = (CFG.brand && CFG.brand.logo) || '';
  const spots = (CFG.brand && CFG.brand.logoSpots) || {};
  if (!logo || !spots.celebrations) return '';
  const alt = escapeHtml(CFG.brand.headerText || CFG.institution || '');
  return `<img class="brand-spot${onDark ? ' on-dark' : ''}" src="${logo}" alt="${alt}">`;
}

function applyOla() {
  const el = document.getElementById('ob-ola');
  const scr = document.getElementById('screen-onboard');
  if (!el || !scr) return;

  // La ola NO sale por defecto: es de quien la pide. Vacio = sin ola;
  // 'default' = la de serie (ola.svg); cualquier otra cosa se toma por la URL de
  // una imagen propia. En los dos casos se repite a lo ancho, tantas veces como
  // diga olaRepeats.
  const v = (CFG.brand.ola || '').trim();
  if (!v || v === 'none') { el.hidden = true; scr.classList.remove('has-ola'); return; }
  const own = v !== 'default';
  el.hidden = false;
  // Una imagen propia se REPITE igual que la de serie: casi siempre se dibuja
  // para eso, y estirarla a lo ancho de la pantalla la deforma. Quien tenga una
  // que no empalme consigo misma pone olaFit 'stretch' y se estira de lado a lado.
  el.classList.toggle('stretch', own && CFG.brand.olaFit === 'stretch');
  el.style.setProperty('--ola-img', 'url("' + (own ? v : 'ola.svg') + '")');
  // Cuantas crestas caben a lo ancho. Por defecto 15; el demo puede pedir otras.
  const reps = Number(CFG.brand.olaRepeats);
  el.style.setProperty('--ola-n', String(reps > 0 ? Math.round(reps) : 15));
  if (CFG.colors.ola) el.style.setProperty('--ola', CFG.colors.ola);
  scr.classList.add('has-ola');
}

// Ajuste horizontal de UN boton de ese mapa (px; + derecha). Se dial desde el
// panel arrastrando el boton sobre el previo: un fondo propio nunca trae el
// caminito donde lo tienen los de fabrica, y cada curva cae en un sitio.
// buttonShift (un corrimiento para todo el mapa) se sigue leyendo por si quedo
// guardado de antes.
function mapShift(n, i) {
  const all = CFG.map.buttonOffsets || [];
  const perButton = Array.isArray(all[n - 1]) ? all[n - 1][i] : undefined;
  const whole = (CFG.map.buttonShift || [])[n - 1];
  return (typeof perButton === 'number' ? perButton : 0) + (typeof whole === 'number' ? whole : 0);
}

async function loadCourse() {

  if (!r.ok) throw new Error('curso '+ r.status);

// Resumen compacto para el panel de familia/profe (/dashboard). Mismo origen ⇒

const SUMMARY_KEY = 'ingles_web_summary_v1';
function computeSummary() {
  const prof = loadProfile() || {};
  const LEVEL = ['A1', 'A2', 'B1', 'B2', 'C1'];
  const allDone = allLessons.every(l => isLessonCompleted(l.id));
  let ai = course.modules.reduce((a, m, i) => (isLessonUnlocked(m.lessons[0].id) && !m.lessons.every(l => isLessonCompleted(l.id))) ? i : a, -1);
  if (ai < 0) ai = allDone ? course.modules.length - 1 : 0;
  const sk = moduleSkill(course.modules[ai]);
  const days = PROGRESS['__days'] || [];
  const wa = new Date(); wa.setHours(0, 0, 0, 0); wa.setDate(wa.getDate() - 6);
  const daysThisWeek = days.filter(ds => new Date(ds + 'T00:00:00') >= wa).length;
  const tmap = PROGRESS['__time'] || {};
  const weekSecs = Object.keys(tmap).filter(ds => new Date(ds + 'T00:00:00') >= wa).reduce((s, k) => s + (tmap[k] || 0), 0);
  // Patron de los ultimos siete dias, de hace 6 a hoy: un '1' por dia con
  // practica. El panel dibuja QUE dias entro, no cuantos, y repartir el
  // recuento a ojo seria inventarse el calendario de la semana.
  let weekPattern = '';
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
    weekPattern += days.indexOf(dayKey(d)) >= 0 ? '1' : '0';
  }

  // esta jugando. El panel traia una lista fija de cuatro (A1..B2) y un relleno
  // sacado del promedio de destrezas; ninguna de las dos cosas es el progreso
  // real, y un curso puede tener tres modulos o seis.
  const levels = course.modules.map((m, i) => m.level || LEVEL[i] || ('M' + (i + 1)));

  let acc = 0;
  const bnd = course.modules.map(m => { const s = acc; acc += moduleXpMax(m); return { start: s, end: acc }; });

    name: prof.name || '', goal: prof.goal || 15,
    weekPattern: weekPattern, xp: totalXp(),
    levels: levels, levelPct: levelPct,
    levelIdx: ai, level: LEVEL[ai],
    streak: streakDays(), daysThisWeek: daysThisWeek,
    todayMin: Math.floor((tmap[dayKey()] || 0) / 60),
    weekMin: Math.floor(weekSecs / 60),
    goalMin: +prof.goal || 15,
    lessonsDone: allLessons.filter(l => isLessonCompleted(l.id)).length,
    lessonsTotal: allLessons.length,

}

  if (!sc) return Math.min(1, getScroll(lesson.id) * unlockedFraction(lesson));
  const clientH = sc.clientHeight;
  const blocks = document.querySelectorAll('#lesson-body .block');
  let sum = 0; blocks.forEach(b => { sum += b.offsetHeight; });
  const n = blocks.length;
  const remaining = Math.max(0, total - n);
  if (remaining === 0 || n === 0) {
    const max = sc.scrollHeight - clientH;
    return max >= 100 ? Math.min(1, Math.max(0, sc.scrollTop / max)) : 1;
  }
  const avg = sum / n;
  const fullMax = Math.max(1, sc.scrollHeight + remaining * avg - clientH);
  return Math.min(1, Math.max(0, sc.scrollTop / fullMax));
}
function moduleProgress(mod) {
  if (!mod.lessons.length) return 0;
  let t = 0;
  for (const l of mod.lessons) { if (isQuizCompleted(l.id)) t += 1; else t += wholeProgress(l); }
  return t / mod.lessons.length;
}
function quizCount(lesson) {
  let n = lesson.quizQuestions.length;
  for (const b of lesson.contentBlocks) n += (b.miniQuiz ? b.miniQuiz.length : 0);
  return n;
}
function readingMinutes(lesson) {
  let chars = 0; for (const b of lesson.contentBlocks) chars += (b.markdown || '').length;
  return Math.max(1, Math.ceil(chars / 1000));
}

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// TTS
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
let _speaking = false;
let _utter = null;    // la locucion en curso
let _onEnd = null;    // su callback de cierre, para poder llamarlo al cortarla

// Corta lo que suene y avisa a quien lo lanzo, para que limpie su estado (por
// ejemplo la ficha que se habia puesto en "sonando").
function stopSpeak() {
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  const cb = _onEnd;
  _utter = null; _onEnd = null; _speaking = false;
  if (cb) cb();
}

// rate: 0.45 esta calibrado para frases largas del quiz. Una palabra suelta a
// esa velocidad se arrastra y deja de sonar a palabra, asi que el vocabulario
// pasa la suya.
// interrupt: que hacer si ya hay algo sonando.
//   sin el (quiz)         → volver a pulsar PARA. Es un boton de play/stop.
//   con el (vocabulario)  → calla lo anterior y suena lo nuevo. Ahi cada palabra
//                           es su propio boton, y pulsar otra quiere decir
//                           "esta otra", no "silencio".
function speak(text, onStart, onEnd, rate, interrupt) {
  try {
    const synth = window.speechSynthesis;
    if (!synth) return;
    const sonaba = _speaking;
    if (sonaba) { stopSpeak(); if (!interrupt) return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate || 0.45; u.pitch = 1.0;
    // Los callbacks solo valen si esta locucion sigue siendo la vigente: al
    // interrumpir, el 'onend' tardio de la anterior llegaba despues del
    // 'onstart' de la nueva y dejaba el estado en "no suena nada".
    u.onstart = () => { if (_utter !== u) return; _speaking = true; if (onStart) onStart(); };
    const done = () => {
      if (_utter !== u) return;
      _utter = null; _onEnd = null; _speaking = false;
      if (onEnd) onEnd();
    };
    u.onend = done; u.onerror = done;
    _utter = u; _onEnd = onEnd;
    // Un cancel() no vacia la cola al instante: el speak() inmediatamente
    // despues se pierde y no suena nada. Un tick de margen y entra.
    if (sonaba) setTimeout(() => { if (_utter === u) synth.speak(u); }, 60);
    else synth.speak(u);
  } catch (e) {}
}

// Enable the in-page debug controls (complete lesson / reset progress / undo /
