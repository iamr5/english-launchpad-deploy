function pbar(progress, completed, color) {
  const pct = Math.round(progress * 100);
  const label = completed
    ? `<div class="pct done">Completado</div>`
    : `<div class="pct">${pct}%</div>`;
  const bg = (color && !completed) ? `;background:${color}` : '';
  const w = completed ? 98 : (pct > 0 ? Math.max(pct, 8) : 0);
  return `<div class="pbar"><div class="fill ${completed ? 'done' : ''}" style="width:${w}%${w === 0 ? ';min-width:12px' : ''}${bg}"></div>${label}</div>`;
}

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// COURSE (entry screen)
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// The next thing the learner should do: first unlocked, not-yet-completed
// lesson (with its module). Null when the whole route is finished.
function nextActiveLesson() {
  for (const m of course.modules) {
    for (const l of m.lessons) {
      if (isLessonUnlocked(l.id) && !isLessonCompleted(l.id)) return { lesson: l, mod: m };
    }
  }
  return null;
}
// Display helpers: a meaningful lesson name (the titulo "hook") + its topic
// subtitle, module names without the "Módulo N:" prefix, and the colored number
// badges — modules use a fixed tasteful palette; lessons ramp green→orange-red.
const MODULE_COLORS = ['#3FAA24', '#1CB0F6', '#CE82FF', '#FF9600', '#FF6FA5'];
function tituloOf(lesson) { return lesson.contentBlocks.find(b => b.type === 'titulo') || {}; }
function lessonName(lesson) { return tituloOf(lesson).title || lesson.title; }
function lessonTopic(lesson) { return tituloOf(lesson).subtitle || ''; }
function moduleName(m) { return m.title.replace(/^M[oó]dulo\s*\d+\s*[:.\-–—]?\s*/i, ''); }
function moduleMinutes(m) { return m.lessons.reduce((s, l) => s + readingMinutes(l), 0); }
// Under an hour → exact minutes; an hour or more → hours, with minutes rounded to
// the closest multiple of 5 (e.g. 61→"1 h", 69→"1 h 10 min").
function fmtMinutes(min) {
  if (min < 60) return `${min} min`;
  const r = Math.round(min / 5) * 5, h = Math.floor(r / 60), m = r % 60;
  return m ? `${h} h ${m} min` : `${h} h`;
}
function moduleBadgeColor(idx) { return MODULE_COLORS[idx] || MODULE_COLORS[MODULE_COLORS.length - 1]; }
function lessonBadgeColor(i, total) { const t = total > 1 ? i / (total - 1) : 0; return `hsl(${Math.round(120 - 108 * t)} 70% 46%)`; }

function courseHero() {
  const na = nextActiveLesson();
  if (!na) {
    return `<div class="foot-done">${icon('emoji_events', 22, '#E0A800')}<span>¡Completaste el curso! Pronto habrá más.</span></div>`;
  }
  const started = getScroll(na.lesson.id) > 0.02 || isReadingCompleted(na.lesson.id);
  const { col, cold } = footColors(course.modules.indexOf(na.mod));
  const isFirst = na.lesson.id === allLessons[0].id;
  const kicker = isFirst ? 'Tu primera lección' : `Tu próxima lección · ${escapeHtml(moduleName(na.mod))}`;
  return `<div class="foot-kicker" style="color:${col}">${kicker}</div>
    <div class="foot-title">${escapeHtml(lessonName(na.lesson))}</div>
    <button class="cta-btn" id="cta-continue" style="background:${col};--lip:${cold}">${started ? 'Continuar' : 'Empezar'} ${arrowFwd(19, '#fff', 2.8)}</button>`;
}
// Per-module accent color (the module's main color: top bar, button caps, ring, popovers,
// AND the module cards on the course list). Keyed by image number; falls back to the badge
// color. The page background is separate (BG_TINT).
// Un color por modulo. El demo puede sustituirlos; los de aqui son los de fabrica.
const MOD_DEFAULT = ['#3faa24', '#ff6ba0', '#b875f5', '#1cb0f6', '#fd5d04'];
const MOD_ACCENT = (function () {
  const c = (CFG.colors.modules || []).slice(0, 5);
  const out = {};
  for (let i = 0; i < 5; i++) out[i + 1] = c[i] || MOD_DEFAULT[i];
  return out;
})();
function modAccent(i) { return MOD_ACCENT[(i % 5) + 1] || moduleBadgeColor(i); }

// La barra fija del pie del curso (rótulo, título y botón). Por defecto va del
// color del módulo al que pertenece la lección pendiente, como el resto del
// mapa. Un demo puede pedir con colors.footerColor:"action" que use el color de
// acción —el mismo del acierto en los quizzes— para que el CTA principal sea
// del mismo color en toda la app, que es como se comporta el producto real.
function footColors(i) {
  if ((CFG.colors || {}).footerColor === 'action') return { col: 'var(--green)', cold: 'var(--greenDark)' };
  const c = modAccent(i);
  return { col: c, cold: shadeHex(c, -0.24) };
}

// La cabecera del curso: logotipo de AprendoEnglish por defecto; un demo puede
// poner su propio texto (brand.headerText) o su logo (brand.logo).
function brandHTML() {
  if (CFG.brand.logo)
    return '<img class="brand-logo" src="' + CFG.brand.logo + '" alt="' +
           escapeHtml(CFG.brand.headerText || '') + '">';
  if (CFG.brand.headerText)
    return '<span class="brand">' + escapeHtml(CFG.brand.headerText) + '</span>';
  return '<span class="brand"><span class="b-aprendo">Aprendo</span>' +
         '<span class="b-english">English</span><span class="b-com">.com</span></span>';
}
// Preload the per-module backdrops (modulebg1..5) once while the user is on the modules
// list, holding references so they stay in the browser's image cache — entering a module
// then paints its PNG immediately instead of fetching/decoding on first view.
let _bgPrecached = false;
const _bgReady = {};   // n -> promesa que resuelve cuando ese fondo ya se puede pintar
const _bgDone = {};    // n -> true en cuanto esa promesa resolvio (para no esperar en balde)
function precacheModuleBgs() {
  if (_bgPrecached) return;
  _bgPrecached = true;
  window._bgCache = [];
  for (let n = 1; n <= 5; n++) precacheModuleBg(n);
}
// Devuelve (y memoriza) la promesa de UN fondo. Se resuelve tambien si la imagen
// falla: el mapa se muestra igual, sin fondo, en vez de dejar al alumno esperando.
function precacheModuleBg(n) {
  if (_bgReady[n]) return _bgReady[n];
  const img = new Image();
  img.decoding = 'async';
  img.src = moduleBg(n);
  window._bgCache = window._bgCache || [];
  window._bgCache.push(img); // keep a reference so it isn't evicted
  _bgReady[n] = (img.decode ? img.decode() : Promise.resolve())
    .catch(() => {})
    .then(() => new Promise(res => (img.complete ? res() : (img.onload = img.onerror = res))))
    .then(() => { _bgDone[n] = true; });
  return _bgReady[n];
}

// El mapa no se muestra hasta que su fondo esta descargado. Mientras tanto, una
// ruedita del color del demo. Si tarda demasiado se muestra igual: mas vale un
// mapa sin fondo que un alumno mirando girar una rueda.
const MAP_WAIT_MS = 6000;
function waitForModuleBg(n) {
  return Promise.race([
    precacheModuleBg(n),
    new Promise(res => setTimeout(res, MAP_WAIT_MS)),
  ]);
}
function showSpinner(on) {
  let el = document.getElementById('map-spinner');
  if (on) {
    if (!el) {
      el = document.createElement('div');
      el.id = 'map-spinner';
      el.innerHTML = '<div class="sp-ring"></div>';
      document.body.appendChild(el);
    }
    el.hidden = false;
  } else if (el) {
    el.hidden = true;
  }
}
// El panel de progreso se abre como HOJA SOBRE la app, sin salir de ella: la
// app sigue detras del velo y cerrar devuelve al mismo sitio, que es lo que
// distingue una hoja de un cambio de pagina.
// Dentro va la misma /<slug>/padres del panel, incrustada. Mismo origen ⇒ lee
// el resumen de localStorage sin backend, y la ficha no se duplica en dos
// sitios que despues se separan.
function openDashboard() {
  // El resumen se reescribe justo antes de abrir: si el alumno acaba de
  // terminar una leccion tiene que verla contada ya, no en la proxima visita.
  try { saveSummary(); } catch (e) {}
  // El slug va en la ruta, no en un query param: asi el panel sabe de que demo
  // es y puede pintar la marca de la institucion y su mascota. Sin slug caemos
  // en la direccion vieja, que sirve la plantilla generica.
  // /padres (y no /dashboard) porque lo que se pide aqui es SU ficha, no el
  // panel con la pestana del profesor. ?yo=1 = la ficha es de quien la abre;
  // &sheet=1 = va incrustada, asi que sin margenes de pagina.
  const base = DEMO.slug ? '/' + encodeURIComponent(DEMO.slug) + '/padres' : '/demo-dashboard';
  const ov = document.getElementById('pnl-overlay'), fr = document.getElementById('pnl-frame');
  // Sin overlay (plantilla vieja) se cae al comportamiento de antes en vez de
  // dejar el boton muerto.
  if (!ov || !fr) {
    const url = base + '?yo=1';
    try { (window.top || window).location.href = url; } catch (e) { window.location.href = url; }
    return;
  }
  // Si warmDashboard() ya lo cargo, NO se vuelve a asignar src: eso lo haria
  // recargar y devolveria justo el blanco que se quiere evitar. Se repinta por
  // encima, que es instantaneo.
  if (!fr.getAttribute('src')) fr.src = base + '?yo=1&sheet=1';
  else {
    try {
      const w = fr.contentWindow;
      if (w && typeof w.__yoRepintar === 'function') w.__yoRepintar();
    } catch (e) { /* aun cargando: pintara solo, y ya con el resumen recien escrito */ }
  }
  ov.hidden = false;
  document.body.classList.add('pnl-open');
  // Un frame de margen: si se pone .shown en el mismo tick que se quita [hidden]
  // el navegador no tiene estado inicial desde el que animar y la hoja aparece
  // de golpe.
  requestAnimationFrame(() => ov.classList.add('shown'));
  document.addEventListener('keydown', pnlEsc);
}
function closeDashboard() {
  const ov = document.getElementById('pnl-overlay');
  if (!ov) return;
  ov.classList.remove('shown');
  document.body.classList.remove('pnl-open');
  document.removeEventListener('keydown', pnlEsc);
  // El iframe se deja cargado a proposito. Vaciarlo obligaria a recargar en la
  // siguiente apertura, que es exactamente el blanco que se quiere evitar.
  setTimeout(() => { ov.hidden = true; }, 260);
}
function pnlEsc(e) { if (e.key === 'Escape') closeDashboard(); }
// El panel se precarga en cuanto la app esta en pie, en un hueco libre. Si el
// iframe empieza a cargar con la hoja ya abierta se ve el blanco mientras
// llega; precargado, abrir es solo descorrer.
function warmDashboard() {
  const fr = document.getElementById('pnl-frame');
  if (!fr || fr.getAttribute('src')) return;
  const go = () => {
    try { saveSummary(); } catch (e) {}
    const base = DEMO.slug ? '/' + encodeURIComponent(DEMO.slug) + '/padres' : '/demo-dashboard';
    fr.src = base + '?yo=1&sheet=1';
  };
  // En un hueco libre: cargar el panel no puede competir con el arranque de la
  // app, que es lo que el alumno esta mirando.
  if (window.requestIdleCallback) requestIdleCallback(go, { timeout: 4000 });
  else setTimeout(go, 1500);
}
// La Ruta es el "home": antes de las lecciones va un saludo con el nombre del
// onboarding y un resumen de por dónde va el alumno. Todo son datos reales que

function homeGreeting() {

  return `<div class="home-hi">

        <small>${hechas === 0 ? 'Empecemos por tu primera lección.' : `Llevas ${hechas} de ${total} lecciones. Sigamos donde lo dejaste.`}</small>
      </div>

        <svg width="62" height="62" viewBox="0 0 62 62" aria-hidden="true">
          <circle class="track" cx="31" cy="31" r="26"/>
          <circle class="prog" cx="31" cy="31" r="26"
                  stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct / 100)).toFixed(1)}"/>
        </svg>

function renderCourse() {

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// PESTAÑAS DEL INICIO (Ruta / Vocabulary / Práctica)
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// Andamio. La ruta es la de siempre; Vocabulary llega vacia a proposito: lo que
// se pidio es el sitio, no el contenido. Las tres viven dentro de #screen-course
// y se turnan, en vez de ser tres .screen: el inicio es UNA pantalla con
// pestañas, y separarlas obligaria a duplicar la barra en cada una.
function showHomeTab(tab) {
  // Cualquier cosa que no sea una pestaña conocida cae en la ruta: es la de
  // siempre y la unica que no puede fallar.
  const cual = (tab === 'vocab' || tab === 'practice') ? tab : 'ruta';
  const body = document.getElementById('course-body');
  const vocab = document.getElementById('vocab-body');
  const prac = document.getElementById('practice-body');
  const foot = document.getElementById('course-foot');
  if (!body || !vocab) return;
  body.hidden = cual !== 'ruta';
  vocab.hidden = cual !== 'vocab';
  if (prac) prac.hidden = cual !== 'practice';
  // El pie es el "continuar con la leccion": pertenece a la ruta y en las otras
  // pestañas no significa nada.
  if (foot) foot.hidden = cual !== 'ruta';
  document.querySelectorAll('#home-tabs .tab').forEach(b => {
    const on = b.getAttribute('data-tab') === cual;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  // Cada pestaña empieza por arriba: heredar el desplazamiento de la otra deja
  // a Vocabulary abierta por la mitad de una pantalla que ni se ha visto.
  const sc = document.querySelector('#screen-course .scroll');
  if (sc) sc.scrollTop = 0;
  // Salir de Vocabulary cierra el tema que estuviera abierto: al volver se entra
  // por el indice, que es de donde se entra siempre.
  if (cual === 'vocab') renderVocab(); else VOPEN = null;
  if (cual === 'practice') renderPractice();
}

// CONTENIDO DE ARRANQUE. La biblioteca entera vive en demo-assets/vocab.js, que
// se carga en una etiqueta aparte mas arriba. No esta aqui a proposito: esta
// pagina se sirve con `no-store`, asi que lo que se incruste en ella se
// redescarga en cada visita, y el vocabulario es la parte que mas pesa y menos
// cambia. Como archivo suelto lo cachea el navegador.
// Ahi estan tambien las reglas para editarlo (nada de ingles repetido, español
// latino neutro, texto que pueda leer el TTS).
// El respaldo `|| []` es por si la peticion del archivo falla: la pestaña sale
// vacia, que es feo, pero el resto de la app arranca igual.
const VOCAB = window.VOCAB || [];
// Los usos escritos a mano para el tercer tipo de pregunta del examen (ver
// demo-assets/vocab-quiz.js). Sin el archivo, ese tipo simplemente no sale y el
// examen se hace con los otros dos.
const VOCAB_USE = window.VOCAB_USE || {};

// Escuchada o no. Nada mas: cuantas veces le has dado al play no dice que la
// palabra sea tuya, y una barra que se llena sola con repeticiones lo estaria
// afirmando. Esto solo mide cobertura — que has pasado por ella.
function vocabHeard() { return PROGRESS['__vocab'] = PROGRESS['__vocab'] || {}; }
function isHeard(en) { return !!vocabHeard()[en]; }
function chipHeard(chip) { return chip.w.filter(p => isHeard(p[0])).length; }
function vocabTotals() {
  let heard = 0, total = 0;
  VOCAB.forEach(sec => sec.chips.forEach(c => { total += c.w.length; heard += chipHeard(c); }));
  return { heard, total };
}

// Dos vistas dentro de la MISMA pestaña: el indice de temas y el tema abierto.
// Se navega en el sitio, con flecha de volver, en vez de abrir una hoja encima:
// asi la pestaña se comporta como una pantalla y no como un dialogo.
let VOPEN = null;    // {si, ci} del tema abierto, o null en el indice
let VSCROLL = 0;     // scroll del indice, para devolverlo tal cual al volver

function renderVocab() {
  const el = document.getElementById('vocab-body');
  if (!el) return;
  if (VOPEN) renderVocabTema(el); else renderVocabIndice(el);
}

function openVocabChip(si, ci) {
  if (!VOCAB[si] || !VOCAB[si].chips[ci]) return;
  const sc = document.querySelector('#screen-course .scroll');
  VSCROLL = sc ? sc.scrollTop : 0;
  VOPEN = { si, ci };
  renderVocab();
  if (sc) sc.scrollTop = 0;           // el tema empieza por arriba
}

function closeVocabChip() {
  VOPEN = null;
  renderVocab();
  // Se vuelve al punto exacto del indice: bajar otra vez hasta el tema que
  // acabas de cerrar es el tipo de trabajo que nadie deberia repetir.
  const sc = document.querySelector('#screen-course .scroll');
  if (sc) sc.scrollTop = VSCROLL;
}

// Se repinta en cada entrada: las barras dependen del progreso.
function renderVocabIndice(el) {
  const t = vocabTotals();
  let html = `<div class="vocab-intro">
      <b>Tu biblioteca de palabras</b>
      <small>Elige un tema y escucha sus palabras. La barra marca cuántas ya escuchaste.</small>
      <span class="vi-count">${t.heard} de ${t.total} escuchadas</span>
    </div>`;
  VOCAB.forEach((sec, si) => {
    html += `<div class="vsec"><div class="vsec-h">${escapeHtml(sec.s)}</div><div class="vsec-grid">` +
      sec.chips.map((c, ci) => {
        const h = chipHeard(c), pc = Math.round(h / c.w.length * 100);
        return `<button class="vchip${h === c.w.length ? ' full' : ''}" id="vchip-${si}-${ci}"
                onclick="openVocabChip(${si}, ${ci})">
          <span class="vchip-e">${c.e}</span>
          <span class="vchip-n">${escapeHtml(c.n)}</span>
          <span class="vchip-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                aria-valuenow="${pc}" aria-label="${h} de ${c.w.length} escuchadas"><i style="width:${pc}%"></i></span>
          <span class="vchip-c">${h}/${c.w.length}${isExamPassed(si, ci) ? '<b class="vchip-ex">examen ✓</b>' : ''}</span>
        </button>`;
      }).join('') + `</div></div>`;
  });
  el.innerHTML = html;
}

const VS_SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>' +
  '<path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

// El tema abierto: la flecha para subir un nivel y sus palabras en fichas.
function renderVocabTema(el) {
  const chip = VOCAB[VOPEN.si].chips[VOPEN.ci];
  const h = chipHeard(chip), pc = Math.round(h / chip.w.length * 100);
  const examOk = isExamPassed(VOPEN.si, VOPEN.ci);
  el.innerHTML = `<div class="vd-top">
      <button class="vd-back" onclick="closeVocabChip()" aria-label="Volver a los temas"></button>
      <div class="vd-t"><b>${chip.e} ${escapeHtml(chip.n)}</b>
        <small id="vd-sub">${h} de ${chip.w.length} escuchadas</small></div>
    </div>
    <div class="vd-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pc}"><i style="width:${pc}%"></i></div>
    <button class="vd-exam${examOk ? ' done' : ''}" onclick="openVocabExam(${VOPEN.si}, ${VOPEN.ci})">
      <span class="vd-exam-ic">${examOk ? checkBold(19, '#3FAA24', 3.2) : playIcon(15, '#1CB0F6')}</span>
      <span class="vd-exam-t"><b>${examOk ? 'Examen aprobado' : 'Hacer el examen'}</b>
        <small>${chip.w.length} ${chip.w.length === 1 ? 'pregunta' : 'preguntas'}, una por palabra</small></span>
    </button>
    <div class="vd-grid">` +
    chip.w.map(([en, es]) => `<button class="vcard${isHeard(en) ? ' heard' : ''}" data-w="${escapeHtml(en)}">
        <span class="vcard-ic">${VS_SPEAKER}</span>
        <span class="vcard-en">${escapeHtml(en)}</span>
        <span class="vcard-es">${escapeHtml(es)}</span>
      </button>`).join('') +
    `</div>`;
  el.querySelectorAll('.vcard').forEach(c => c.onclick = () => vocabSay(c));
}

// Escuchar marca la palabra. Una sola vez: volver a darle no suma nada, porque
// no hay nada mas que sumar.
function vocabSay(card) {
  const en = card.getAttribute('data-w');
  if (!en) return;
  if (!isHeard(en)) { vocabHeard()[en] = 1; saveProgress(PROGRESS); }
  card.classList.add('heard', 'speaking');
  // 0.85 y no el 0.45 del quiz: una palabra suelta a esa velocidad no se
  // reconoce como palabra. interrupt: pulsar otra palabra mientras suena una
  // significa "quiero esta", no "callate".
  speak(en, null, () => card.classList.remove('speaking'), 0.85, true);
  if (!VOPEN) return;
  // Solo la cabecera del tema: repintar la rejilla entera con cada toque
  // cortaria la animacion de la ficha que se acaba de pulsar. El indice se
  // recalcula solo al volver.
  const chip = VOCAB[VOPEN.si].chips[VOPEN.ci];
  const h = chipHeard(chip), pc = Math.round(h / chip.w.length * 100);
  const sub = document.getElementById('vd-sub');
  if (sub) sub.textContent = `${h} de ${chip.w.length} escuchadas`;
  const bar = document.querySelector('#vocab-body .vd-bar');
  if (bar) { bar.setAttribute('aria-valuenow', pc); const f = bar.querySelector('i'); if (f) f.style.width = pc + '%'; }
}

// EXAMEN DEL TEMA
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// UNA pregunta por palabra: el examen de un tema tiene tantas preguntas como
// palabras hay en el tema, ni una mas. Lo que cambia es la FORMA de preguntar —
// cada palabra tiene hasta tres posibles y se sortea una en cada intento:
//   A · escuchar y elegir el español      (mc con audio)
//   B · escuchar y escribirla en ingles   (writing con audio)
//   C · ¿para que se usa?                 (mc, solo si esta escrita en vocab-quiz.js)
// El motor no es nuevo: son las mismas piezas del quiz de la ruta —renderQuiz,
// quizProgress, la hoja y las dos vueltas de openMiniQuiz—. Aqui solo se
// fabrican los items.

// Aprobados, por tema. Aparte de __vocab a proposito: esa barra mide "escuchada"
// y no puede empezar a significar tambien "dominada".
function vocabExams() { return PROGRESS['__vocabExam'] = PROGRESS['__vocabExam'] || {}; }
function examKey(si, ci) { return si + '-' + ci; }
function isExamPassed(si, ci) { return !!vocabExams()[examKey(si, ci)]; }

// Dos palabras del mismo tema pueden compartir traduccion. Ahi "¿como se dice X
// en ingles?" tiene dos respuestas buenas y el corrector solo acepta una, asi
// que esas palabras se quedan sin el tipo B.
function esUnicoEnTema(chip, es) {
  const k = wNorm(es);
  return chip.w.filter(p => wNorm(p[1]) === k).length === 1;
}

// Los distractores salen del MISMO tema: es lo que hace que la pregunta valga
// algo —elegir entre cuatro colores, no entre un color y tres animales—. Solo
// si el tema se queda corto se completan con el resto de la seccion.
function vocabDistractors(en, es, chip, sec, n) {
  const vistos = new Set([wNorm(es)]);
  const pool = [];
  const add = (list) => (list || []).forEach(p => {
    const k = wNorm(p[1]);
    if (p[0] !== en && !vistos.has(k)) { vistos.add(k); pool.push(p[1]); }
  });
  add(chip.w);
  if (pool.length < n) (sec.chips || []).forEach(c => { if (c !== chip) add(c.w); });
  return shuffle(pool).slice(0, n);
}

// Devuelve un item en el formato exacto que ya entiende renderQuiz.
function vocabItem(pair, chip, sec) {
  const en = pair[0], es = pair[1], use = VOCAB_USE[en];
  const tipos = ['mc'];
  // El dictado es para palabras y frases cortas: escribir de oido "Excuse me,
  // where is the bathroom?" no mide vocabulario, mide paciencia.
  if (en.split(/\s+/).length <= 3 && esUnicoEnTema(chip, es)) tipos.push('writing');
  if (use && use.q && use.d && use.d.length >= 3) tipos.push('use');
  const t = tipos[Math.floor(Math.random() * tipos.length)];
  if (t === 'writing') return { type: 'writing', audio: en, question: `¿Cómo se dice «${es}» en inglés?`, accepted: [en] };
  if (t === 'use') {
    const opts = shuffle([use.q].concat(use.d.slice(0, 3)));
    return { type: 'mc', question: `¿Para qué se usa «${en}»?`, options: opts, correctIndex: opts.indexOf(use.q) };
  }
  const opts = shuffle([es].concat(vocabDistractors(en, es, chip, sec, 3)));
  return { type: 'mc', audio: en, question: '¿Qué significa esta palabra?', options: opts, correctIndex: opts.indexOf(es) };
}

function vocabExamRound(chip, sec) { return shuffle(chip.w.map(p => vocabItem(p, chip, sec))); }

// La hoja es la del mini-quiz de la ruta, con su barra segmentada, su banner y
// su repaso: se falla una, se repasa al final; se vuelve a fallar, se repite el
// examen entero. Lo unico propio es de donde salen las preguntas y que se
// guarda al aprobar.
function openVocabExam(si, ci) {
  const sec = VOCAB[si], chip = sec && sec.chips[ci];
  if (!chip || !chip.w.length) return;
  const overlay = document.getElementById('overlay'), sheet = document.getElementById('sheet');
  let round, redo, idx, correct, results, failedQs, answered = 0;
  _dismissGuard = () => answered > 0;   // ya contestaste algo: preguntar antes de salir
  function startRound(qs, isRedo) { round = qs; redo = isRedo; idx = 0; correct = 0; results = []; failedQs = []; step(); }
  function step() {
    sheet.classList.remove('result');
    sheet.innerHTML = `<div class="handle"></div>
      <div class="q-top"><div class="segs" id="mq-segs"></div><span class="q-counter" id="mq-counter"></span></div>
      <div class="quiz-host" id="mq-host"></div>`;
    renderQuiz(document.getElementById('mq-host'), round[idx],
      () => { correct++; answered++; results[idx] = true; advance(); },
      () => { answered++; results[idx] = false; failedQs.push(round[idx]); advance(); });
    quizProgress(document.getElementById('mq-segs'), document.getElementById('mq-counter'), round.length, idx, results);
  }
  function advance() { if (idx < round.length - 1) { idx++; step(); } else finish(); }
  function finish() {
    if (failedQs.length === 0) return pass();
    if (redo) return showFail();
    return showRedo(failedQs.slice());
  }
  function result(iconName, iconColor, cls, title, sub, btnCls, btnLabel, onAction) {
    sheet.classList.add('result');
    sheet.innerHTML = `<div class="handle"></div><div class="center-col">
      <div class="result-icon ${cls}">${icon(iconName, cls === 'ok' ? 40 : 38, iconColor)}</div>
      <div class="result-title">${title}</div>
      <div class="result-sub">${sub}</div>
      <button class="btn ${btnCls}" id="mq-action">${btnLabel}</button>
      </div>`;
    document.getElementById('mq-action').onclick = onAction;
  }
  function pass() {
    result('check', '#2E7D1A', 'ok', '¡Examen aprobado!',
      `${chip.e} ${escapeHtml(chip.n)} — ${chip.w.length} ${chip.w.length === 1 ? 'palabra' : 'palabras'}`,
      'green', 'Continuar', () => {
        stopSpeak(); closeOverlay();
        vocabExams()[examKey(si, ci)] = { p: 1, ts: Date.now() };
        touchDay(); saveProgress(PROGRESS);
        renderVocab();
      });
  }
  function showRedo(failed) {
    const one = failed.length === 1;
    result('refresh', '#5C5159', 'no', 'Repasemos',
      `Fallaste ${failed.length} ${one ? 'palabra' : 'palabras'}. Vuelve a intentarla${one ? '' : 's'} para aprobar.`,
      'amber', `Repasar${one ? '' : ` (${failed.length})`}`, () => { stopSpeak(); startRound(shuffle(failed), true); });
  }
  function showFail() {
    result('refresh', '#5C5159', 'no', 'Casi lo tienes',
      'Fallaste otra vez. Repite el examen completo para aprobarlo.',
      'blue', 'Reintentar', () => { stopSpeak(); startRound(vocabExamRound(chip, sec), false); });
  }
  sheet.dataset.dismissible = 'true'; overlay.classList.add('active');
  startRound(vocabExamRound(chip, sec), false);
}

  show('progress');

  const LEVEL = ['A1', 'A2', 'B1', 'B2', 'C1'];
  // Level = the module you're in; progress within it = base lesson XP against the
  // module's XP span (mission bonus excluded — that only competes on the league).
  const xpLessons = lessonXpTotal(), xp = totalXp();
  let cum = 0;
  const bounds = course.modules.map(m => { const s = cum; cum += moduleXpMax(m); return { start: s, end: cum }; });
  const allDone = allLessons.every(l => isLessonCompleted(l.id));
  let ai = course.modules.reduce((a, m, i) =>
    (isLessonUnlocked(m.lessons[0].id) && !m.lessons.every(l => isLessonCompleted(l.id))) ? i : a, -1);
  if (ai < 0) ai = allDone ? course.modules.length - 1 : 0;
  const bd = bounds[ai], span = bd.end - bd.start;
  const mp = allDone ? 1 : (span ? Math.min(1, Math.max(0, (xpLessons - bd.start) / span)) : 1);
  const lvl = LEVEL[ai];
  const ringTitle = allDone ? '¡Completaste la ruta! 🏆'

  // League: DEMO peers scaled to the course's total XP (backend pending); your

    `<span class="nm">${r.nm}</span><span class="xp">${fmtXp(r.xp)}</span></div>`).join('');
  // Constancia: apunta al nivel que el alumno está cursando AHORA (no siempre B2).
  // Se desbloquea al terminar todas las lecciones de ese módulo; luego pasa al siguiente.
  const CEFR = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];

      </div>
      <div class="pg-flame">${iconHTML(CFG.icons.streak, 'fl')}<div class="txt"><b>${streak}</b><span>días de racha</span></div></div>
    </div>
  </div>

  <div class="card pg-hero">
    <div class="pg-row">
      <div class="pg-ring">
        <svg width="104" height="104" viewBox="0 0 104 104">
          <circle class="track" cx="52" cy="52" r="45"/>
          <circle class="prog" cx="52" cy="52" r="45" stroke="${modAccent(ai)}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - mp)).toFixed(1)}"/>
        </svg>
        <div class="cap"><b>${LEVEL[ai]}</b></div>
      </div>
      <div class="pg-info">
        <h2 class="pg-hello" style="font-size:18px">${ringTitle}</h2>
        <div class="pg-sub">${fmtXp(Math.min(xpLessons, bd.end))} / ${fmtXp(bd.end)} XP para tu próximo nivel</div>
        <div class="pg-track">${track}</div>
      </div>
    </div>
  </div>

  <div class="pg-band">
    <div class="pg-chip"><span class="em">⭐</span><div class="k">${fmtXp(xp)}</div><div class="l">XP total</div></div>
    <div class="pg-chip"><span class="em">🏆</span><div class="k">#${myPos}</div><div class="l">Puesto en el aula</div></div>
  </div>

  <div class="card" style="cursor:default">

function shareList() { try { return JSON.parse(localStorage.getItem('ae_share') || '[]'); } catch (e) { return []; } }
function saveShareList(a) { localStorage.setItem('ae_share', JSON.stringify(a)); }
function shareListHTML() {
  const l = shareList();

  return l.map(m => `<div class="share-item"><span>👀 ${escapeHtml(m)}</span><button class="share-x" data-mail="${escapeHtml(m)}" aria-label="Quitar">✕</button></div>`).join('');

function bindShare() {
  const inp = document.getElementById('share-mail');
  const add = document.getElementById('share-add');
  const list = document.getElementById('share-list');
  if (!inp || !add || !list) return;
  const refresh = () => { list.innerHTML = shareListHTML(); };
  add.onclick = async () => {
    const v = (inp.value || '').trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { toast('Escribe un correo válido'); return; }
    const label = add.textContent;
    add.disabled = true; add.textContent = 'Enviando…'; toast('Enviando invitación…');
    let ok = false;
    try {
      const s = (typeof computeSummary === 'function') ? computeSummary() : {};
      const r = await fetch('/api/public/share-invite', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: v,
          studentName: s.name || 'Un alumno',
          level: s.level || 'A1',
          streak: s.streak || 0,
          todayMin: s.todayMin || 0,
          lessonsDone: s.lessonsDone || 0
        })
      });
      const j = await r.json().catch(() => ({}));
      // Sin esto, cinco fallos muy distintos (correo sin configurar, dominio sin
      // verificar, límite de intentos, rechazo del proveedor) se veían todos
      // como el mismo "Intenta de nuevo" y no había forma de saber cuál era.
      if (!j.ok) console.warn('[share-invite]', r.status, j);
      if (r.ok && j.ok) { ok = true; toast('Invitación enviada a ' + v); }
      else if (j.reason === 'domain_not_verified') { ok = true; toast('Invitado guardado. El envío de correos se activa en unas horas.'); }
      else if (j.reason === 'email_not_configured') toast('El envío de correos no está configurado en este entorno.');
      else if (j.reason === 'emails_disabled') toast('El envío de correos está desactivado ahora mismo.');
      else if (j.reason === 'recipient_suppressed') toast('Ese correo no acepta mensajes nuestros.');
      else if (j.reason === 'rate_limited') toast('Demasiados intentos. Espera una hora y vuelve a probar.');
      else if (j.reason === 'invalid_input' || j.reason === 'invalid_body') toast('Ese correo no es válido.');
      else toast('No pudimos enviar la invitación. Intenta de nuevo.');
    } catch (e) {
      console.warn('[share-invite] la petición no llegó al servidor:', e);
      toast('No pudimos enviar la invitación. Intenta de nuevo.');
    }
    if (ok) {
      const l = shareList();
      if (!l.includes(v)) l.push(v);
      saveShareList(l); inp.value = ''; refresh();
    }
    add.disabled = false; add.textContent = label;
  };
  list.onclick = (e) => {
    const b = e.target.closest('.share-x'); if (!b) return;
    saveShareList(shareList().filter(m => m !== b.getAttribute('data-mail')));
    refresh();
  };
}

// Tint a hex toward black (amt<0) or white (amt>0); |amt| is the mix fraction.
function shadeHex(hex, amt) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt), c = v => ('0' + Math.round(v).toString(16)).slice(-2);
  return '#' + c(r + (t - r) * p) + c(g + (t - g) * p) + c(b + (t - b) * p);
}
// Hue (0–360) of a hex color — used to tint the blue guidebook icons per module.
function hexHue(hex) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if (!d) return 0;
  let hue = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  hue *= 60; if (hue < 0) hue += 360;
  return hue;
}

    if (showing) fb = fbBanner(isCorrect, opts[correctIndex].text);

      <button class="btn blue" id="q-next" ${(!showing && selected === null) ? 'disabled' : ''}>${showing ? 'Siguiente' : 'Confirmar'}</button>`;
    wireAudio(host, q);
    if (!showing) host.querySelectorAll('.opt').forEach(b => b.onclick = () => { selected = +b.getAttribute('data-i'); draw(); });
    const nb = host.querySelector('#q-next');
    let go = null;
    if (showing) go = armAutoNext(host, nb, isCorrect, () => { markActivity(); (isCorrect ? onCorrect : onIncorrect)(); });
    nb.onclick = () => {
      if (!showing) { if (selected === null) return; markActivity(); showing = true; draw(); }
      else if (go) go();
    };
  }
  draw();
}

function renderRebuild(host, q, onCorrect, onIncorrect) {
  const correctWords = q.correctSentence.split(' ');
  const shuffled = shuffle(q.wordBlocks);
  let selected = [], usedIdx = new Set(), showing = false, isCorrect = false, speaking = false;
  function draw() {
    const ans = selected.length ? selected.map((w, i) => `<div class="word-chip" data-si="${i}"><span>${escapeHtml(w)}</span><span class="wx" aria-hidden="true">✕</span></div>`).join('') : '';
    const blocks = shuffled.map((w, i) => `<div class="block-chip ${usedIdx.has(i) ? 'used' : ''}" data-bi="${i}">${escapeHtml(w)}</div>`).join('');
    let fb = '';
    if (showing) fb = fbBanner(isCorrect, q.correctSentence);
    host.innerHTML = `<div class="q-kicker">Escucha y ordena las palabras</div><div class="q-question">${escapeHtml(q.question)}</div>
      <div class="speaker${speaking ? ' playing' : ''}" id="spk">${speakerSvg(40, speaking ? '#1488C0' : '#1CB0F6')}<div class="lbl">escuchar</div></div>
      <div class="answer-area">${ans}</div>
      <div class="blocks">${blocks}</div><div class="fb-slot">${fb}</div>
      <button class="btn blue" id="q-next" ${(!showing && selected.length === 0) ? 'disabled' : ''}>${showing ? 'Siguiente' : 'Confirmar'}</button>`;
    host.querySelector('#spk').onclick = () => {
      if (speaking) return;
      speak(q.correctSentence, () => { speaking = true; draw(); }, () => { speaking = false; draw(); });
    };
    if (!showing) {
      host.querySelectorAll('[data-bi]').forEach(b => { const i = +b.getAttribute('data-bi'); if (!usedIdx.has(i)) b.onclick = () => { usedIdx.add(i); selected.push(shuffled[i]); draw(); }; });
      host.querySelectorAll('[data-si]').forEach(b => b.onclick = () => {
        const si = +b.getAttribute('data-si'); const word = selected[si]; selected.splice(si, 1);
        for (const idx of usedIdx) { if (shuffled[idx] === word) { usedIdx.delete(idx); break; } } draw();
      });
    }
    const nb = host.querySelector('#q-next');
    let go = null;
    if (showing) go = armAutoNext(host, nb, isCorrect, () => { markActivity(); (isCorrect ? onCorrect : onIncorrect)(); });
    nb.onclick = () => {
      if (!showing) {
        if (!selected.length) return;
        markActivity();
        isCorrect = selected.length === correctWords.length && selected.every((w, i) => w === correctWords[i]);
        showing = true; draw();
      } else if (go) go();
    };
  }
  draw();
}

function renderTap(host, q, onCorrect, onIncorrect) {
  let tapped = null, showing = false, isCorrect = false;
  function correctedSentence() { const t = q.sentenceTokens.slice(); t[q.errorTokenIndex] = q.correctedToken; return t.join(' '); }
  function draw() {
    const tokens = q.sentenceTokens.map((tk, i) => {
      let cls = 'token';
      if (!showing) { if (tapped === i) cls += ' sel'; }
      else { if (i === q.errorTokenIndex) cls += ' err'; else if (tapped === i && !isCorrect) cls += ' dim'; }
      return `<div class="${cls}" data-ti="${i}">${escapeHtml(tk)}</div>`;
    }).join('');
    let fb = '';
    if (showing) fb = fbBanner(isCorrect, correctedSentence());
    host.innerHTML = `<div class="q-kicker">Encuentra el error</div><div class="q-question">${escapeHtml(q.question)}</div><div class="tokens">${tokens}</div><div class="fb-slot">${fb}</div>
      <button class="btn blue" id="q-next" ${(!showing && tapped === null) ? 'disabled' : ''}>${showing ? 'Siguiente' : 'Confirmar'}</button>`;
    if (!showing) host.querySelectorAll('[data-ti]').forEach(b => b.onclick = () => { const i = +b.getAttribute('data-ti'); tapped = (tapped === i) ? null : i; draw(); });
    const nb = host.querySelector('#q-next');
    let go = null;
    if (showing) go = armAutoNext(host, nb, isCorrect, () => { markActivity(); (isCorrect ? onCorrect : onIncorrect)(); });
    nb.onclick = () => {
      if (!showing) { if (tapped === null) return; markActivity(); isCorrect = tapped === q.errorTokenIndex; showing = true; draw(); }
      else if (go) go();
    };
  }
  draw();
}

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// WRITING — corrector de respuesta libre
//
// Modelo tomado de Duolingo:
//   1. No hay UNA respuesta correcta: hay un conjunto de aceptadas.
//   2. Antes de comparar se normaliza: fuera mayúsculas, tildes y signos.
//   3. Se tolera UN dedazo (distancia de edición 1) siempre que lo escrito no
//      sea, a su vez, una palabra real — por eso Duolingo acepta "te" por "the"
//      pero no "he".
//
// A eso le sumamos un candado que Duolingo no necesita y este curso sí: la
// tolerancia NUNCA puede tapar una diferencia gramatical. "work" está a un solo
// carácter de "works", así que sin W_INFLEX el alumno aprobaría "He work" como
// si fuera un dedazo — y la -S es justamente lo que enseña la lección.
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

// Se expanden ANTES de borrar apóstrofes, para que "I'm happy" e "I am happy"
// terminen siendo la misma cadena de tokens.
const W_CONTR = [
  [/\bi'?m\b/g, 'i am'], [/\bit'?s\b/g, 'it is'], [/\bhe'?s\b/g, 'he is'],
  [/\bshe'?s\b/g, 'she is'], [/\bthat'?s\b/g, 'that is'], [/\bwhat'?s\b/g, 'what is'],
  [/\bwe'?re\b/g, 'we are'], [/\bthey'?re\b/g, 'they are'], [/\byou'?re\b/g, 'you are'],
  [/\bdon'?t\b/g, 'do not'], [/\bdoesn'?t\b/g, 'does not'], [/\bdidn'?t\b/g, 'did not'],
  [/\bisn'?t\b/g, 'is not'], [/\baren'?t\b/g, 'are not'], [/\bcan'?t\b/g, 'can not'],
  [/\bi'?ve\b/g, 'i have'], [/\bi'?ll\b/g, 'i will'], [/\bi'?d\b/g, 'i would'],
];
function wNorm(s) {
  let t = String(s == null ? '' : s);
  t = t.replace(/[\u2018\u2019\u02BC\u0060\u00B4]/g, "'").replace(/[\u201C\u201D]/g, '"');
  t = t.normalize('NFD').replace(/[\u0300-\u036f]/g, '');   // fuera tildes / diéresis
  t = t.toLowerCase();
  for (var i = 0; i < W_CONTR.length; i++) t = t.replace(W_CONTR[i][0], W_CONTR[i][1]);
  t = t.replace(/[^a-z0-9\s]/g, ' ');                        // fuera signos (. , ! ? ¿ ¡ ' " -)
  return t.replace(/\s+/g, ' ').trim();
}
function wLev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 1) return 2;            // sólo importa saber si es <= 1
  let prev = []; for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
// Terminaciones que en inglés CARGAN gramática: si la única diferencia es una de
// éstas, no es un dedazo, es el error que la lección quiere cazar.
const W_INFLEX = ['s', 'es', 'd', 'ed', 'ing', 'ies'];
function wIsInflection(u, r) {
  const short = u.length < r.length ? u : r, long = u.length < r.length ? r : u;
  if (!long.startsWith(short)) return /y$/.test(short) && long === short.slice(0, -1) + 'ies';
  return W_INFLEX.indexOf(long.slice(short.length)) !== -1;
}
// Lexicón del curso: toda palabra inglesa que aparezca en el material. Da la
// regla "si lo que escribiste es una palabra real, no es dedazo". Se arma una vez.
let _wLex = null;
function wLexicon() {
  if (_wLex) return _wLex;
  _wLex = new Set();
  const c = (typeof COURSE_DATA !== 'undefined' && COURSE_DATA) || (typeof course !== 'undefined' && course) || null;
  const eat = (s) => { const p = wNorm(s).split(' '); for (let i = 0; i < p.length; i++) if (p[i]) _wLex.add(p[i]); };
  const eatQ = (q) => {
    if (!q) return;
    if (q.options) q.options.forEach(eat);
    if (q.correctSentence) eat(q.correctSentence);
    if (q.wordBlocks) q.wordBlocks.forEach(eat);
    if (q.sentenceTokens) q.sentenceTokens.forEach(eat);
    if (q.correctedToken) eat(q.correctedToken);
    if (q.accepted) q.accepted.forEach(eat);
  };
  try {
    (c && c.modules || []).forEach((m) => (m.lessons || []).forEach((l) => {
      (l.quizQuestions || []).forEach(eatQ);
      (l.contentBlocks || []).forEach((b) => (b.miniQuiz || []).forEach(eatQ));
    }));
    // La biblioteca de vocabulario cuenta como material: el examen dicta esas
    // palabras y muchas están a un carácter unas de otras (beer/bear,
    // ship/sheep). Sin ellas aquí, la indulgencia del dedazo taparía justo la
    // palabra que se está preguntando.
    (typeof VOCAB !== 'undefined' ? VOCAB : []).forEach((s) => (s.chips || []).forEach((ch) => (ch.w || []).forEach((p) => eat(p[0]))));
  } catch (e) { /* lexicón parcial: sólo perdemos indulgencia, nunca corrección */ }
  return _wLex;
}
function wTypoOk(u, r, lex) {
  if (u === r) return true;
  if (r.length <= 3) return false;         // "the"/"he": demasiado corto para arriesgar
  if (wIsInflection(u, r)) return false;   // la -s es la lección, no un dedazo
  if (wLev(u, r) > 1) return false;
  if (lex && lex.has(u)) return false;     // regla Duolingo: es una palabra real
  return true;
}
// -> { ok, typo, canonical, reason }
function gradeWriting(input, q) {
  const canonical = (q.accepted && q.accepted[0]) || '';
  const user = wNorm(input);
  const out = { ok: false, typo: false, canonical: canonical, reason: null };
  if (!user) return out;
  const accepted = (q.accepted || []).map(wNorm);
  if (accepted.indexOf(user) !== -1) { out.ok = true; return out; }
  // trampas declaradas: se marcan mal, pero con una explicación concreta
  const rej = q.reject || [];
  for (let i = 0; i < rej.length; i++) if (wNorm(rej[i][0]) === user) { out.reason = rej[i][1]; return out; }
  if (!q.strict) {
    const lex = wLexicon();
    for (let a = 0; a < accepted.length; a++) {
      const U = user.split(' '), R = accepted[a].split(' ');
      if (U.length !== R.length) continue;
      let typos = 0, fail = false;
      for (let i = 0; i < R.length; i++) {
        if (U[i] === R[i]) continue;
        if (typos === 0 && wTypoOk(U[i], R[i], lex)) typos++;
        else { fail = true; break; }
      }
      if (!fail && typos === 1) { out.ok = true; out.typo = true; return out; }
    }
  }
  return out;
}

function renderWriting(host, q, onCorrect, onIncorrect) {
  let showing = false, res = null, val = '';
  function banner() {
    if (res.ok && res.typo) return '<div class="fb-banner ok">' + checkBold(26, '#fff', 3.4) + '<span>¡Bien hecho! Ojo con el dedazo: <b>' + escapeHtml(res.canonical) + '</b></span></div>';
    if (res.ok) return '<div class="fb-banner ok">' + checkBold(26, '#fff', 3.4) + '<span>¡Bien hecho!</span></div>';
    return '<div class="fb-banner no">' + icon('close', 26, '#fff') + '<span>' + (res.reason ? escapeHtml(res.reason) + ' ' : 'Casi — ') + 'la respuesta es <b>' + escapeHtml(res.canonical) + '</b></span></div>';
  }
  function submit() {
    if (showing || !val.trim()) return;
    markActivity(); res = gradeWriting(val, q); showing = true; draw();
  }
  function draw() {
    const state = showing ? (res.ok ? ' correct' : ' wrong') : '';
    host.innerHTML = '<div class="q-kicker">' + (q.audio ? 'Escucha y escríbelo' : 'Escríbelo en inglés') + '</div><div class="q-question">' + escapeHtml(q.question) + '</div>' + audioHTML(q) +
      '<input class="w-input' + state + '" id="w-in" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Escribe tu respuesta…" value="' + escapeHtml(val) + '"' + (showing ? ' disabled' : '') + '>' +
      (q.hint && !showing ? '<div class="w-hint">' + escapeHtml(q.hint) + '</div>' : '') +
      '<div class="fb-slot">' + (showing ? banner() : '') + '</div>' +
      '<button class="btn blue" id="q-next"' + ((!showing && !val.trim()) ? ' disabled' : '') + '>' + (showing ? 'Siguiente' : 'Confirmar') + '</button>';
    wireAudio(host, q);
    const inp = host.querySelector('#w-in'), nb = host.querySelector('#q-next');
    let go = null;
    if (!showing) {
      // Sin redibujar en cada tecla: perdería el foco y el cursor.
      inp.oninput = () => { val = inp.value; nb.disabled = !val.trim(); };
      inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); val = inp.value; submit(); } };
      inp.focus();
    } else {
      go = armAutoNext(host, nb, res.ok, () => { markActivity(); (res.ok ? onCorrect : onIncorrect)(); });
    }
    nb.onclick = () => { if (!showing) submit(); else if (go) go(); };
  }
  draw();
}

function renderQuiz(host, q, onCorrect, onIncorrect) {
  clearAutoNext(host);
  if (q.type === 'mc') renderMC(host, q, onCorrect, onIncorrect);
  else if (q.type === 'rebuild') renderRebuild(host, q, onCorrect, onIncorrect);
  else if (q.type === 'writing') renderWriting(host, q, onCorrect, onIncorrect);
  else renderTap(host, q, onCorrect, onIncorrect);
}
// Segmented progress bar (one segment per question) + an "n/total" counter.
// `results[i]` (true=correct, false=wrong) colors answered steps green/red;
// the current step is highlighted; the rest are upcoming.
function quizProgress(segEl, counterEl, n, current, results) {
  if (segEl) segEl.innerHTML = Array.from({ length: n }, (_, i) => {
    let cls = '';
    if (results && results[i] !== undefined) cls = results[i] ? 'done' : 'fail';
    else if (i === current) cls = 'now';
    return `<div class="seg ${cls}"></div>`;
  }).join('');
  if (counterEl) counterEl.textContent = Math.min(current + 1, n) + '/' + n;
}

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// MINI-QUIZ (modal) — must pass all
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
function openMiniQuiz(lesson, block) {
  const overlay = document.getElementById('overlay'), sheet = document.getElementById('sheet');
  // Two-pass flow: answer the whole round, then redo only the questions you missed.
  // Miss a question again in the redo round → repeat the entire quiz (failed state).
  let round, redo, idx, correct, results, failedQs, answered = 0;
  _dismissGuard = () => answered > 0; // confirm before leaving once a question is answered
  function startRound(qs, isRedo) { round = qs; redo = isRedo; idx = 0; correct = 0; results = []; failedQs = []; step(); }
  function step() {
    sheet.classList.remove('result');
    sheet.innerHTML = `<div class="handle"></div>
      <div class="q-top"><div class="segs" id="mq-segs"></div><span class="q-counter" id="mq-counter"></span></div>
      <div class="quiz-host" id="mq-host"></div>`;
    renderQuiz(document.getElementById('mq-host'), round[idx],
      () => { correct++; answered++; results[idx] = true; advance(); },
      () => { answered++; results[idx] = false; failedQs.push(round[idx]); advance(); });
    quizProgress(document.getElementById('mq-segs'), document.getElementById('mq-counter'), round.length, idx, results);
  }
  function advance() { if (idx < round.length - 1) { idx++; step(); } else finish(); }
  function finish() {
    if (failedQs.length === 0) return pass();
    if (redo) return showFail();            // missed again in the redo round → full reset
    return showRedo(failedQs.slice());      // first pass: redo just the missed ones
  }
  function result(iconName, iconColor, cls, title, sub, btnCls, btnLabel, onAction) {
    sheet.classList.add('result');
    sheet.innerHTML = `<div class="handle"></div><div class="center-col">
      <div class="result-icon ${cls}">${icon(iconName, cls === 'ok' ? 40 : 38, iconColor)}</div>
      <div class="result-title">${title}</div>
      <div class="result-sub">${sub}</div>
      <button class="btn ${btnCls}" id="mq-action">${btnLabel}</button>
      </div>`;
    document.getElementById('mq-action').onclick = onAction;
  }
  function pass() {
    result('check', '#2E7D1A', 'ok', '¡Bien hecho!', '¡Siguiente sección desbloqueada!', 'green', 'Continuar', () => {
      closeOverlay(); markMiniQuizCompleted(lesson, block.id);
      const sc = document.getElementById('lesson-scroll');
      const prevCount = document.querySelectorAll('#lesson-body .block').length;
      renderLessonBody(lesson);
      celebrateUnlock(lesson, prevCount);
      return;
    });
  }
  function showRedo(failed) {
    const one = failed.length === 1;
    result('refresh', '#5C5159', 'no', 'Repasemos',
      `Fallaste ${failed.length} ${one ? 'pregunta' : 'preguntas'}. Vuelve a intentarla${one ? '' : 's'} para continuar.`,
      'amber', `Repasar${one ? '' : ` (${failed.length})`}`, () => startRound(shuffle(failed), true));
  }
  function showFail() {
    result('refresh', '#5C5159', 'no', 'Casi lo tienes',
      'Fallaste otra vez. Repite el quiz completo para continuar.',
      'blue', 'Reintentar', () => startRound(shuffle(block.miniQuiz), false));
    suggestReview(lesson);
  }
  sheet.dataset.dismissible = 'true'; overlay.classList.add('active');
  startRound(shuffle(block.miniQuiz), false);
}

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// FINAL QUIZ (full screen) — must pass all
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
function openFinalQuiz(lesson, mod) {
  CURRENT.lesson = lesson; CURRENT.module = mod;
  show('quiz');
  const host = document.getElementById('quiz-host');
  const segs = document.getElementById('quiz-segs'), counter = document.getElementById('quiz-counter');
  // Same two-pass flow as the mini-quiz: redo only the missed questions; miss any of
  // them a second time and the whole quiz restarts (failed state).
  let round, redo, idx, correct, results, failedQs, skillAgg;
  // Skill tally captures the FIRST full pass through the quiz (redo rounds and
  // clean-slate retries don't stack): reset it whenever a non-redo round starts.
  function recSkill(q, ok) { const s = skillAgg[qSkill(q)]; s.t++; if (!ok) s.e++; }
  function startRound(qs, isRedo) {
    if (!isRedo) skillAgg = { listening: { t: 0, e: 0 }, reading: { t: 0, e: 0 }, writing: { t: 0, e: 0 }, teoria: { t: 0, e: 0 } };
    round = qs; redo = isRedo; idx = 0; correct = 0; results = []; failedQs = []; step();
  }
  function step() {
    renderQuiz(host, round[idx],
      () => { correct++; results[idx] = true; if (!redo) recSkill(round[idx], true); advance(); },
      () => { results[idx] = false; failedQs.push(round[idx]); if (!redo) recSkill(round[idx], false); advance(); });
    quizProgress(segs, counter, round.length, idx, results);
  }
  function advance() { if (idx < round.length - 1) { idx++; step(); } else finish(); }
  function finish() {
    if (failedQs.length === 0) return pass();
    if (redo) return showFail();
    return showRedo(failedQs.slice());
  }
  function pass() {
    const was = isQuizCompleted(lesson.id);
    lp(lesson.id).skillErr = skillAgg; // record this lesson's per-skill first-try mistakes
    markQuizCompleted(lesson.id);
    closeOverlay();
    lessonCelebration(lesson, () => {
      const cierre = lesson.contentBlocks.find(b => b.type === 'cierre');
      if (!was && cierre) openCierreSheet(cierre);
      else { renderModule(mod); }
    });
  }

  function showRedo(failed) {
    const one = failed.length === 1;
    showDialog(`<div class="center-col">
      <div class="result-icon no">${icon('refresh', 40, '#5C5159')}</div>
      <div class="result-title">Repasemos</div>
      <div class="result-sub">Fallaste ${failed.length} ${one ? 'pregunta' : 'preguntas'}. Vuelve a intentarla${one ? '' : 's'} para terminar.</div>
      <button class="btn amber" id="dlg-ok">Repasar${one ? '' : ` (${failed.length})`}</button>
      <div style="height:12px"></div><button class="btn" style="background:none;color:var(--blue)" id="dlg-back">Volver al módulo</button></div>`,
      () => { closeOverlay(); startRound(shuffle(failed), true); },
      () => { closeOverlay(); renderModule(mod); });
  }
  function showFail() {
    showDialog(`<div class="center-col">
      <div class="result-icon no">${icon('refresh', 40, '#5C5159')}</div>
      <div class="result-title">Casi lo tienes</div>
      <div class="result-sub">Fallaste otra vez. Repite el quiz completo para pasar.</div>
      <button class="btn blue" id="dlg-ok">Reintentar</button>
      <div style="height:12px"></div><button class="btn" style="background:none;color:var(--blue)" id="dlg-back">Volver al módulo</button></div>`,
      () => { closeOverlay(); startRound(shuffle(lesson.quizQuestions), false); },
      () => { closeOverlay(); renderModule(mod); });
    suggestReview(lesson, 2); // fallar el examen final pesa doble
  }

  startRound(shuffle(lesson.quizQuestions), false);
}

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// PRÁCTICA — la pestaña de quizzes
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// Aqui no hay contenido propio: es un atajo a los quizzes que YA se podian hacer
// desde la ruta. Ni una pregunta nueva ni una regla de desbloqueo propia — si la
// tuviera, esta pestaña seria una puerta de atras al curso.
//
// Corre en su propia hoja (openPracticeQuiz) en vez de reutilizar openMiniQuiz /
// openFinalQuiz: esos dos, al aprobar, repintan el cuerpo de la leccion, celebran
// sobre ella y acaban navegando al modulo. Todo eso tiene sentido cuando vienes
// leyendo y ninguno cuando estas en el inicio. Lo que si se reutiliza es lo que
// importa y no conviene duplicar: los widgets de pregunta (renderQuiz), la barra
// segmentada, el marcado de resultado y las mismas dos rondas (fallas → repites
// solo las falladas → fallas otra vez → el quiz entero).

// Los quizzes de UNA leccion, en el orden en que aparecen dentro de ella.
// `open` = se puede hacer ya; los que no, ni se listan.
function practiceItems(lesson) {
  const blocks = lesson.contentBlocks;
  const abierta = isLessonUnlocked(lesson.id);
  const last = lastUnlockedBlockIndex(lesson);
  const items = [];
  blocks.forEach((b, i) => {
    if (!(b.requiresQuizToUnlockNext && b.miniQuiz && b.miniQuiz.length)) return;
    const n = teoriaNumber(blocks, i);
    items.push({
      bi: i,
      // El mismo nombre que lleva la seccion dentro de la leccion. Inventarle uno
      // aqui ("Mini-quiz 2") obliga a traducir mentalmente entre las dos pantallas.
      name: n ? `Teoría ${n}` : (b.title || `Sección ${items.length + 1}`),
      qs: b.miniQuiz.length,
      done: isMiniQuizCompleted(lesson.id, b.id),
      // Mismo criterio que el cuerpo de la leccion: el mini-quiz esta disponible
      // en cuanto su bloque esta desbloqueado.
      open: abierta && i <= last,
      final: false,
    });
  });
  if (lesson.quizQuestions && lesson.quizQuestions.length) items.push({
    bi: -1,
    name: 'Quiz final',
    qs: lesson.quizQuestions.length,
    done: isQuizCompleted(lesson.id),
    // Mismo criterio que onLessonQuizTap: el final se abre con todos los
    // mini-quizzes hechos, no antes.
    open: abierta && (isLessonCompleted(lesson.id) || allMiniQuizzesDone(lesson)),
    final: true,
  });
  return items;
}

// Se repinta en cada entrada: lo hecho cambia a medida que avanza la ruta.
// Aquí NO se filtra por desbloqueo: Práctica es un cuaderno de ejercicios y se
// puede responder por cuenta propia, sin haber pasado la lección.
function renderPractice() {
  const el = document.getElementById('practice-body');
  if (!el || !course) return;
  let hechosTot = 0, totales = 0, cuerpo = '';
  course.modules.forEach((mod, mi) => {
    let lecciones = '';
    mod.lessons.forEach(lesson => {
      const items = practiceItems(lesson);
      if (!items.length) return;
      totales += items.length;
      const hechos = items.filter(q => q.done).length;
      hechosTot += hechos;
      lecciones += `<div class="pr-les">
        <div class="pr-les-h"><span class="pr-les-t">${escapeHtml(lessonName(lesson))}</span>
          <span class="pr-les-c">${hechos}/${items.length}</span></div>
        <div class="pr-list">` +
        items.map(q => `<button class="pr-q${q.done ? ' done' : ''}${q.final ? ' final' : ''}" type="button"
            data-l="${allLessons.indexOf(lesson)}" data-b="${q.bi}">
            <span class="pr-q-ic">${q.done ? checkBold(21, 'currentColor', 3.2) : playIcon(19, 'currentColor')}</span>
            <span class="pr-q-t"><b>${escapeHtml(q.name)}</b><small>${q.qs} ${q.qs === 1 ? 'pregunta' : 'preguntas'} · ${q.done ? 'Superado' : 'Pendiente'}</small></span>
            <span class="pr-q-go">${arrowFwd(20, 'currentColor', 2.6)}</span>
          </button>`).join('') +
        `</div></div>`;
    });
    if (!lecciones) return;
    cuerpo += `<div class="pr-mod"><div class="pr-mod-h">
      <span class="pr-mod-n" style="background:${modAccent(mi)}">${mi + 1}</span>
      <span class="pr-mod-t">${escapeHtml(moduleName(mod))}</span></div>${lecciones}</div>`;
  });
  el.innerHTML = `<div class="pr-intro">
      <b>Tu cuaderno de ejercicios</b>
      <small>Aquí están todos los ejercicios del curso, abiertos desde el primer día. No hace falta haber hecho la lección: puedes responder por tu cuenta, en el orden que quieras y las veces que quieras. No hay nota ni penalidad — lo que aciertes suma en tu ruta.</small>
      <span class="pr-count">${hechosTot} de ${totales} ejercicios superados</span>
    </div>` + (cuerpo || `<div class="pr-empty"><b>Todavía no hay ejercicios</b>
      <small>En cuanto el curso cargue sus lecciones, sus ejercicios aparecerán aquí.</small></div>`);

  // Indices en vez de ids en el HTML: asi no hay que escapar nada para meterlo
  // en un atributo.
  el.querySelectorAll('.pr-q').forEach(b => b.onclick = () => {
    const lesson = allLessons[+b.getAttribute('data-l')];
    const bi = +b.getAttribute('data-b');
    if (lesson) openPracticeQuiz(lesson, bi >= 0 ? lesson.contentBlocks[bi] : null);
  });
}

// Aprobar aqui puede mover la ruta (desbloquea la siguiente seccion, o la
// siguiente leccion), asi que se repinta entera — pero se vuelve a Práctica, que
// es donde esta el alumno, y al mismo punto de la lista. Todo dentro del mismo
// turno de JS: el salto a la ruta no llega a pintarse.
function practiceRefresh(cambio) {
  if (!cambio) { renderPractice(); return; }
  const sc = document.querySelector('#screen-course .scroll');
  const top = sc ? sc.scrollTop : 0;
  renderCourse();
  showHomeTab('practice');
  if (sc) sc.scrollTop = top;
}

// `block` = el bloque cuyo mini-quiz se practica; null = el quiz final.
function openPracticeQuiz(lesson, block) {
  const preguntas = block ? block.miniQuiz : lesson.quizQuestions;
  if (!preguntas || !preguntas.length) return;
  const overlay = document.getElementById('overlay'), sheet = document.getElementById('sheet');
  let round, redo, idx, results, failedQs, skillAgg, answered = 0;
  _dismissGuard = () => answered > 0; // confirmar antes de salir si ya se respondio algo
  function recSkill(q, ok) {
    if (!skillAgg) return;
    const s = skillAgg[qSkill(q)]; if (!s) return;
    s.t++; if (!ok) s.e++;
  }
  function startRound(qs, isRedo) {
    // Las destrezas solo se miden en el quiz final y solo en la primera vuelta,
    // igual que en la ruta (las repescas no vuelven a contar).
    if (!isRedo && !block) skillAgg = { listening: { t: 0, e: 0 }, reading: { t: 0, e: 0 }, writing: { t: 0, e: 0 }, teoria: { t: 0, e: 0 } };
    round = qs; redo = isRedo; idx = 0; results = []; failedQs = []; step();
  }
  function step() {
    sheet.classList.remove('result');
    sheet.innerHTML = `<div class="handle"></div>
      <div class="q-top"><div class="segs" id="pq-segs"></div><span class="q-counter" id="pq-counter"></span></div>
      <div class="quiz-host" id="pq-host"></div>`;
    renderQuiz(document.getElementById('pq-host'), round[idx],
      () => { answered++; results[idx] = true; if (!redo) recSkill(round[idx], true); advance(); },
      () => { answered++; results[idx] = false; failedQs.push(round[idx]); if (!redo) recSkill(round[idx], false); advance(); });
    quizProgress(document.getElementById('pq-segs'), document.getElementById('pq-counter'), round.length, idx, results);
  }
  function advance() { if (idx < round.length - 1) { idx++; step(); } else finish(); }
  function finish() {
    if (failedQs.length === 0) return pass();
    if (redo) return showFail();
    return showRedo(failedQs.slice());
  }
  function result(iconName, iconColor, cls, title, sub, btnCls, btnLabel, onAction) {
    sheet.classList.add('result');
    sheet.innerHTML = `<div class="handle"></div><div class="center-col">
      <div class="result-icon ${cls}">${icon(iconName, cls === 'ok' ? 40 : 38, iconColor)}</div>
      <div class="result-title">${title}</div>
      <div class="result-sub">${sub}</div>
      <button class="btn ${btnCls}" id="pq-action">${btnLabel}</button>
      </div>`;
    document.getElementById('pq-action').onclick = onAction;
  }
  function pass() {
    touchDay(); // pasar un quiz es actividad del dia, se entre por donde se entre
    // Practicar algo que aun no estaba superado SI cuenta: seria raro aprobarlo
    // aqui y que la ruta siguiera diciendo que te falta.
    const nuevo = block ? !isMiniQuizCompleted(lesson.id, block.id) : !isQuizCompleted(lesson.id);
    if (nuevo) {
      if (block) markMiniQuizCompleted(lesson, block.id);
      // Las destrezas del panel se graban con la PRIMERA vez que se supera el
      // final. Una repeticion no las reescribe: practicar no puede empeorar una
      // nota que ya te habias sacado.
      else { lp(lesson.id).skillErr = skillAgg; markQuizCompleted(lesson.id); }
    }
    practiceRefresh(nuevo);  // la lista de detras queda al dia antes de enseñar el resultado
    _dismissGuard = null;    // ya esta guardado: salir de la hoja no pierde nada
    result('check', '#2E7D1A', 'ok', '¡Bien hecho!',
      nuevo ? (block ? 'Sección superada. Ya cuenta en tu ruta.' : '¡Lección completada! Ya cuenta en tu ruta.')
            : 'Ronda limpia. Vuelve cuando quieras.',
      'green', 'Continuar', closeOverlay);
  }
  function showRedo(failed) {
    const one = failed.length === 1;
    result('refresh', '#5C5159', 'no', 'Repasemos',
      `Fallaste ${failed.length} ${one ? 'pregunta' : 'preguntas'}. Vuelve a intentarla${one ? '' : 's'} para terminar.`,
      'amber', `Repasar${one ? '' : ` (${failed.length})`}`, () => startRound(shuffle(failed), true));
  }
  function showFail() {
    // Sin suggestReview: eso es del ritmo de la ruta (bajar de nivel tras varios
    // fallos) y aqui solo estas repitiendo algo que ya abriste.
    result('refresh', '#5C5159', 'no', 'Casi lo tienes',
      'Fallaste otra vez. Repite el quiz completo cuando quieras.',
      'blue', 'Reintentar', () => startRound(shuffle(preguntas), false));
  }
  sheet.dataset.dismissible = 'true'; overlay.classList.add('active');
  startRound(shuffle(preguntas), false);
}

let _dismissGuard = null; // when set, returns true if dismissing the sheet needs confirmation
function closeOverlay() {
  _dismissGuard = null;
  document.getElementById('overlay').classList.remove('active');
  const s = document.getElementById('sheet');
  s.classList.remove('result');
  s.style.transform = ''; s.style.transition = '';
}
// Slide the sheet down then tear it down — for user-initiated dismissals only
// (tap-outside / drag). Internal handoffs keep calling closeOverlay() directly.
function animateDismiss() {
  const s = document.getElementById('sheet');
  s.style.transition = 'transform .25s ease';
  s.style.transform = 'translateY(100%)';
  setTimeout(closeOverlay, 240);
}
function confirmDismiss(onYes) {
  let c = document.getElementById('confirm-pop');
  if (!c) { c = document.createElement('div'); c.id = 'confirm-pop'; c.className = 'confirm-pop'; document.body.appendChild(c); }
  c.innerHTML = `<div class="confirm-card">
    <div class="confirm-title">¿Salir del quiz?</div>
    <div class="confirm-sub">Si sales ahora perderás tu progreso en esta ronda.</div>
    <button class="btn blue" id="confirm-stay">Seguir intentando</button>
    <button class="btn" id="confirm-leave" style="background:none;color:var(--blue);font-weight:700">Salir</button>
  </div>`;
  c.classList.add('show');
  document.getElementById('confirm-stay').onclick = () => c.classList.remove('show');
  document.getElementById('confirm-leave').onclick = () => { c.classList.remove('show'); onYes(); };
}
function requestDismiss() {
  const s = document.getElementById('sheet');
  if (_dismissGuard && _dismissGuard()) {
    s.style.transition = 'transform .2s ease'; s.style.transform = 'translateY(0)';
    confirmDismiss(animateDismiss);
  } else {
    animateDismiss();
  }
}

// A sheet is dismissible (tap-outside / drag-down) when sheet.dataset.dismissible
// is 'true'. Mini-quiz / Langles / cierre are dismissible; the final-quiz pass/fail
// dialogs are not (they require an explicit button choice, matching the app).
(function setupSheetDismiss() {
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  const dismissible = () => sheet.dataset.dismissible === 'true';
  overlay.addEventListener('click', (e) => { if (e.target.id === 'overlay' && dismissible()) requestDismiss(); });
  // Drag the grab handle downward to dismiss — mouse + touch via Pointer Events.
  let startY = null, dragging = false;
  const snapBack = () => { sheet.style.transition = 'transform .2s ease'; sheet.style.transform = 'translateY(0)'; };
  sheet.addEventListener('pointerdown', (e) => {
    if (!dismissible()) return;
    const t = e.target;
    if (!(t.classList && t.classList.contains('handle'))) return;
    startY = e.clientY; dragging = true; sheet.style.transition = 'none';
    if (sheet.setPointerCapture) sheet.setPointerCapture(e.pointerId);
  });
  sheet.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    sheet.style.transform = 'translateY(' + Math.max(0, e.clientY - startY) + 'px)';
  });
  sheet.addEventListener('pointerup', (e) => {
    if (!dragging) return; dragging = false;
    if (e.clientY - startY > 110) requestDismiss(); else snapBack();
  });
  sheet.addEventListener('pointercancel', () => { if (dragging) { dragging = false; snapBack(); } });
})();
