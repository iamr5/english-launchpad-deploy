// DEBUG: complete the next pending mini-quiz of the currently open lesson, then
// re-render and re-sync progress exactly like passing it for real would. Finishing
// a module's last microlección auto-completes the module (see markQuizCompleted).
function debugFinishNextMiniQuiz() {
  const onLesson = !!CURRENT.lesson && document.getElementById('screen-lesson').classList.contains('active');
  if (!onLesson) {
    // Complete the next-in-line microlección ENTIRELY (mini-quizzes + final quiz) and refresh.
    const next = allLessons.find(l => isLessonUnlocked(l.id) && !isLessonCompleted(l.id));
    if (!next) { toast('¡Curso completado! (debug)'); return; }
    next.contentBlocks.forEach(b => {
      if (b.requiresQuizToUnlockNext && b.miniQuiz && b.miniQuiz.length && !isMiniQuizCompleted(next.id, b.id)) markMiniQuizCompleted(next, b.id);
    });
    markQuizCompleted(next.id);
    toast('Completada (debug): ' + next.title);
    if (document.getElementById('screen-module').classList.contains('active') && CURRENT.module) renderModule(CURRENT.module);
    else if (document.getElementById('screen-course').classList.contains('active')) renderCourse();
    return;
  }
  const lesson = CURRENT.lesson, mod = CURRENT.module;
  const blocks = lesson.contentBlocks;
  const lastIdx = lastUnlockedBlockIndex(lesson);
  let target = null;
  for (let i = 0; i <= lastIdx && i < blocks.length; i++) {
    const b = blocks[i];
    if (b.requiresQuizToUnlockNext && b.miniQuiz && b.miniQuiz.length && !isMiniQuizCompleted(lesson.id, b.id)) { target = b; break; }
  }
  if (!target) {
    // No pending mini-quiz: complete this microlección's FINAL quiz (which also
    // auto-completes the module if it was the last lesson). Next tap jumps onward.
    if (!isLessonCompleted(lesson.id)) {
      markQuizCompleted(lesson.id);
      updateCompletion(lesson, mod);
      toast('Quiz final completado (debug)');
      return;
    }
    const nId = nextLessonId(lesson.id);
    const nl = nId ? allLessons.find(l => l.id === nId) : null;
    if (nl) {
      const nmod = course.modules.find(mm => mm.lessons.some(l => l.id === nId)) || mod;
      openLesson(nl, nmod);
      toast('Siguiente microlección (debug)');
    } else {
      toast('¡Curso completado! (debug)');
    }
    return;
  }
  const sc = document.getElementById('lesson-scroll');
  const prev = sc ? sc.scrollTop : 0;
  markMiniQuizCompleted(lesson, target.id);
  renderLessonBody(lesson);
  requestAnimationFrame(() => {
    if (sc) sc.scrollTop = prev;
    const max = sc ? sc.scrollHeight - sc.clientHeight : 0;
    const seg = max >= 100 ? Math.min(1, Math.max(0, sc.scrollTop / max)) : 1;
    setScroll(lesson.id, seg);
    updateCompletion(lesson, mod, seg);
  });
  toast('Mini-quiz completado (debug)');
}

// DEBUG: rebuild every block's `unlocked` flag of a lesson purely from which
// mini-quizzes are currently marked done. This is the deterministic inverse of
// markMiniQuizCompleted's incremental unlocking, so clearing one `mq` flag and
// recomputing correctly re-locks whatever that mini-quiz had opened.
function debugRecomputeBlockLocks(lesson) {
  const blocks = lesson.contentBlocks;
  const L = lp(lesson.id);
  let firstGated = blocks.findIndex(b => b.type === 'teoria' && b.requiresQuizToUnlockNext);
  if (firstGated < 0) firstGated = 0;
  const gated = blocks.filter(b => b.type === 'teoria' && b.requiresQuizToUnlockNext && b.miniQuiz && b.miniQuiz.length);
  const lastGatedId = gated.length ? gated[gated.length - 1].id : null;
  const unlocked = new Set();
  for (let i = 0; i <= firstGated && i < blocks.length; i++) unlocked.add(blocks[i].id);
  gated.forEach(tb => {
    if (!(L.blocks[tb.id] && L.blocks[tb.id].mq)) return;
    const idx = blocks.findIndex(b => b.id === tb.id);
    if (tb.id === lastGatedId) { for (let i = idx + 1; i < blocks.length; i++) unlocked.add(blocks[i].id); }
    else if (idx >= 0 && idx < blocks.length - 1) unlocked.add(blocks[idx + 1].id);
  });
  blocks.forEach(b => { L.blocks[b.id] = Object.assign({}, L.blocks[b.id], { unlocked: unlocked.has(b.id) }); });
  saveProgress(PROGRESS);
}

// DEBUG: re-render the current screen after an undo, preserving lesson scroll.
function debugRefresh(onLesson, lesson, mod) {
  if (onLesson) {
    const sc = document.getElementById('lesson-scroll');
    const prev = sc ? sc.scrollTop : 0;
    renderLessonBody(lesson);
    requestAnimationFrame(() => { if (sc) sc.scrollTop = prev; updateCompletion(lesson, mod); });
  } else if (document.getElementById('screen-module').classList.contains('active') && CURRENT.module) {
    renderModule(CURRENT.module);
  } else if (document.getElementById('screen-course').classList.contains('active')) {
    renderCourse();
  }
}

// DEBUG: undo exactly ONE quiz completion, in reverse of the forward stepper:
// final quiz -> last mini-quiz -> earlier mini-quizzes -> step to previous lesson.
function debugUndoLastQuiz() {
  const onLesson = !!CURRENT.lesson && document.getElementById('screen-lesson').classList.contains('active');
  let lesson = null, mod = null;
  if (onLesson) { lesson = CURRENT.lesson; mod = CURRENT.module; }
  else {
    for (let i = allLessons.length - 1; i >= 0; i--) {
      const l = allLessons[i], p = PROGRESS[l.id];
      const hasMq = p && p.blocks && Object.keys(p.blocks).some(k => p.blocks[k] && p.blocks[k].mq);
      if (isQuizCompleted(l.id) || hasMq) { lesson = l; mod = course.modules.find(m => m.lessons.some(x => x.id === l.id)); break; }
    }
    if (!lesson) { toast('Nada que deshacer (debug)'); return; }
  }

  // 1) Final quiz completed -> undo it. Re-locks the next lesson AND clears the
  //    module-completed flag, since the module auto-completes with the last quiz.
  if (isQuizCompleted(lesson.id)) {
    const L = lp(lesson.id);
    L.quizCompleted = false;
    const nId = nextLessonId(lesson.id);
    if (nId && allLessons[0].id !== nId) lp(nId).unlocked = false; // re-lock next lesson (forward step had unlocked it)
    if (mod && PROGRESS['__modules'] && PROGRESS['__modules'][mod.id]) PROGRESS['__modules'][mod.id] = false;
    saveProgress(PROGRESS);
    debugRefresh(onLesson, lesson, mod);
    toast('Quiz final deshecho (debug): ' + lesson.title);
    return;
  }

  // 2) Undo the most recently completed mini-quiz.
  const gated = lesson.contentBlocks.filter(b => b.type === 'teoria' && b.requiresQuizToUnlockNext && b.miniQuiz && b.miniQuiz.length);
  let target = null;
  for (let i = gated.length - 1; i >= 0; i--) { if (isMiniQuizCompleted(lesson.id, gated[i].id)) { target = gated[i]; break; } }
  if (target) {
    const L = lp(lesson.id);
    L.blocks[target.id] = Object.assign({}, L.blocks[target.id], { mq: false });
    debugRecomputeBlockLocks(lesson);
    debugRefresh(onLesson, lesson, mod);
    toast('Mini-quiz deshecho (debug): ' + target.id);
    return;
  }

  // 3) Nothing left on this lesson -> step back to the previous microlección.
  const idx = allLessons.findIndex(l => l.id === lesson.id);
  const prev = idx > 0 ? allLessons[idx - 1] : null;
  if (prev && onLesson) {
    const pmod = course.modules.find(m => m.lessons.some(l => l.id === prev.id)) || mod;
    openLesson(prev, pmod);
    toast('Microlección anterior (debug)');
  } else {
    toast('Inicio del curso (debug)');
  }
}

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// Progreso POR SECCIÓN.
// Una "sección" NO es cada bloque: es cada tramo con candado, es decir el grupo de
// bloques que termina en un bloque con mini-quiz (más el tramo final sin quiz). Así,
// al entrar por primera vez estás en la sección 1 de N con 0% — antes se veían varios
// segmentos ya verdes solo porque la intro y la vista previa vienen abiertas.
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
function lessonSections(lesson) {
  const blocks = lesson.contentBlocks.filter(b => b.type !== 'cierre');
  const secs = []; let start = 0;
  blocks.forEach((b, i) => {
    const gate = b.requiresQuizToUnlockNext && b.miniQuiz && b.miniQuiz.length;
    if (gate) { secs.push({ start, end: i, gate: b }); start = i + 1; }
  });
  if (start < blocks.length) secs.push({ start, end: blocks.length - 1, gate: null });
  if (!secs.length) secs.push({ start: 0, end: Math.max(0, blocks.length - 1), gate: null });
  return secs;
}
function sectionState(lesson) {
  const secs = lessonSections(lesson);
  const total = secs.length;
  const last = lastUnlockedBlockIndex(lesson);
  let idx = secs.findIndex(s => last <= s.end);
  if (idx < 0) idx = total - 1;
  const sec = secs[idx];
  const sc = document.getElementById('lesson-scroll');
  const els = document.querySelectorAll('#lesson-body .block');
  let p = 0;
  const first = els[sec.start], lastEl = els[Math.min(sec.end, els.length - 1)];
  if (sc && first && lastEl) {
    const top = first.offsetTop;
    const h = Math.max(1, (lastEl.offsetTop + lastEl.offsetHeight) - top);
    p = Math.min(1, Math.max(0, (sc.scrollTop + sc.clientHeight - top) / h));
  }
  if (sec.gate) {
    // la sección solo llega al 100% cuando su mini-quiz está superado
    p = isMiniQuizCompleted(lesson.id, sec.gate.id) ? 1 : Math.min(p, 0.9);
  }

  return { total, idx, p };
}
// Al pasar un mini-quiz: Boti celebra, la nueva sección entra con animación y la
// vista viaja hasta ella para que quede claro que se desbloqueó algo nuevo.
function celebrateUnlock(lesson, prevCount) {
  const sc = document.getElementById('lesson-scroll');
  const blocks = document.querySelectorAll('#lesson-body .block');
  const fresh = blocks[prevCount] || blocks[blocks.length - 1];
  botiCheer('¡Nueva sección desbloqueada!');
  requestAnimationFrame(() => {
    if (fresh) {
      fresh.classList.add('just-unlocked');
      setTimeout(() => fresh.classList.remove('just-unlocked'), 1400);
      if (sc) smoothScrollTo(sc, Math.max(0, fresh.offsetTop - 70), 650, () => {
        const max = sc.scrollHeight - sc.clientHeight;
        const seg = max >= 100 ? Math.min(1, Math.max(0, sc.scrollTop / max)) : 1;
        setScroll(lesson.id, seg);
        updateCompletion(lesson, CURRENT.module, seg);
      });
    }
    updateCompletion(lesson, CURRENT.module);
  });
}
function botiCheer(msg) {
  const old = document.getElementById('boti-cheer'); if (old) old.remove();
  const el = document.createElement('div');
  el.id = 'boti-cheer'; el.className = 'boti-cheer';
  el.innerHTML = `<img src="${mascotHeadIcon()}" alt=""><div class="bc-txt">${msg}</div>`;
  document.body.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, 2200);
}
// Repaso sugerido: si el alumno arrancó por encima de A1 (test de ubicación) y
// falla en su módulo de arranque, Boti ofrece volver al nivel anterior. No bloquea.
let _reviewShown = false;
const _failCount = {}; // fallos por módulo dentro de la sesión
// Sugerencia de repaso: si el alumno fue colocado por el test en un módulo por
// encima de A1 y le está costando, Boti ofrece bajar un nivel. Nunca bloquea.
// Umbral: 2 fallos de mini-quiz o 1 fallo de examen final en ese módulo.
function suggestReview(lesson, weight) {
  if (_reviewShown) return;
  const placement = PROGRESS['__placement'];
  if (!placement) return;
  const mi = course.modules.findIndex(m => m.lessons.some(l => l.id === lesson.id));
  if (mi <= 0 || mi > (placement.lvl || 0)) return; // solo dentro (o bajo) del módulo colocado
  const prev = course.modules[mi - 1];
  if (!prev || !isModulePlaced(prev)) return; // solo si ese nivel vino convalidado
  _failCount[mi] = (_failCount[mi] || 0) + (weight || 1);
  if (_failCount[mi] < 2) return;
  _reviewShown = true;
  const lv = ['A1', 'A2', 'B1', 'B2', 'C1'][mi - 1] || `Módulo ${mi}`;
  const old = document.getElementById('boti-review'); if (old) old.remove();
  const el = document.createElement('div');
  el.id = 'boti-review'; el.className = 'boti-cheer';
  el.style.pointerEvents = 'auto';
  const btn = 'border:0;color:#fff;font-weight:800;padding:8px 12px;border-radius:10px;cursor:pointer;margin-left:8px';
  el.innerHTML = `<img src="${mascotHeadIcon()}" alt=""><div class="bc-txt">Parece que este nivel te está costando. ¿Bajamos a ${lv} un momento?</div>` +
    `<button type="button" data-go style="${btn};background:#1CB0F6">Sí, repasar</button>` +
    `<button type="button" data-stay style="${btn};background:transparent;color:#5C5159">Seguir aquí</button>`;
  document.body.appendChild(el);
  el.querySelector('[data-go]').onclick = () => {
    el.remove(); closeOverlay();
    uncreditModule(prev);                       // el nivel anterior pasa a ser su nivel activo
    PROGRESS['__placement'] = { lvl: mi - 1, ts: Date.now() };
    saveProgress(PROGRESS);
    renderModule(prev);
    toast(`Repasemos ${lv}. Puedes volver a subir cuando quieras.`);
  };
  el.querySelector('[data-stay]').onclick = () => el.remove();
  setTimeout(() => { if (!document.body.contains(el)) return; el.classList.add('out'); setTimeout(() => el.remove(), 400); }, 9000);
}

// ¿El sistema pide menos movimiento? Se respeta SIEMPRE por defecto, pero
// `<html data-motion="full">` lo anula. Existe por dos motivos concretos:
//  1) Windows trae los "efectos de animación" desactivados en bastantes equipos
//     (y en todos los que van en ahorro de batería). Con eso puesto esta
//     pantalla se ve muerta y parece que la animación está rota.
//  2) El demo se enseña en portátiles ajenos, donde no vas a ir a Configuración.
// El CSS mira el mismo atributo, así que los dos lados van siempre de acuerdo.
function prefersReduced() {
  if (document.documentElement.getAttribute('data-motion') === 'full') return false;
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

// Momento "sombrero seleccionador": revelación del nivel al terminar el test.
// Distinta de lessonCelebration a propósito — es un momento único, no una lección más.
function placementReveal(lvl, onDone, stats) {
  const LV = ['A1', 'A2', 'B1', 'B2', 'C1'];
  const target = LV[lvl] || 'A1';
  const credits = placementCredits(lvl);
  const reduce = prefersReduced();
  const old = document.getElementById('sort-hat'); if (old) old.remove();
  const el = document.createElement('div');
  el.id = 'sort-hat'; el.className = 'sort';
  const R = 108;
  // TRAYECTORIA EN ARCO, no en línea recta.
  // Antes cada insignia iba del centro a su hueco por el camino más corto: eso
  // es exactamente lo que delata una animación hecha a ojo. Nada con masa viaja
  // en recta. Aquí cada una sale del centro con ~58° de retraso angular, barre
  // hacia su posición describiendo una curva, se pasa de radio y vuelve.
  // Los keyframes se generan por insignia porque cada destino es distinto y
  // animar variables CSS (@property) no es fiable en todos los navegadores.
  const ARC = 1.0;              // radianes de barrido (~57°)
  let genCss = '';
  const orbit = LV.map((l, i) => {
    const a = (i / LV.length) * Math.PI * 2 - Math.PI / 2; // A1 arriba
    // f = fracción de radio, d = desfase angular respecto al destino
    const P = (f, d) => `translate(${(Math.cos(a + d) * R * f).toFixed(1)}px, ${(Math.sin(a + d) * R * f).toFixed(1)}px)`;
    genCss +=
      `@keyframes bfly${i}{` +
        `0%{transform:${P(0, -ARC)}}` +
        `40%{transform:${P(1.17, -ARC * .3)}}` +   // se pasa de largo, aún girando
        `63%{transform:${P(.91, ARC * .06)}}` +    // rebota hacia dentro
        `80%{transform:${P(1.05, -ARC * .02)}}` +
        `92%{transform:${P(.985, 0)}}` +
        `100%{transform:${P(1, 0)}}}` +
      // Salida: sigue la tangente hacia afuera, no retrocede por donde vino
      `@keyframes bout${i}{` +
        `0%{transform:${P(1, 0)}}` +
        `28%{transform:${P(.88, ARC * .05)}}` +    // se encoge antes de salir
        `100%{transform:${P(2.3, ARC * .55)}}}` +
      `.sort .s-bpos.b${i}.here{animation:bfly${i} 1.5s cubic-bezier(.28,.72,.24,1) both}` +
      `.sort .s-bpos.b${i}.gone{animation:bout${i} 1.15s cubic-bezier(.5,0,.75,1) both}`;
    return `<div class="s-bpos b${i}" data-x="${Math.round(Math.cos(a) * R)}" data-y="${Math.round(Math.sin(a) * R)}">` +
      `<div class="s-bin"><div class="s-badge">${l}</div></div></div>`;
  }).join('');
  const dust = reduce ? '' : Array.from({ length: 11 }, () => {
    const dur = (9 + Math.random() * 7).toFixed(1), del = (Math.random() * 9).toFixed(1);
    const sz = (3 + Math.random() * 4).toFixed(1);
    return `<span class="s-dust" style="left:${Math.round(Math.random() * 96)}%;width:${sz}px;height:${sz}px;animation-duration:${dur}s;animation-delay:-${del}s"></span>`;
  }).join('');
  const nAns = Math.max(0, (stats && stats.answers) | 0);
  const nBands = Math.max(0, (stats && stats.bands) | 0);
  // El demo ya no es solo de Boti: cada institución trae su mascota (gallito,
  // ozito…). Nombre e icono salen de la config, nunca fijos en el texto.
  // `cabeza` puede venir vacía: un pack sin icono de cabeza no debe dejar un
  // <img> roto en mitad del escenario.
  const mascota = (CFG.mascot && CFG.mascot.name) || 'Boti';
  const cabeza = mascotHeadIcon();
  el.innerHTML = `
    <style>${genCss}</style>
    <div class="s-aura"></div><div class="s-aura b2"></div>${dust}
    <div class="s-col" id="s-col">
      ${brandSpotHTML(true)}
      <div class="s-stage" id="s-stage">
        <div class="s-orbit"><div class="s-orbin" id="s-orbin">${orbit}</div></div>
        ${cabeza ? `<div class="s-botiw"><img class="s-boti" id="s-boti" src="${cabeza}" alt="" aria-hidden="true"></div>` : ''}
      </div>
      <div class="s-t" id="s-t">¡Test completado!</div>
      <div class="s-s" id="s-s">${nAns
        ? `<b class="n">0</b> respuestas${nBands ? ` · ${nBands} ${nBands === 1 ? 'nivel evaluado' : 'niveles evaluados'}` : ''}`
        : `${mascota} ya tiene tus respuestas`}</div>
      <div class="s-panel" id="s-panel">
        <div class="s-ph" id="s-ph"></div>
        <div class="s-credits" id="s-credits"></div>
        <div class="s-total" id="s-total"></div>
      </div>
      <div id="s-cta"></div>
      <button class="s-skip" id="s-skip">Saltar</button>
    </div>`;
  document.body.appendChild(el);

  // La columna se centra ella misma con transform. Cualquier cambio de altura
  // (la tarjeta, el botón, un texto que pasa a dos líneas) se convierte en un
  // deslizamiento de 1.15s en vez del salto de fotograma que da el reflow.
  const col = el.querySelector('#s-col');
  const recenter = () => {
    col.style.transform = `translateY(${Math.round((el.clientHeight - col.offsetHeight) / 2)}px)`;
  };
  recenter();
  let ro = null;
  requestAnimationFrame(() => {
    col.classList.add('glide');            // el primer centrado es instantáneo
    el.querySelector('#s-s').classList.add('in');
    if (window.ResizeObserver) { ro = new ResizeObserver(recenter); ro.observe(col); }
  });
  window.addEventListener('resize', recenter);

  let done = false;
  let verdictShown = false;
  const timers = [];
  // En modo "menos movimiento" no se elimina la secuencia: se acorta (0.35x) para
  // que el orden se mantenga y el veredicto siga siendo el último texto.
  const F = reduce ? 0.35 : 1;
  const later = (fn, ms) => { timers.push(setTimeout(fn, Math.round(ms * F))); };
  // Variación humana en los tiempos: nada cae exactamente en la misma cadencia.
  const jitter = (ms, pct) => Math.round(ms * (1 + (Math.random() * 2 - 1) * (reduce ? 0 : (pct || .14))));
  const suspense = [];
  const finish = () => {
    if (done) return; done = true;
    timers.forEach(clearTimeout); suspense.forEach(clearTimeout);
    if (ro) ro.disconnect();
    window.removeEventListener('resize', recenter);
    // Salida escalonada de abajo a arriba: se va primero lo último que llegó.
    // Antes todo desaparecía junto en un fundido de 350ms — la escena se
    // cerraba de golpe justo después de haberse construido con cuidado.
    ['#s-skip', '#s-cta .btn', '#s-panel', '#s-s', '#s-t', '#s-stage'].forEach((sel, i) => {
      const n = el.querySelector(sel);
      if (n) setTimeout(() => n.classList.add('leave'), i * 85);
    });
    el.classList.add('out');   // el fondo se disuelve al final, ya vacío
    setTimeout(() => { el.remove(); if (onDone) onDone(); }, 1150);
  };
  const buzz = ms => { try { if (!reduce && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
  // RELEVO, no cross-fade. El texto saliente se eleva y se deshace en blur; el
  // entrante emerge desde abajo saliendo de foco. Los dos tramos se solapan un
  // poco (la salida dura 420ms y la entrada arranca a los 340) para que no haya
  // ni un instante con la línea vacía — ese hueco es lo que se lee como corte.
  const tNode = el.querySelector('#s-t');
  const sNode = el.querySelector('#s-s');
  const setTitle = (txt) => {
    if (verdictShown) return;
    tNode.classList.remove('tin');   // quitar antes: su fill pisaría a `fade`
    tNode.classList.add('fade');
    setTimeout(() => {
      if (verdictShown) return;
      tNode.textContent = txt;
      tNode.classList.remove('fade');
      void tNode.offsetWidth;        // reinicia la animación de entrada
      tNode.classList.add('tin');
    }, Math.round(430 * F));         // entra antes de que el saliente acabe (580ms)
  };
  const setSub = (txt, force) => {
    if (verdictShown && !force) return;
    sNode.classList.remove('in');
    setTimeout(() => {
      if (verdictShown && !force) return;
      sNode.innerHTML = txt; sNode.classList.add('in');
    }, Math.round(540 * F));
  };

  const beat = (fn, ms) => suspense.push(setTimeout(() => { if (!done) fn(); }, Math.round(ms * F)));

  // GUION POR RESULTADO — antes la deliberación era idéntica para todos y el
  // nivel equivocado salía siempre de `LV.filter(l => l !== target)[0]`, o sea
  // A1 o A2: para un C1 aquello no daba ninguna tensión, era absurdo.
  // Ahora Boti duda con el nivel ADYACENTE (el error creíble) y cada resultado
  // tiene su propio tono: A1 arranca, C1 se sorprende.
  const SCRIPT = [
    { wrong: 'A2', t1: 'Mmm…',       t2: 'Mejor desde el principio',
      s0: 'Leyendo tus respuestas del test', s1: 'Hay base, pero falta asentarla',
      s2: 'No, todavía no',        v: 'Empiezas por los fundamentos.' },
    { wrong: 'A1', t1: 'A ver…',     t2: 'No, un peldaño más',
      s0: 'Leyendo tus respuestas del test', s1: 'Los básicos los llevas sueltos',
      s2: 'No, eso ya lo dominas',  v: 'Los fundamentos ya los tienes.' },
    { wrong: 'A2', t1: 'Mmm…',       t2: 'No, esto llega más lejos',
      s0: 'Leyendo tus respuestas del test', s1: 'Aquí ya hay conversación',
      s2: 'No, se queda corto',     v: 'Ya te defiendes solo.' },
    { wrong: 'B1', t1: 'Vaya…',      t2: 'No, apunta más arriba',
      s0: 'Leyendo tus respuestas del test', s1: 'Esto tiene bastante nivel',
      s2: 'No, esto es otra liga',  v: 'Manejas los matices.' },
    { wrong: 'B2', t1: 'Vaya, vaya…', t2: 'No, todavía más arriba',
      s0: 'Leyendo tus respuestas del test', s1: 'Esto no es lo habitual',
      s2: 'Casi nadie llega aquí',  v: 'Nivel de dominio.' }
  ];
  const SC = SCRIPT[Math.max(0, Math.min(SCRIPT.length - 1, lvl | 0))];
  const wrong = SC.wrong;

  // ACTO 1 (0–3.9s) — cierre del test. Boti llega, se cuenta lo hecho y las
  // cinco insignias viajan a la órbita, una a una.
  if (nAns) beat(() => tickUp(sNode.querySelector('.n'), nAns, Math.round(1400 * F)), 560);
  beat(() => { setTitle('Ahora, tu nivel'); setSub(`${mascota} va a colocarte`); }, 2200);
  const badges = [...el.querySelectorAll('.s-bpos')];
  badges.forEach((b, i) => {
    beat(() => {
      // La curva y el rebote los lleva la animación generada (bfly{i}); con
      // "menos movimiento" no hay animación, así que ahí sí hace falta colocarla.
      if (reduce) b.style.transform = `translate(${b.dataset.x}px, ${b.dataset.y}px)`;
      b.classList.add('here');
      buzz(7);
    }, 2750 + i * 210);
  });
  // ACTO 2 (3.9–12s) — la duda. Cada relevo de texto dura ~1.5s (0.58 de
  // salida + 0.95 de entrada) y los beats van a ~1.5s: siempre hay una frase
  // entrando mientras otra sale. Nunca queda la línea quieta esperando.
  beat(() => {
    const orb = el.querySelector('#s-orbin'); if (orb) orb.classList.add('spin');
    setTitle(`${mascota} está decidiendo…`); setSub(SC.s0);
  }, 3900);
  beat(() => setSub(SC.s1), 6400);
  beat(() => setTitle(SC.t1), 7700);
  beat(() => setTitle(`¿${wrong}…?`), 9300);
  beat(() => setSub(SC.s2), 10000);
  beat(() => setTitle(SC.t2), 11200);
  // Inhalación: la escena se recoge un segundo antes de estallar.
  beat(() => { el.classList.add('hush'); const st = el.querySelector('#s-stage'); if (st) st.classList.add('hush'); }, 12000);

  const reveal = () => {
    if (done) return;
    suspense.forEach(clearTimeout);
    verdictShown = true;
    buzz(40);
    const orbOuter = el.querySelector('.s-orbit');
    const botiw = el.querySelector('.s-botiw');
    const stage = el.querySelector('#s-stage');

    // ——— CAMBIO DE ACTO, NO CORTE DE MONTAJE ———
    // Antes esto era `stage.innerHTML = ...`: la órbita, las cinco insignias y
    // Boti se borraban en un fotograma y aparecía el nivel. Era el momento más
    // brusco de toda la secuencia. Ahora la escena vieja SALE — las insignias
    // salen despedidas hacia afuera una a una, Boti se hunde y se desenfoca — y
    // el veredicto entra encima mientras ellas todavía se están yendo.
    badges.forEach((b, i) => {
      setTimeout(() => b.classList.add('gone'), Math.round(i * 85 * F));
    });
    if (botiw) botiw.classList.add('out');

    // La entrada arranca a mitad de la salida: se solapan, no se turnan.
    const V = Math.round(560 * F);
    setTimeout(() => {
      if (done) return;
      el.classList.remove('hush');
      stage.classList.remove('hush'); stage.classList.add('boom');
      stage.insertAdjacentHTML('beforeend',
        `<div class="s-wave"></div><div class="s-wave w2"></div>` +
        `<div class="s-final">${target}</div>` +
        (cabeza ? `<img class="s-boti cheer" src="${cabeza}" alt="" aria-hidden="true" style="position:absolute;left:50%;bottom:-6px;width:64px;height:64px;margin-left:-32px;z-index:3">` : ''));
      const f = document.createElement('div'); f.className = 's-flash';
      el.appendChild(f); setTimeout(() => f.remove(), 1250);
      confetti();
    }, V);
    // Los restos se retiran cuando ya han terminado de salir, no antes.
    timers.push(setTimeout(() => {
      if (orbOuter) orbOuter.remove();
      if (botiw) botiw.remove();
    }, Math.round(1700 * F)));

    // ——— ÚNICO REFLOW DE TODA LA SECUENCIA ———
    // Se construye AQUÍ todo lo que queda (cabecera, filas, ruta, total, botón),
    // invisible pero ya ocupando su sitio. Antes cada pieza se insertaba en su
    // turno y el layout se recolocaba de golpe cinco veces. A partir de esta
    // línea nada cambia de tamaño: solo se animan opacidad y transform.
    const host = el.querySelector('#s-credits');
    const panel = el.querySelector('#s-panel');
    const ph = el.querySelector('#s-ph');
    const tot = el.querySelector('#s-total');
    const cta = el.querySelector('#s-cta');
    const totalXpCredited = credits.reduce((a, c) => a + c.xp, 0);
    const checkSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    ph.textContent = credits.length ? 'Ya lo tienes aprobado' : 'Tu ruta completa';
    const rows = credits.map(c => {
      const row = document.createElement('div');
      row.className = 's-credit';
      row.innerHTML = `<span class="cl">${c.lvl}</span>` +
        `<span class="cm"><b>${escapeHtml(c.name)}</b><small>${c.lessons} lecciones convalidadas</small></span>` +
        `<span class="cx"><i class="ck">${checkSvg}</i>+<b class="n">0</b> XP</span>`;
      host.appendChild(row);
      return row;
    });
    let zeroRow = null, track = null, cap = null, labels = [];
    if (!credits.length) {
      zeroRow = document.createElement('div');
      zeroRow.className = 's-credit zero';
      zeroRow.innerHTML = `<span class="cl">A1</span>` +
        `<span class="cm"><b>Empiezas desde cero</b><small>Todo el camino es tuyo</small></span>` +
        `<span class="cx">${LV.length} niveles</span>`;
      host.appendChild(zeroRow);
      track = document.createElement('div');
      track.className = 's-route';
      track.innerHTML = `<i></i><u></u>` + LV.map(l => `<span><b></b><em>${l}</em></span>`).join('');
      host.appendChild(track);
      cap = document.createElement('div');
      cap.className = 's-rcap';
      cap.innerHTML = `<span>Estás aquí</span><span>Tu meta</span>`;
      host.appendChild(cap);
      labels = [...track.querySelectorAll('span')];
    } else {
      tot.innerHTML = `<span>Total convalidado</span><span class="tv"><b class="n">0</b> XP</span>`;
      tot.classList.add('on');
    }
    cta.innerHTML = `<button class="btn green" id="s-go">Empezar en ${target}</button>`;
    const goBtn = cta.querySelector('#s-go');
    goBtn.onclick = finish;
    panel.classList.add('on');   // aquí, y solo aquí, cambia la altura

    // El título viejo se va con su propia salida mientras las insignias se
    // dispersan; las letras del nivel empiezan a caer cuando esa salida termina.
    const tEl = el.querySelector('#s-t');
    tEl.classList.remove('tin');
    tEl.classList.add('fade');
    const txt = `¡${target}!`;
    let acc = 700;
    later(() => { tEl.classList.remove('fade'); tEl.textContent = ''; }, 560);
    txt.split('').forEach((ch, i) => {
      const last = i === txt.length - 1;
      later(() => { tEl.insertAdjacentHTML('beforeend', `<i>${ch}</i>`); if (i) buzz(10); }, acc);
      // Ritmo de habla: pausas distintas y respiro largo antes del cierre.
      acc += jitter(last ? 460 : 240, .28);
    });
    // La frase llega después del nivel, no a la vez: primero se asimila el dato.
    later(() => setSub(SC.v, true), acc + 340);
    function confetti() {
      if (reduce) return;
      // Tres oleadas en vez de un solo estallido: 34 piezas saliendo en el mismo
      // fotograma se leen como un golpe, no como algo que revienta y cae.
      const cols = ['#FFD86B', '#FFC53D', '#FFF3C4', '#1CB0F6', '#8BE08B'];
      const burst = (n, spread, delay) => {
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 + Math.random() * .6;
          const r = spread + Math.random() * 190;
          const s = document.createElement('span');
          s.className = 'cftb';
          s.style.cssText = `--dx:${Math.round(Math.cos(a) * r)}px;--dy:${Math.round(Math.sin(a) * r * .8)}px;` +
            `width:${(6 + Math.random() * 6).toFixed(1)}px;height:${(10 + Math.random() * 8).toFixed(1)}px;` +
            `background:${cols[i % cols.length]};animation-duration:${(2.4 + Math.random() * 2).toFixed(2)}s;` +
            `animation-delay:${(delay + Math.random() * .4).toFixed(2)}s`;
          el.appendChild(s);
        }
      };
      // El volumen sube con el nivel: un C1 merece más fiesta que un A1.
      const k = 1 + lvl * .3;
      burst(Math.round(22 * k), 120, 0);
      burst(Math.round(9 * k), 90, .34);
      burst(Math.round(6 * k), 150, .78);
      setTimeout(() => el.querySelectorAll('.cftb').forEach(n => n.remove()), 5600);
    }

    // ——— A partir de aquí, solo clases: ni una inserción más en el layout ———
    // La tarjeta empieza a subir mientras todavía caen las letras del nivel:
    // los dos gestos se solapan en lugar de esperarse.
    const base = 1900;
    let at = base;
    later(() => panel.classList.add('in'), base - 700);
    later(() => ph.classList.add('in'), base - 300);
    rows.forEach((row, i) => {
      const c = credits[i];
      later(() => {
        row.classList.add('in', 'pulse');
        row.style.opacity = '1';
        buzz(18);
        const ck = row.querySelector('.ck');
        setTimeout(() => ck.classList.add('draw'), 460);
        tickUp(row.querySelector('.n'), c.xp, Math.round(1300 * F));
      }, at);
      // Escalonado con leve solapamiento y variación: cascada, no lista.
      at += jitter(850 - i * 28, .16);
    });
    if (!credits.length) {
      later(() => {
        zeroRow.classList.add('in');
        zeroRow.style.opacity = '1';
      }, base);
      // El trazo arranca cuando la fila ya se ha asentado: dos gestos, no uno.
      later(() => track.classList.add('go'), base + 620);
      // El cometa solo reconoce el camino: cada nodo destella a su paso y vuelve
      // a apagarse. A1 se queda encendido (estás aquí); C1 es la meta, hueca —
      // nada de dejar la ruta pintada como si ya estuviera recorrida.
      const lastI = labels.length - 1;
      labels.forEach((sp, i) => {
        later(() => {
          sp.classList.add('lit');
          buzz(i ? 8 : 22);
          if (i === 0) sp.classList.add('hold');
          // Al pasar el cometa el nodo se apaga: el camino sigue por recorrer.
          else later(() => sp.classList.remove('lit'), i === lastI ? 620 : 900);
        }, base + 680 + i * 850);
      });
      // Llegada: se apaga el cometa, C1 pasa a ser meta (anillo hueco) y la
      // ruta queda en reposo, latiendo. `goal` se pone aquí y no antes para
      // que su animación no pise el destello del paso del cometa.
      later(() => {
        track.classList.add('done');
        labels[lastI].classList.add('goal');
        cap.classList.add('in');
      }, base + 680 + lastI * 850 + 680);
    }
    at += credits.length ? 700 : 4100;
    if (credits.length) {
      later(() => {
        tot.classList.add('in');
        tickUp(tot.querySelector('.n'), totalXpCredited, Math.round(1450 * F));
        buzz(60);
      }, at);
    }
    // El CTA entra y, con él, "Saltar" se retira: ya no pinta nada al lado de
    // "Empezar en X". Se apaga primero y solo después deja el hueco, para que el
    // recentrado de la columna se lleve el cambio de altura deslizando.
    // Sale aquí y no antes para no quitar la vía de escape mientras se construye
    // la tarjeta, que son varios segundos.
    later(() => {
      goBtn.classList.add('in');
      const skipBtn = el.querySelector('#s-skip');
      if (skipBtn) {
        skipBtn.classList.add('gone');
        later(() => { skipBtn.style.display = 'none'; }, 640);
      }
    }, at + (credits.length ? 1450 : 950));
  };

  el.querySelector('#s-skip').onclick = finish;
  // ACTO 3 — veredicto. ~12.8s desde que se cierra el test.
  timers.push(setTimeout(reveal, Math.round(12800 * F)));
}

// Contador que sube de 0 a `to` en `ms`: acelera al inicio, frena al final y
// da un último "tirón" (overshoot leve) antes de asentarse en el valor exacto.
function tickUp(node, to, ms) {
  if (!node) return;
  // Reserva el ancho del valor final: al pasar de "0" a "120" el elemento
  // ensanchaba y la cifra (y lo que tuviera al lado) daba un tirón lateral en
  // mitad del conteo. Con el hueco reservado, el número rueda en su sitio.
  node.style.display = 'inline-block';
  node.style.minWidth = String(to).length + 'ch';
  node.style.textAlign = 'right';
  if (!ms) { node.textContent = String(to); return; }
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / ms);
    let e = 1 - Math.pow(1 - p, 3);
    if (p > .62 && p < 1) e += Math.sin((p - .62) / .38 * Math.PI) * .035;
    node.textContent = String(p >= 1 ? to : Math.round(to * e));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// Meta diaria: cronómetro discreto. Solo cuenta mientras hay actividad real
// (scroll = lectura, respuestas de quiz) y nunca interrumpe el aprendizaje.
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
let _lastAct = 0;
function markActivity() { _lastAct = Date.now(); }
function goalSecs() {
  const t = PROGRESS['__time'] || {};
  return t[dayKey()] || 0;
}
function goalTarget() { const p = loadProfile() || {}; return (+p.goal || 15) * 60; }
function goalBadged() { return !!(PROGRESS['__goalDays'] || []).includes(dayKey()); }
function renderGoalChips() {
  const secs = goalSecs(), target = goalTarget(), done = secs >= target;
  const pctv = Math.min(100, Math.round(secs / target * 100));
  document.querySelectorAll('.goal-chip').forEach(c => {
    c.classList.toggle('done', done);
    c.style.setProperty('--gp', pctv + '%');
    const t = c.querySelector('.gc-t');
    const mins = Math.floor(secs / 60);
    // Texto explícito ("13 min") en vez de un número suelto: el chip debe leerse solo.
    if (t) t.textContent = done ? `✓ ${mins} min` : `${mins} min`;
    c.title = done ? `Meta diaria cumplida (${mins} min)` : `Meta diaria: ${mins} / ${Math.round(target / 60)} min`;

  });
}
function goalTick() {
  if (WIPED) return;
  if (document.hidden) return;
  if (Date.now() - _lastAct > 60000) return; // sin actividad reciente: el reloj se pausa solo
  const t = PROGRESS['__time'] = PROGRESS['__time'] || {};
  const k = dayKey();
  t[k] = (t[k] || 0) + 1;
  if (t[k] % 10 === 0) scheduleSave();
  if (t[k] >= goalTarget() && !goalBadged()) {
    const d = PROGRESS['__goalDays'] = PROGRESS['__goalDays'] || [];
    d.push(k); saveProgress(PROGRESS);
    botiCheer('🏅 ¡Meta del día cumplida!');
  }
  renderGoalChips();
}
document.addEventListener('scroll', markActivity, true);
document.addEventListener('pointerdown', markActivity, true);
window._goalTimer = setInterval(goalTick, 1000);
setTimeout(renderGoalChips, 0);

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// Onboarding (primer arranque) — Boti guia un flujo tipo Duolingo, una cosa por paso.
// The app is student-only (families/teachers get the web dashboard). Steps:
//   0 saludo · 1 motivación · 2 nivel de partida · 3 nombre · 4 payoff ·
//   5 meta diaria · 6 listo.
// Steps 1/2/5 are option lists that advance ON TAP (no button); the rest use the
// big button. The name gates the button until typed. The placement answer (step 2)
// is saved for context only — everyone starts from the very first lesson.
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
const PROFILE_KEY = 'ingles_web_profile_v1';
function loadProfile() { try { return JSON.parse(localStorage.getItem(PROFILE_KEY)); } catch (e) { return null; } }
function saveProfile(p) { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); }

const OB_LAST = 6;
const OB_TAP_STEPS = [2, 5];        // option lists: selecting advances, no button
const OB_LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1'];
let OB = { step: 0, name: '', mot: '', lvl: null, goal: '' };
const OB_BUBBLES = [
  () => '¡Hola! Soy <b>' + (CFG.mascot.fullName || CFG.mascot.name || 'Boti') + '.</b><br>Empecemos.',
  () => '¿Cómo te llamas?',
  () => OB.name ? `<b>${escapeHtml(OB.name)}</b>, ¿por qué quieres aprender inglés?` : '¿Por qué quieres aprender inglés?',
  () => PL.state === 'result'
    ? `Tu nivel es <b>${OB_LEVELS[OB.lvl || 0]}</b>.`
    : (PL.state === 'intro' ? 'Hagamos un test rápido de ubicación.' : 'Elige la mejor opción.'),
  () => OB.name ? `Mira, <b>${escapeHtml(OB.name)}</b>, esto vamos a practicar:` : 'Esto es lo que vamos a practicar:',
  () => '¿Cuál es tu meta diaria?',
  () => `¡Listo, <b>${escapeHtml(OB.name)}</b>!<br>Tu plan ya está preparado. `,
];

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// Test de ubicación (paso 3) — banco de ítems en placement_items.js
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// Banco completo: 8 ítems por banda A1→C1 (40). Se presentan en orden de
// dificultad; el test corta antes si una banda sale muy floja.
const PL_UMBRAL = 5;          // aciertos (de 8) para superar una banda
const PL_CORTE = 2;           // <= esto en una banda ⇒ se detiene el test
let PL = { state: 'intro', items: [], i: 0, sel: null, ok: {}, stopped: false };
let _plShownQ = -1;   // última pregunta ya pintada: distingue cambio de ítem de re-render
function plShuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function plBuild() {
  const bank = window.PLACEMENT_ITEMS || [];
  const items = [];
  OB_LEVELS.forEach(band => {
    plShuffle(bank.filter(it => it.band === band)).forEach(it => items.push(it));
  });
  PL = { state: items.length ? 'q' : 'result', items, i: 0, sel: null, ok: {}, stopped: false };
  _plShownQ = -1;
  if (!items.length) OB.lvl = 0;
}
// aciertos por banda, solo sobre lo efectivamente respondido
function plTally() {
  const tally = {};
  PL.items.forEach((it, i) => {
    if (!(i in PL.ok)) return;
    const t = tally[it.band] = tally[it.band] || { t: 0, c: 0 };
    t.t++; if (PL.ok[i]) t.c++;
  });
  return tally;
}
function plLevel() {
  const tally = plTally();
  let lvl = 0;
  for (let b = 0; b < OB_LEVELS.length; b++) {
    const t = tally[OB_LEVELS[b]];
    if (t && t.c >= PL_UMBRAL) lvl = b; else break;
  }
  return lvl;
}
// ¿la banda recién terminada dispara el corte por abandono?
function plBandDone(idx) {
  const cur = PL.items[idx].band;
  const next = PL.items[idx + 1];
  if (next && next.band === cur) return false;
  const t = plTally()[cur];
  return !!t && t.c <= PL_CORTE;
}
function plRender() {
  const host = document.getElementById('ob-placement');
  if (!host) return;
  if (PL.state === 'intro') {
    const total = (window.PLACEMENT_ITEMS || []).length || 40;
    host.innerHTML = `<div class="ob-points">
      <div class="ob-point plain"><span class="em">⏱️</span><div><b>Unos 8 minutos</b><small>Hasta ${total} preguntas — termina antes si ya ubicamos tu nivel</small></div></div>
      <div class="ob-point plain"><span class="em">🎯</span><div><b>Ubicamos tu nivel</b><small>De A1 a C1, según el marco MCER</small></div></div>
      <div class="ob-point plain"><span class="em">🤝</span><div><b>Sin presión</b><small>Si no sabes, pasa a la siguiente</small></div></div>
    </div>`;
    return;
  }
  if (PL.state === 'result') {
    const lvl = OB.lvl || 0;
    host.innerHTML = `<div class="pl-result">
      <div class="pl-badge">${OB_LEVELS[lvl]}</div>
      <div class="pl-txt">Tu punto de partida</div>
      <div class="pl-sub">${lvl > 0
        ? `Empiezas en el nivel <b>${OB_LEVELS[lvl]}</b>. ${OB_LEVELS.slice(0, lvl).join(' y ')} quedan <b>convalidados</b>, con su XP ya sumada.`
        : 'Empiezas en el nivel <b>A1</b>, desde los fundamentos.'}</div>
    </div>`;
    return;
  }
  const it = PL.items[PL.i];
  // Solo se anima al cambiar de pregunta: seleccionar una opción re-renderiza
  // el mismo ítem y ahí un re-entrada completa sería un parpadeo molesto.
  const en = PL.i === _plShownQ ? '' : ' enter';
  _plShownQ = PL.i;
  host.innerHTML = `<div class="pl-count${en}">Pregunta ${PL.i + 1} de ${PL.items.length} · nivel ${escapeHtml(it.band)}</div>
    <div class="pl-q${en}">${escapeHtml(it.q)}</div>
    <div class="ob-opts">${it.opts.map((o, i) =>
      `<button class="ob-opt pl-opt${en}${PL.sel === i ? ' sel' : ''}" data-pl="${i}"><span>${escapeHtml(o)}</span></button>`).join('')}</div>
    <button class="pl-skip${en}" id="pl-skip">No lo sé</button>`;
  host.querySelectorAll('[data-pl]').forEach(b => b.onclick = () => { PL.sel = +b.dataset.pl; plRender(); obSyncNext(); });
  host.querySelector('#pl-skip').onclick = () => { PL.sel = -1; plNext(); };
}
function plFinish() {
  OB.lvl = plLevel(); PL.state = 'result';
  // Lo respondido alimenta el arranque de la revelación ("23 respuestas · 3
  // niveles evaluados"): el cierre del test cuenta algo real, no un relleno.
  placementReveal(OB.lvl, () => { plRender(); obRender(); }, {
    answers: Object.keys(PL.ok).length,
    bands: Object.keys(plTally()).length
  });
  plRender(); obRender();
}

function plNext() {
  if (PL.state === 'intro') { plBuild(); if (PL.state === 'result') OB.lvl = 0; plRender(); obRender(); return; }
  if (PL.state === 'result') { obAdvance(); return; }
  const it = PL.items[PL.i];
  PL.ok[PL.i] = PL.sel === it.a;
  PL.sel = null;
  const last = PL.i >= PL.items.length - 1;
  if (last || plBandDone(PL.i)) { PL.stopped = !last; plFinish(); return; }
  PL.i++; plRender(); obRender();
}

function obSyncNext() {
  const next = document.getElementById('ob-next');
  if (OB.step !== 3) return;
  const blocked = PL.state === 'q' && PL.sel === null;
  next.disabled = blocked;
  next.className = 'btn ' + (blocked ? 'disabled' : 'green');
  next.textContent = PL.state === 'intro' ? 'Empezar test' : (PL.state === 'result' ? 'Continuar' : 'Continuar');
}

function obRender() {
  document.querySelector('#screen-onboard .ob-wrap').classList.toggle('ob-intro', OB.step === 0);
  document.querySelector('#screen-onboard .ob-top').classList.toggle('can-back', OB.step > 0);
  document.getElementById('ob-segs').innerHTML = Array.from({ length: OB_LAST + 1 }, (_, i) =>
    `<div class="seg ${i < OB.step ? 'done' : (i === OB.step ? 'now' : '')}"></div>`).join('');
  document.getElementById('ob-bubble').innerHTML = OB_BUBBLES[OB.step]();
  document.querySelectorAll('#screen-onboard .ob-step').forEach(s =>
    s.classList.toggle('on', +s.dataset.step === OB.step));
  // keep the option pills' selected state in sync (matters when stepping back)
  document.querySelectorAll('.ob-opt[data-mot]').forEach(b => b.classList.toggle('sel', b.dataset.mot === OB.mot));
  document.querySelectorAll('.ob-opt[data-goal]').forEach(b => b.classList.toggle('sel', b.dataset.goal === OB.goal));
  // footer: the big button on most steps; on the LAST step the real course-foot
  // "tu primera lección" bar takes over — its CTA drops straight into the lesson.
  const isLast = OB.step === OB_LAST;
  const next = document.getElementById('ob-next');
  const foot = document.getElementById('ob-foot');
  foot.hidden = !isLast;
  next.style.display = (isLast || OB_TAP_STEPS.includes(OB.step)) ? 'none' : '';
  next.textContent = OB.step === 0 ? '¡Empecemos!' : 'Continuar';
  const needName = OB.step === 1 && !document.getElementById('ob-name').value.trim();
  next.disabled = needName;
  next.className = 'btn ' + (needName ? 'disabled' : 'green');
  if (OB.step === 1) setTimeout(() => document.getElementById('ob-name').focus(), 120);
  if (OB.step === 3) { plRender(); obSyncNext(); }
  if (isLast) {
    document.getElementById('ob-sum').innerHTML =
      `<div class="ob-chip lvl"><span class="em">🏁</span><span class="lb">Nivel ${OB_LEVELS[OB.lvl || 0]}</span><div class="sb">Tu nivel</div></div>` +
      `<div class="ob-chip goal"><span class="em">🎯</span><span class="lb">${OB.goal || 15} min</span><div class="sb">Meta diaria</div></div>`;
    // arranca en el módulo que corresponde al nivel del test de ubicación
    const sIdx = placementStartIdx(OB.lvl || 0);
    const mod = course.modules[sIdx], fl = mod.lessons[0];
    const { col, cold } = footColors(sIdx);
    foot.innerHTML = fl
      ? `<div class="foot-kicker" style="color:${col}">Tu primera lección</div>
         <div class="foot-title">${escapeHtml(lessonName(fl))}</div>
         <button class="cta-btn" id="ob-start" style="background:${col};--lip:${cold}">Empezar ${arrowFwd(19, '#fff', 2.8)}</button>`
      : '';
    const start = document.getElementById('ob-start');
    if (start) start.onclick = obFinishToLesson;
  }
}
function obAdvance() { if (OB.step < OB_LAST) { OB.step++; obRender(); } }
// FLIP: record each element's box, run `mutate` (which relayouts them via a class
// change), then play the inverted delta so they glide from old → new geometry.
// Sirve para morfear el Boti grande del intro + su globo hacia la fila de charla chica.
function obFlip(els, mutate) {
  const first = els.map(el => el.getBoundingClientRect());
  mutate();
  els.forEach((el, i) => {
    const last = el.getBoundingClientRect();
    const dx = first[i].left - last.left, dy = first[i].top - last.top;
    const sx = last.width ? first[i].width / last.width : 1, sy = last.height ? first[i].height / last.height : 1;
    el.style.transformOrigin = 'top left';
    el.style.transition = 'none';
    el.style.transform = `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`;
    el.getBoundingClientRect(); // flush the inverted start before animating
    requestAnimationFrame(() => {
      el.style.transition = 'transform .5s cubic-bezier(.22,1,.36,1)';
      el.style.transform = '';
    });
    el.addEventListener('transitionend', function te() { el.style.transition = ''; el.style.transformOrigin = ''; el.removeEventListener('transitionend', te); });
  });
}
document.getElementById('ob-next').addEventListener('click', () => {
  if (OB.step === 1) {
    const v = document.getElementById('ob-name').value.trim();
    if (!v) return;
    OB.name = v.split(/\s+/)[0];
  }
  if (OB.step === 3) { plNext(); return; }
  if (OB.step === OB_LAST) { obFinish(); return; }
  if (OB.step === 0) { // morfea el Boti del hero + su globo hacia la fila de charla
    obFlip([document.querySelector('.ob-boti'), document.getElementById('ob-bubble')], obAdvance);
    return;
  }
  obAdvance();
});
document.getElementById('ob-back').addEventListener('click', () => { if (OB.step > 0) { OB.step--; obRender(); } });
document.getElementById('ob-name').addEventListener('input', () => {
  if (OB.step === 1) {
    const empty = !document.getElementById('ob-name').value.trim();
    const next = document.getElementById('ob-next');
    next.disabled = empty; next.className = 'btn ' + (empty ? 'disabled' : 'green');
  }
});
document.getElementById('ob-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('ob-next').click(); }
});
document.querySelectorAll('.ob-opt[data-mot], .ob-opt[data-goal]').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.mot != null) OB.mot = b.dataset.mot;
  else if (b.dataset.goal != null) OB.goal = b.dataset.goal;
  b.parentElement.querySelectorAll('.ob-opt').forEach(x => x.classList.toggle('sel', x === b));
  setTimeout(obAdvance, 220); // let the selected state read before sliding on
}));
// The placement answer (step 2) is saved for context but does NOT skip content —
// everyone starts from the very first lesson so no one misses the fundamentals.
function obFinish() {
  saveProfile({ name: OB.name, goal: +OB.goal || 15, level: OB.lvl || 0, motive: OB.mot || '', created: new Date().toISOString() });
  applyPlacement(OB.lvl || 0);
  renderCourse();
  toast('¡Hola, ' + OB.name + '! ' + (CFG.mascot.name || 'Boti') + ' te espera ' + (CFG.mascot.emoji || ''));
}
// Finish onboarding and drop straight into the very first lesson (from the last-step bar).
function obFinishToLesson() {
  saveProfile({ name: OB.name, goal: +OB.goal || 15, level: OB.lvl || 0, motive: OB.mot || '', created: new Date().toISOString() });
  const start = applyPlacement(OB.lvl || 0);
  const mod = course.modules[start], fl = mod.lessons[0];
  renderCourse();
  if (fl) openLesson(fl, mod);
  toast('¡Hola, ' + OB.name + '! ' + (CFG.mascot.name || 'Boti') + ' te espera ' + (CFG.mascot.emoji || ''));
}
function startOnboarding() { OB = { step: 0, name: '', mot: '', lvl: null, goal: '' }; PL = { state: 'intro', items: [], i: 0, sel: null, ok: {} }; show('onboard'); obRender(); }

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// Boot: first run (no profile) → onboarding; otherwise straight to the course.
// Boti del onboarding: se monta una sola vez (su contenedor nunca se re-renderiza).
// ?debug=1 enciende los botones de depuracion sin los 7 toques. Lo usa el previo
// del panel de demos, donde hace falta saltar de pantalla rapido.
if (/[?&]debug=1\b/.test(location.search)) document.body.classList.add('debug-fabs');
applyIcons();
applyOla();
mountSplash();
mountBrandLogos();
mascotMountStatic();
loadCourse().then(() => {
  // Solo con perfil: sin el no hay ficha propia que precargar (y el panel se
  // quedaria con el alumno de ejemplo).
  if (loadProfile()) { renderCourse(); warmDashboard(); } else startOnboarding();
}).catch(err => {
  console.error(err);
  document.body.innerHTML = '<div style="font:600 15px/1.5 system-ui;padding:40px;text-align:center;color:#5C5159">No se pudo cargar el curso.<br>Recarga la pagina para volver a intentarlo.</div>';
});
</script>
