<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Universidades Privadas del Perú</title>
<style>
:root {
  --bg:#f4f6f8; --panel:#fff; --text:#17212b; --muted:#667085; --line:#e4e7ec;
  --accent:#1d4ed8; --ok:#067647; --warn:#b54708; --bad:#b42318;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:1600px;margin:0 auto;padding:22px}
.header{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:16px}
h1{font-size:28px;margin:0 0 5px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 13px;min-width:118px}
.stat b{display:block;font-size:18px} .stat span{font-size:12px;color:var(--muted)}
.controls{background:var(--panel);padding:12px;border:1px solid var(--line);border-radius:14px 14px 0 0}
input,select,button{font:inherit}
input,select{width:100%;padding:10px 11px;border:1px solid #d0d5dd;border-radius:9px;background:#fff;color:#1d2939}
button{border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}
button:hover{background:#f9fafb}
.toolbar{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:10px 12px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
.toolbar .left,.toolbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.count{font-size:13px;color:var(--muted)}
.table-wrap{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;overflow:auto;max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{padding:10px 11px;border-bottom:1px solid var(--line);border-right:1px solid #f0f1f3;vertical-align:top;font-size:13px;max-width:320px}
th{position:sticky;top:0;background:#f9fafb;z-index:3;text-align:left;white-space:nowrap;cursor:pointer;color:#344054}
th:first-child,td:first-child{position:sticky;left:0;z-index:2;background:#fff}
th:first-child{z-index:4;background:#f9fafb}
tr:hover td{background:#fafcff} tr:hover td:first-child{background:#fafcff}
.name{font-weight:650;min-width:270px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-weight:600;font-size:12px;white-space:nowrap}
.badge.yes{background:#ecfdf3;color:var(--ok)} .badge.no{background:#fef3f2;color:var(--bad)} .badge.unknown{background:#fff7ed;color:var(--warn)} .badge.warn2{background:#eff6ff;color:#1d4ed8}
.reach{min-width:170px;padding:7px 8px}
.reach[data-value="se_tiene"]{border-color:#86efac;background:#f0fdf4}
.reach[data-value="se_puede"]{border-color:#fde68a;background:#fffbeb}
.reach[data-value="no_se_tiene"]{border-color:#fecaca;background:#fef2f2}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
.small{font-size:12px;color:var(--muted)}
@media(max-width:900px){.header{align-items:flex-start;flex-direction:column}}
@media(max-width:560px){.app{padding:10px} h1{font-size:22px}}


/* ---- marca ---- */
.brandbar{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:16px;background:linear-gradient(180deg,#fff,#f7f9fc);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.brandbar .logo{height:44px;width:auto;display:block}
.brandbar .brandtag{color:var(--muted);font-size:13px;font-weight:600;padding-left:14px;border-left:1px solid var(--line)}

/* ---- cards (móvil) ---- */
.cards{display:none}
.empty{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.chead{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;border-radius:0;padding:13px 14px 8px;text-align:left;cursor:pointer}
.cname{font-weight:700;font-size:15px;line-height:1.3;color:var(--text)}
.cchev{color:var(--muted);font-size:15px;transition:transform .18s ease;flex:none}
.card.open .cchev{transform:rotate(180deg)}
.cmeta{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.cpill{background:#f3f5f8;color:#344054;border-radius:999px;padding:3px 9px;font-size:12px;white-space:nowrap}
.cpill b{font-variant-numeric:tabular-nums}
.cstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 12px}
.cstat{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.cstat span{display:block;font-size:11px;color:var(--muted);font-weight:600;line-height:1.25;margin-bottom:2px}
.cstat b{font-size:15px;font-variant-numeric:tabular-nums;color:var(--text);word-break:break-word}
@media(max-width:360px){.cstats{grid-template-columns:1fr}}
.creach{padding:0 14px 12px}
.creach .reach{width:100%;min-width:0}
.cbody{display:none;border-top:1px solid var(--line);padding:4px 14px 12px;background:#fcfdff}
.card.open .cbody{display:block}
.crow{display:grid;grid-template-columns:44% 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #f0f1f3;font-size:13px}
.crow:last-child{border-bottom:0}
.ck{color:var(--muted);font-weight:600}
.cv{color:var(--text);word-break:break-word}
.cv .num{text-align:left}
.cv .name{min-width:0}

@media(max-width:820px){
  .app{padding:12px}
  .cards{display:block}
  .table-wrap{display:none}
  .toolbar{border-radius:0 0 14px 14px}
  .controls{border-radius:14px 14px 0 0}
  .header{flex-direction:column;align-items:flex-start;gap:12px}
  .stats{width:100%}
  .stat{flex:1 1 30%;min-width:0}
  .brandbar{padding:12px 14px;gap:10px}
  .brandbar .logo{height:34px}
  .brandbar .brandtag{font-size:11px;padding-left:10px}
  h1{font-size:20px}
  .sub{font-size:13px}
  input,select,button{font-size:16px} /* evita el zoom automático en iOS */
}
@media(max-width:420px){
  .brandbar .brandtag{display:none}
  .crow{grid-template-columns:1fr;gap:2px}
  .ck{font-size:12px}
}
.msort{display:none;width:auto;max-width:220px}
@media(max-width:820px){.msort{display:block;flex:1 1 100%;max-width:none}.toolbar .right{width:100%}}

.controls{display:block}
.ctop{display:flex;gap:10px;align-items:center}
.ctop input{flex:1 1 auto;min-width:0}
#filtersToggle{flex:none;display:inline-flex;align-items:center;gap:7px;padding:10px 14px;font-weight:600;color:#344054;white-space:nowrap}
#filtersToggle:hover{background:#f2f4f7}
#filtersToggle[aria-expanded="true"]{background:#eff4ff;border-color:#b2ccff;color:var(--accent)}
#filtersToggle .fchev{transition:transform .18s ease;font-size:11px}
#filtersToggle[aria-expanded="true"] .fchev{transform:rotate(180deg)}
.fcount{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.cpanel{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.cpanel[hidden]{display:none}
@media(max-width:820px){
  .cpanel{grid-template-columns:1fr 1fr}
  #filtersToggle .fico{display:none}
}
@media(max-width:420px){ .cpanel{grid-template-columns:1fr} }
</style>
</head>

const COLS = ["universidad", "alumnos_aprox", "precio_promedio_mensual_soles", "incremento_10_soles_pct", "ofrece_curso_ingles", "modelo_ingles", "costo_ingles_monto", "costo_ingles_modalidad", "costo_mensual_ingles_soles", "regla_mensual", "costo_material_ingles_soles", "opinion_resumen", "calidad_fuente_ingles", "base_precio_ingles", "ciudad_sede_principal", "departamento", "ranking_precio", "estado", "nota_alumnos", "nota_precios", "detalle_curso_ingles", "fuente_curso_ingles", "fuente_lista", "fuente_precios_referencia", "pension_min_soles_mes", "pension_max_soles_mes", "rango_pension_mensual"];
const LABELS = {"universidad": "Nombre de Universidad", "alumnos_aprox": "Número de alumnos", "precio_promedio_mensual_soles": "Pensión promedio (S/ mes)", "incremento_10_soles_pct": "+S/10 (% pensión prom.)", "ofrece_curso_ingles": "Curso de inglés", "modelo_ingles": "Modelo de cobro", "costo_ingles_monto": "Monto inglés (S/)", "costo_ingles_modalidad": "Modalidad de cobro", "costo_mensual_ingles_soles": "Equivalente mensual (S/)", "costo_material_ingles_soles": "Material (S/)", "opinion_resumen": "Opiniones (resumen)", "calidad_fuente_ingles": "Calidad de fuente", "base_precio_ingles": "Detalle del cobro", "ciudad_sede_principal": "Ciudad", "departamento": "Departamento", "ranking_precio": "Ranking precio", "pension_min_soles_mes": "Pensión mínima", "pension_max_soles_mes": "Pensión máxima", "rango_pension_mensual": "Rango pensión (min–max)", "estado": "Estado", "nota_alumnos": "Nota alumnos", "nota_precios": "Nota precios", "fuente_lista": "Fuente lista", "fuente_precios_referencia": "Fuente precios", "detalle_curso_ingles": "Detalle curso de inglés", "fuente_curso_ingles": "Fuente curso inglés", "regla_mensual": "Cómo se calculó"};
const REACH_KEY = "universidadesPeruReachV1";
const reachState = JSON.parse(localStorage.getItem(REACH_KEY) || "{}");

const priorityCols = ["universidad", "alumnos_aprox", "precio_promedio_mensual_soles", "incremento_10_soles_pct", "ofrece_curso_ingles", "modelo_ingles", "costo_ingles_monto", "costo_ingles_modalidad", "costo_mensual_ingles_soles", "regla_mensual", "costo_material_ingles_soles", "ciudad_sede_principal"];
const displayCols = ["reach_status", ...priorityCols, ...COLS.filter(c => !priorityCols.includes(c))];

let sortKey = "alumnos_aprox";
let sortDir = -1;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function money(v) {
  if (v === "" || v == null || Number.isNaN(Number(v))) return "—";
  return "S/ " + Number(v).toLocaleString("es-PE", {maximumFractionDigits:2});
}
function pct(v) {
  if (v === "" || v == null || Number.isNaN(Number(v))) return "—";
  return Number(v).toLocaleString("es-PE", {minimumFractionDigits:2, maximumFractionDigits:2}) + "%";
}
function intfmt(v) {
  if (v === "" || v == null) return "—";
  return Number(v).toLocaleString("es-PE");
}
function reachLabel(v) {
  return v==="se_tiene" ? "Se tiene llegada" : v==="se_puede" ? "Se puede llegar" : v==="no_se_tiene" ? "No se tiene llegada" : "Sin marcar";
}
function badge(v) {
  const cls = v==="Sí" ? "yes" : v==="No" ? "no" : "unknown";
  return `<span class="badge ${cls}">${esc(v || "No verificado")}</span>`;
}
function cellValue(row, col) {
  if (col==="reach_status") return reachState[row._id] || "";
  return row[col];
}
function renderCell(row, col) {
  const v = cellValue(row,col);
  if (col==="reach_status") {
    const rv = v || "";
    return `<select class="reach" data-id="${row._id}" data-value="${rv}">
      <option value="" ${rv===""?"selected":""}>Sin marcar</option>
      <option value="se_tiene" ${rv==="se_tiene"?"selected":""}>Se tiene llegada</option>
      <option value="se_puede" ${rv==="se_puede"?"selected":""}>Se puede llegar</option>
      <option value="no_se_tiene" ${rv==="no_se_tiene"?"selected":""}>No se tiene llegada</option>
    </select>`;
  }
  if (col==="universidad") return `<div class="name">${esc(v)}</div>`;
  if (["alumnos_aprox","ranking_precio"].includes(col)) return `<div class="num">${intfmt(v)}</div>`;
  if (col==="incremento_10_soles_pct") return `<div class="num">${pct(v)}</div>`;
  if (["precio_promedio_mensual_soles","pension_min_soles_mes","pension_max_soles_mes","costo_mensual_ingles_soles","costo_ingles_monto","costo_material_ingles_soles"].includes(col)) return `<div class="num">${money(v)}</div>`;
  if (col==="modelo_ingles") {
    const s = String(v||"");
    const c = s==="Tarifa aparte" ? "yes" : s==="Incluido en pensión" ? "no" : s==="Mixto" ? "warn2" : "unknown";
    return `<span class="badge ${c}">${esc(s||"\u2014")}</span>`;
  }
  if (col==="ofrece_curso_ingles") return badge(v);
  if (String(v).startsWith("http://") || String(v).startsWith("https://")) return `<a href="${esc(v)}" target="_blank" rel="noopener">Abrir fuente ↗</a>`;
  return esc(v || "—");
}

function filteredRows() {
  const q = $("search").value.trim().toLowerCase();
  const city = $("cityFilter").value;
  const eng = $("englishFilter").value;
  const reach = $("reachFilter").value;
  const price = $("priceFilter").value;

  let rows = DATA.filter(r => {
    const hay = Object.values(r).join(" ").toLowerCase();
    if (q && !hay.includes(q)) return false;
    if (city && r.ciudad_sede_principal !== city) return false;
    if (eng && r.ofrece_curso_ingles !== eng) return false;
    const rr = reachState[r._id] || "";
    if (reach === "sin_marcar" && rr !== "") return false;
    if (reach && reach !== "sin_marcar" && rr !== reach) return false;

    const ep = $("englishPriceFilter").value;
    if (ep && r.modelo_ingles !== ep) return false;

    if (price !== "") {
      const p = Number(r.precio_promedio_mensual_soles || 0);
      if (price === "0" && !(p < 1000)) return false;
      if (price !== "0" && !(p >= Number(price))) return false;
    }
    return true;
  });

  rows.sort((a,b) => {
    let av = cellValue(a,sortKey), bv = cellValue(b,sortKey);
    const an = Number(av), bn = Number(bv);
    if (av !== "" && bv !== "" && !Number.isNaN(an) && !Number.isNaN(bn)) return (an-bn)*sortDir;
    return String(av||"").localeCompare(String(bv||""), "es", {numeric:true})*sortDir;
  });
  return rows;
}

function isMobile(){ return window.matchMedia ? window.matchMedia("(max-width: 820px)").matches : window.innerWidth <= 820; }

function cardHTML(r){
  const labels = {reach_status:"Llegada", ...LABELS};
  const money2 = v => (v===""||v==null||Number.isNaN(Number(v))) ? "—" : "S/ "+Number(v).toLocaleString("es-PE",{maximumFractionDigits:2});
  const mens = r.costo_mensual_ingles_soles;
  const mv = (mens===""||mens==null) ? "—" : money2(mens);
  const mod = r.modelo_ingles||"";
  const cls = mod==="Tarifa aparte" ? "yes" : mod==="Incluido en pensión" ? "no" : mod==="Mixto" ? "warn2" : "unknown";
  const rows = displayCols.filter(c=>c!=="universidad" && c!=="reach_status")
    .map(c=>`<div class="crow"><span class="ck">${esc(labels[c]||c)}</span><span class="cv">${renderCell(r,c)}</span></div>`).join("");
  return `<article class="card" data-id="${r._id}">
    <button class="chead" type="button" aria-expanded="false">
      <span class="cname">${esc(r.universidad)}</span>
      <span class="cchev" aria-hidden="true">▾</span>
    </button>
    <div class="cmeta">
      <span class="badge ${cls}">${esc(mod||"—")}</span>
      <span class="cpill">${esc(r.ciudad_sede_principal||"—")}</span>
    </div>
    <div class="cstats">
      <div class="cstat"><span>Número de alumnos</span><b>${intfmt(r.alumnos_aprox)}</b></div>
      <div class="cstat"><span>Pensión promedio (S/ mes)</span><b>${money2(r.precio_promedio_mensual_soles)}</b></div>
      <div class="cstat"><span>+S/10 (% pensión prom.)</span><b>${pct(r.incremento_10_soles_pct)}</b></div>
      <div class="cstat"><span>Inglés (S/ mes)</span><b>${mv}</b></div>
    </div>
    <div class="creach">${renderCell(r,"reach_status")}</div>
    <div class="cbody">${rows}</div>
  </article>`;
}

function wireReach(){
  document.querySelectorAll(".reach").forEach(sel => {
    sel.addEventListener("change", e => {
      const id = e.target.dataset.id, val = e.target.value;
      if (val) reachState[id]=val; else delete reachState[id];
      localStorage.setItem(REACH_KEY, JSON.stringify(reachState));
      e.target.dataset.value = val;
      if ($("reachFilter").value) render();
    });
  });
}

function render() {
  const rows = filteredRows();
  const mob = isMobile();
  document.body.classList.toggle("is-mobile", mob);
  if (mob) {
    $("cards").innerHTML = rows.length ? rows.map(cardHTML).join("")
      : `<div class="empty">No hay universidades que coincidan con los filtros.</div>`;
    $("tbody").innerHTML = "";
    document.querySelectorAll(".chead").forEach(b => b.addEventListener("click", () => {
      const card = b.closest(".card");
      const open = card.classList.toggle("open");
      b.setAttribute("aria-expanded", open ? "true" : "false");
    }));
  } else {
    $("tbody").innerHTML = rows.map(r => `<tr>${displayCols.map(c=>`<td>${renderCell(r,c)}</td>`).join("")}</tr>`).join("");
    $("cards").innerHTML = "";
  }
  $("resultCount").textContent = `${rows.length} de ${DATA.length} universidades`;
  wireReach();
}

let _wasMobile = null;
window.addEventListener("resize", () => {
  const m = isMobile();
  if (m !== _wasMobile) { _wasMobile = m; render(); }
});

function buildHeader() {
  const labels = {reach_status:"Llegada", ...LABELS};
  $("thead").innerHTML = displayCols.map(c => {
    const arrow = sortKey===c ? (sortDir===-1 ? " ↓" : " ↑") : "";
    return `<th data-col="${c}">${esc(labels[c] || c)}${arrow}</th>`;
  }).join("");
  document.querySelectorAll("th").forEach(th => th.addEventListener("click", () => {
    const c = th.dataset.col;
    if (sortKey===c) sortDir *= -1; else { sortKey=c; sortDir=1; }
    buildHeader(); render();
    const ms=$("mobileSort"); if(ms) ms.value = `${sortKey}|${sortDir}`;
  }));
}

function populateFilters() {
  [...new Set(DATA.map(r=>r.ciudad_sede_principal).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es")).forEach(c => {
    $("cityFilter").insertAdjacentHTML("beforeend", `<option>${esc(c)}</option>`);
  });
}

function updateStats() {
  $("statUniversities").textContent = DATA.length.toLocaleString("es-PE");
  $("statStudents").textContent = DATA.reduce((s,r)=>s+Number(r.alumnos_aprox||0),0).toLocaleString("es-PE");
  const pr = DATA.map(r=>Number(r.costo_mensual_ingles_soles)).filter(n=>!Number.isNaN(n) && n>0);
  $("statAvgPrice").textContent = pr.length ? "S/ " + Math.round(pr.reduce((a,b)=>a+b,0)/pr.length).toLocaleString("es-PE") : "\u2014";
  $("statAvgLabel").textContent = `precio inglés promedio (${pr.length} de ${DATA.length})`;
}

["search","cityFilter","englishFilter","reachFilter","priceFilter","englishPriceFilter"].forEach(id => $(id).addEventListener("input", render));
$("resetBtn").addEventListener("click", () => {
  ["search","cityFilter","englishFilter","reachFilter","priceFilter","englishPriceFilter"].forEach(id => $(id).value="");
  sortKey="alumnos_aprox"; sortDir=-1; updateFilterCount(); buildHeader(); render();
});

$("exportBtn").addEventListener("click", () => {
  const rows = filteredRows();
  const exportCols = ["reach_status", ...COLS];
  const labels = {reach_status:"Llegada", ...LABELS};
  const q = v => `"${String(v??"").replaceAll('"','""')}"`;
  const lines = [exportCols.map(c=>q(labels[c]||c)).join(",")];
  rows.forEach(r => lines.push(exportCols.map(c => q(c==="reach_status" ? reachLabel(reachState[r._id]||"") : r[c])).join(",")));
  const blob = new Blob(["\ufeff"+lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="universidades_filtradas.csv"; a.click();
  URL.revokeObjectURL(a.href);
});

function buildMobileSort(){
  const labels = {reach_status:"Llegada", ...LABELS};
  const opts = displayCols.filter(c=>c!=="reach_status");
  $("mobileSort").innerHTML = opts.map(c =>
    `<option value="${c}|-1">${esc(labels[c]||c)} ↓</option><option value="${c}|1">${esc(labels[c]||c)} ↑</option>`
  ).join("");
  $("mobileSort").value = `${sortKey}|${sortDir}`;
  $("mobileSort").addEventListener("change", e => {
    const [k,d] = e.target.value.split("|");
    sortKey = k; sortDir = Number(d);
    buildHeader(); render();
  });
}

const FILTER_IDS = ["cityFilter","englishFilter","reachFilter","englishPriceFilter","priceFilter"];
function updateFilterCount(){
  const n = FILTER_IDS.filter(id => $(id).value !== "").length;
  const b = $("filterCount");
  b.textContent = n; b.hidden = n === 0;
}
$("filtersToggle").addEventListener("click", () => {
  const panel = $("filterPanel"), btn = $("filtersToggle");
  const open = panel.hasAttribute("hidden");
  if (open) panel.removeAttribute("hidden"); else panel.setAttribute("hidden","");
  btn.setAttribute("aria-expanded", open ? "true" : "false");
});
FILTER_IDS.forEach(id => $(id).addEventListener("input", updateFilterCount));
updateFilterCount();

populateFilters(); updateStats(); buildHeader(); buildMobileSort(); render();
</script>
