<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TuRuta Bear</title>
<style>
  .body-1 {
        fill: #000;
      }

      .body-1, .body-2, .body-3, .body-4 {
        stroke-width: 0px;
      }

      .body-2 {
        fill: #9ac7ef;
      }

      .body-3 {
        fill: #fef1da;
      }

      .body-4 {
        fill: none;
      }
.rightleg-1 {
        fill: #000;
      }

      .rightleg-1, .rightleg-2, .rightleg-3, .rightleg-4 {
        stroke-width: 0px;
      }

      .rightleg-2 {
        fill: #9ac7ef;
      }

      .rightleg-3 {
        fill: none;
      }

      .rightleg-4 {
        fill: #fefefe;
      }
.leftleg-1 {
        fill: #000;
      }

      .leftleg-1, .leftleg-2, .leftleg-3 {
        stroke-width: 0px;
      }

      .leftleg-2 {
        fill: #9ac7ef;
      }

      .leftleg-3 {
        fill: #fefefe;
      }
.div-1 {
        fill: #000;
        stroke-width: 0px;
      }
.leftarm-1 {
        fill: #000;
      }

      .leftarm-1, .leftarm-2, .leftarm-3 {
        stroke-width: 0px;
      }

      .leftarm-2 {
        fill: #9ac7ef;
      }

      .leftarm-3 {
        fill: none;
      }
.rightarm-1 {
        fill: #fef9f1;
      }

      .rightarm-1, .rightarm-2, .rightarm-3, .rightarm-4, .rightarm-5 {
        stroke-width: 0px;
      }

      .rightarm-2 {
        fill: #000;
      }

      .rightarm-3 {
        fill: #9ac7ef;
      }

      .rightarm-4 {
        fill: #dd4251;
      }

      .rightarm-5 {
        fill: #bebebe;
      }
.head-1 {
        fill: #f2a89c;
      }

      .head-1, .head-2, .head-3, .head-4, .head-5, .head-6 {
        stroke-width: 0px;
      }

      .head-2 {
        fill: #000;
      }

      .head-3 {
        fill: #9ac7ef;
      }

      .head-4 {
        fill: #fef1da;
      }

      .head-5 {
        fill: none;
      }

      .head-6 {
        fill: #fff;
      }
.glasses-1 {
        fill: #000;
      }

      .glasses-1, .glasses-2 {
        stroke-width: 0px;
      }

      .glasses-2 {
        fill: none;
      }
.bowtie-1 {
        fill: #000;
      }

      .bowtie-1, .bowtie-2 {
        stroke-width: 0px;
      }

      .bowtie-2 {
        fill: #203683;
      }
.tummy-1 {
        fill: #000;
      }

      .tummy-1, .tummy-2, .tummy-3 {
        stroke-width: 0px;
      }

      .tummy-2 {
        fill: #fef1da;
      }

      .tummy-3 {
        fill: none;
      }

  html,body{margin:0;height:100%;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;
    background:radial-gradient(circle at 50% 35%,#eaf4ff 0%,#dcecfb 45%,#cfe3f7 100%);}
  .stage{position:relative;width:min(80vw,460px);aspect-ratio:416.52/613.16;}
  /* ground shadow stays constant — the bear is planted */
  .shadow{position:absolute;left:50%;bottom:3.6%;width:66%;height:6%;
    transform:translateX(-50%);border-radius:50%;
    background:rgba(0,0,0,.23);}
  .bear{position:absolute;inset:0;}
  .group{position:absolute;inset:0;}
  .layer{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}

  /* the torso bobs from the hips upward; feet (legs) stay planted */
  .torso{animation:torsobob 3.6s ease-in-out infinite;}

  .head    {transform-origin:49.9% 47.3%;    animation:head    3.6s ease-in-out infinite;}
  .glassesfollow{position:absolute;inset:0;transform-origin:49.9% 47.3%;animation:head 3.6s ease-in-out infinite;}
  .bowtie  {transform-origin:45.6% 49.6%;  animation:bowtie  3.6s ease-in-out infinite;}
  .leftarm {transform-origin:67.2% 47.6%; animation:leftarm 4.8s ease-in-out infinite;}
  .rightarm{transform-origin:34.8% 47.6%;animation:rightarm 3.6s ease-in-out infinite;}
  .leftleg {transform-origin:65.3% 96.5%; animation:legstretch 3.6s ease-in-out infinite;}
  .rightleg{transform-origin:33.4% 94.3%; animation:legstretch 3.6s ease-in-out infinite;}
  .body,
  .tummy   {transform-origin:50.0% 76.6%;    animation:breathe 3.6s ease-in-out infinite;}

  /* grounded bob: vertical rise of the torso only, feet unaffected */
  @keyframes torsobob{0%,100%{transform:translateY(0);}50%{transform:translateY(-1.3%);}}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scaleX(1.02) scaleY(.985);}}
  @keyframes head{0%,100%{transform:rotate(0deg) translateY(0);}30%{transform:rotate(-1.7deg) translateY(-.3%);}70%{transform:rotate(1.5deg) translateY(-.3%);}}
  @keyframes bowtie{0%,100%{transform:rotate(0deg) scale(1);}50%{transform:rotate(2.5deg) scale(1.05);}}
  /* relaxed harmonic pendulum: tighter ROM, less outward, resting a hair higher */
  @keyframes leftarm{
    0%,100%{transform:translateY(-0.9%) rotate(2deg);}
    50%{transform:translateY(-0.9%) rotate(-5deg);}}
  @keyframes rightarm{0%,100%{transform:rotate(0deg) translateY(0);}50%{transform:rotate(-3.2deg) translateY(-1.1%);}}
  /* subtle leg weight-shift, feet pivot in place at the ankle-ish hip */
  /* legs stretch upward from the planted foot to follow the torso's rise */
  @keyframes legstretch{0%,100%{transform:scaleY(1);}50%{transform:scaleY(1.05);}}
</style>
</head>
