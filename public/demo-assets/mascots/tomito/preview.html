<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vista previa de Tomito</title>
<style>
  :root { --bg: #F4F4F6; --ink: #1A1A1A; --muted: #6b6b75; --line: #e2e2e8; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 ui-rounded, 'Segoe UI', system-ui, sans-serif;
         color: var(--ink); background: var(--bg); }
  header { padding: 18px 20px; border-bottom: 1px solid var(--line); background: #fff; }
  header h1 { margin: 0; font-size: 18px; font-weight: 800; }
  header p  { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px 20px; align-items: flex-start; }
  .stage { flex: 1 1 320px; min-height: 380px; display: flex; align-items: flex-end;
           justify-content: center; padding: 24px; border-radius: 18px;
           border: 2px dashed var(--line); background: #fff; }
  .stage.dark { background: #16161c; border-color: #2c2c36; }
  .panel { flex: 0 0 280px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
              color: var(--muted); margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .row label { flex: 1; font-size: 14px; font-weight: 600; }
  input[type=range] { width: 130px; }
  ul.layers { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
  ul.layers li { display: flex; justify-content: space-between; gap: 10px;
                 padding: 6px 0; border-bottom: 1px solid var(--line); }
  .ok   { color: #2E7D1A; font-weight: 700; }
  .bad  { color: #c62828; font-weight: 700; }
  .note { margin-top: 18px; padding: 12px 14px; border-radius: 12px;
          background: #FFF6E5; border: 1px solid #F0D9A8; font-size: 13.5px; }
  code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 5px;
         font: 600 12.5px ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1 id="title">Vista previa de Tomito</h1>
  <p id="subtitle">Cargando el pack…</p>
</header>

<main>
  <div class="stage" id="stage"></div>
  <div class="panel">
    <h2>Ajustes</h2>
    <div class="row">
      <label for="size">Ancho</label>
      <input type="range" id="size" min="60" max="360" value="180">
      <span id="sizeval">180px</span>
    </div>
    <div class="row">
      <label for="dark">Fondo oscuro</label>
      <input type="checkbox" id="dark">
    </div>
    <h2 style="margin-top:22px">Capas</h2>
    <ul class="layers" id="layers"></ul>
    <div class="note" id="note" hidden></div>
  </div>
</main>

<script src="../mascot-runtime.js"></script>
<script>
  var stage = document.getElementById('stage');
  var note  = document.getElementById('note');

  function fail(msg) {
    document.getElementById('subtitle').textContent = 'No se pudo cargar el pack.';
    note.hidden = false;
    note.innerHTML = msg;
  }

  Mascot.load('./').then(function () {
    var m = Mascot.manifest();
    document.title = 'Vista previa · ' + m.name;
    document.getElementById('title').textContent = m.emoji ? m.emoji + ' ' + m.name : m.name;
    document.getElementById('subtitle').textContent =
      'pack «' + m.id + '» · artboard ' + m.artboard.width + ' × ' + m.artboard.height +
      ' · proporción alto/ancho ' + Mascot.ratio().toFixed(3);

    var el = document.createElement('div');
    stage.appendChild(el);
    Mascot.mount(el, { width: 180 });

    document.getElementById('size').oninput = function () {
      var w = +this.value;
      document.getElementById('sizeval').textContent = w + 'px';
      el.style.width = w + 'px';
      el.style.height = (w * Mascot.ratio()) + 'px';
    };
    document.getElementById('dark').onchange = function () {
      stage.classList.toggle('dark', this.checked);
    };

    // Cada capa declarada se reporta como cargada o rota — el mismo criterio que
    // usa el validador al subir un pack nuevo.
    var list = document.getElementById('layers');
    Object.keys(m.layers).forEach(function (name) {
      var li = document.createElement('li');
      li.innerHTML = '<span>' + name + '</span><span class="bad">…</span>';
      list.appendChild(li);
      var probe = new Image();
      probe.onload  = function () { li.lastChild.className = 'ok';  li.lastChild.textContent = 'ok'; };
      probe.onerror = function () { li.lastChild.className = 'bad'; li.lastChild.textContent = 'falta'; };
      probe.src = m.layers[name];
    });
  }).catch(function (e) {
    fail('Abre esta página desde un servidor local — <code>fetch()</code> no puede leer ' +
         '<code>mascot.json</code> sobre <code>file://</code>.<br><br>' +
         'Desde esta carpeta:<br><code>python -m http.server 8000</code><br>' +
         'y entra a <code>http://localhost:8000/preview.html</code>.<br><br>' +
         '<small>' + e.message + '</small>');
  });
</script>
</body>
</html>
