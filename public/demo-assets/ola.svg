  <!--
    Ola de la cabecera del onboarding, calcada de ola.png.

    Siempre en el mismo sentido, y repite sin costura: el patrón mide 21 y
    entra y sale por la misma fila, así que dos copias seguidas empalman.

    El recorte original (17 px) subía hasta la cresta y se quedaba a medio bajar
    —entraba por la fila 13 y salía por la 3—, por eso no se podía repetir tal
    cual. Se le añadió el frente que le faltaba, más corto que la subida: una ola
    rompe hacia adelante, no es simétrica.

    Va volteada respecto al PNG: lo macizo arriba, pegado al borde de la
    pantalla, y las crestas hacia abajo. El color lo pone el demo
    (currentColor).
  -->
