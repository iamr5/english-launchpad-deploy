    Ola de la cabecera del onboarding, calcada de ola.png (17 × 23 px).

    El patrón que se repite mide 34, no 17: son la pieza y su reflejo. El
    original no empalma consigo mismo —sus bordes difieren en 5 de 23 filas—,
    pero sí con su espejo, porque en la costura se tocan dos copias del mismo
    borde. Así se repite con background-repeat: repeat-x sin que se note.

    Va volteada en vertical respecto al PNG: lo macizo arriba, pegado al borde de
    la pantalla, y las crestas hacia abajo.

    El color se hereda del contenedor (currentColor), así lo pone el demo.
