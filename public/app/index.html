// TTS
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
let _speaking = false;
function speak(text, onStart, onEnd) {
  try {
    const synth = window.speechSynthesis;
    if (!synth) return;
    if (_speaking) { synth.cancel(); _speaking = false; if (onEnd) onEnd(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.45; u.pitch = 1.0;
    u.onstart = () => { _speaking = true; if (onStart) onStart(); };
    u.onend = () => { _speaking = false; if (onEnd) onEnd(); };
    u.onerror = () => { _speaking = false; if (onEnd) onEnd(); };
    synth.cancel(); synth.speak(u);
  } catch (e) {}
}

  const dest = b.getAttribute('data-nav');

  if (dest === 'course') renderCourse();

// Enable the in-page debug controls (complete lesson / reset progress / undo /

function pbar(progress, completed, color) {
  const pct = Math.round(progress * 100);
  const label = completed
    ? `<div class="pct done">Completado</div>`
    : `<div class="pct">${pct}%</div>`;
  const bg = (color && !completed) ? `;background:${color}` : '';
  const w = completed ? 98 : (pct > 0 ? Math.max(pct, 8) : 0);
  return `<div class="pbar"><div class="fill ${completed ? 'done' : ''}" style="width:${w}%${w === 0 ? ';min-width:12px' : ''}${bg}"></div>${label}</div>`;
}

// The next thing the learner should do: first unlocked, not-yet-completed
// lesson (with its module). Null when the whole route is finished.
function nextActiveLesson() {
  for (const m of course.modules) {
    for (const l of m.lessons) {
      if (isLessonUnlocked(l.id) && !isLessonCompleted(l.id)) return { lesson: l, mod: m };
    }
  }
  return null;
}
// Display helpers: a meaningful lesson name (the titulo "hook") + its topic
// subtitle, module names without the "Módulo N:" prefix, and the colored number
// badges — modules use a fixed tasteful palette; lessons ramp green→orange-red.
const MODULE_COLORS = ['#3FAA24', '#1CB0F6', '#CE82FF', '#FF9600', '#FF6FA5'];
function tituloOf(lesson) { return lesson.contentBlocks.find(b => b.type === 'titulo') || {}; }

function lessonTopic(lesson) { return tituloOf(lesson).subtitle || ''; }
function moduleName(m) { return m.title.replace(/^M[oó]dulo\s*\d+\s*[:.\-–—]?\s*/i, ''); }
function moduleMinutes(m) { return m.lessons.reduce((s, l) => s + readingMinutes(l), 0); }

function fmtMinutes(min) {

function lessonBadgeColor(i, total) { const t = total > 1 ? i / (total - 1) : 0; return `hsl(${Math.round(120 - 108 * t)} 70% 46%)`; }

function courseHero() {

// Per-module accent color (the module's main color: top bar, button caps, ring, popovers,

// Tint a hex toward black (amt<0) or white (amt>0); |amt| is the mix fraction.
function shadeHex(hex, amt) {

  const t = amt < 0 ? 0 : 255, p = Math.abs(amt), c = v => ('0' + Math.round(v).toString(16)).slice(-2);

  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;

}

function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function renderMC(host, q, onCorrect, onIncorrect) {

  const overlay = document.getElementById('overlay'), sheet = document.getElementById('sheet');
  // Two-pass flow: answer the whole round, then redo only the questions you missed.
  // Miss a question again in the redo round → repeat the entire quiz (failed state).
  let round, redo, idx, correct, results, failedQs, answered = 0;
  _dismissGuard = () => answered > 0; // confirm before leaving once a question is answered
  function startRound(qs, isRedo) { round = qs; redo = isRedo; idx = 0; correct = 0; results = []; failedQs = []; step(); }
  function step() {
    sheet.classList.remove('result');
    sheet.innerHTML = `<div class="handle"></div>
      <div class="q-top"><div class="segs" id="mq-segs"></div><span class="q-counter" id="mq-counter"></span></div>
      <div class="quiz-host" id="mq-host"></div>`;
    renderQuiz(document.getElementById('mq-host'), round[idx],
      () => { correct++; answered++; results[idx] = true; advance(); },
      () => { answered++; results[idx] = false; failedQs.push(round[idx]); advance(); });
    quizProgress(document.getElementById('mq-segs'), document.getElementById('mq-counter'), round.length, idx, results);
  }
  function advance() { if (idx < round.length - 1) { idx++; step(); } else finish(); }
  function finish() {
    if (failedQs.length === 0) return pass();
    if (redo) return showFail();            // missed again in the redo round → full reset
    return showRedo(failedQs.slice());      // first pass: redo just the missed ones
  }
  function result(iconName, iconColor, cls, title, sub, btnCls, btnLabel, onAction) {
    sheet.classList.add('result');
    sheet.innerHTML = `<div class="handle"></div><div class="center-col">
      <div class="result-icon ${cls}">${icon(iconName, cls === 'ok' ? 40 : 38, iconColor)}</div>
      <div class="result-title">${title}</div>
      <div class="result-sub">${sub}</div>
      <button class="btn ${btnCls}" id="mq-action">${btnLabel}</button>
      </div>`;
    document.getElementById('mq-action').onclick = onAction;
  }
  function pass() {
    result('check', '#2E7D1A', 'ok', '¡Bien hecho!', '¡Siguiente sección desbloqueada!', 'green', 'Continuar', () => {
      closeOverlay(); markMiniQuizCompleted(lesson, block.id);
      const sc = document.getElementById('lesson-scroll');
      const prev = sc ? sc.scrollTop : 0;
      renderLessonBody(lesson);
      // Keep the reader where they were after the newly unlocked block is inserted.
      // Recompute the segment scroll against the NEW (taller) content — otherwise the
      // bar would reuse the stale ~100% segment value and jump to the new end even
      // though the reader is still at the old position (now mid-content).
      requestAnimationFrame(() => {
        if (sc) sc.scrollTop = prev;
        const max = sc ? sc.scrollHeight - sc.clientHeight : 0;
        const seg = max >= 100 ? Math.min(1, Math.max(0, sc.scrollTop / max)) : 1;
        setScroll(lesson.id, seg);
        updateCompletion(lesson, CURRENT.module, seg);
      });
    });
  }
  function showRedo(failed) {
    const one = failed.length === 1;
    result('refresh', '#5C5159', 'no', 'Repasemos',
      `Fallaste ${failed.length} ${one ? 'pregunta' : 'preguntas'}. Vuelve a intentarla${one ? '' : 's'} para continuar.`,
      'amber', `Repasar${one ? '' : ` (${failed.length})`}`, () => startRound(shuffle(failed), true));
  }
  function showFail() {
    result('refresh', '#5C5159', 'no', 'Casi lo tienes',
      'Fallaste otra vez. Repite el quiz completo para continuar.',
      'blue', 'Reintentar', () => startRound(shuffle(block.miniQuiz), false));
  }
  sheet.dataset.dismissible = 'true'; overlay.classList.add('active');
  startRound(shuffle(block.miniQuiz), false);
}

// FINAL QUIZ (full screen) — must pass all
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
function openFinalQuiz(lesson, mod) {
  CURRENT.lesson = lesson; CURRENT.module = mod;
  show('quiz');
  const host = document.getElementById('quiz-host');
  const segs = document.getElementById('quiz-segs'), counter = document.getElementById('quiz-counter');
  // Same two-pass flow as the mini-quiz: redo only the missed questions; miss any of
  // them a second time and the whole quiz restarts (failed state).
  let round, redo, idx, correct, results, failedQs, skillAgg;
  // Skill tally captures the FIRST full pass through the quiz (redo rounds and
  // clean-slate retries don't stack): reset it whenever a non-redo round starts.
  function recSkill(q, ok) { const s = skillAgg[qSkill(q.type)]; s.t++; if (!ok) s.e++; }
  function startRound(qs, isRedo) {
    if (!isRedo) skillAgg = { listening: { t: 0, e: 0 }, reading: { t: 0, e: 0 }, writing: { t: 0, e: 0 } };
    round = qs; redo = isRedo; idx = 0; correct = 0; results = []; failedQs = []; step();
  }
  function step() {
    renderQuiz(host, round[idx],
      () => { correct++; results[idx] = true; if (!redo) recSkill(round[idx], true); advance(); },
      () => { results[idx] = false; failedQs.push(round[idx]); if (!redo) recSkill(round[idx], false); advance(); });
    quizProgress(segs, counter, round.length, idx, results);
  }
  function advance() { if (idx < round.length - 1) { idx++; step(); } else finish(); }
  function finish() {
    if (failedQs.length === 0) return pass();
    if (redo) return showFail();
    return showRedo(failedQs.slice());
  }
  function pass() {
    const was = isQuizCompleted(lesson.id);
    lp(lesson.id).skillErr = skillAgg; // record this lesson's per-skill first-try mistakes
    markQuizCompleted(lesson.id);
    showDialog(`<div class="center-col">
      <div class="result-icon ok" style="background:var(--green)"><img src="completed_new.svg" style="width:48px;height:auto" alt=""></div>
      <div class="result-title">¡Lección completada!</div>
      <div class="result-sub">¡Vas muy bien!</div>
      <button class="btn green" id="dlg-ok">Continuar</button></div>`, () => {
      closeOverlay();
      const cierre = lesson.contentBlocks.find(b => b.type === 'cierre');
      if (!was && cierre) openCierreSheet(cierre);
      else { renderModule(mod); }
    });
  }
  function showRedo(failed) {
    const one = failed.length === 1;
    showDialog(`<div class="center-col">
      <div class="result-icon no">${icon('refresh', 40, '#5C5159')}</div>
      <div class="result-title">Repasemos</div>
      <div class="result-sub">Fallaste ${failed.length} ${one ? 'pregunta' : 'preguntas'}. Vuelve a intentarla${one ? '' : 's'} para terminar.</div>
      <button class="btn amber" id="dlg-ok">Repasar${one ? '' : ` (${failed.length})`}</button>
      <div style="height:12px"></div><button class="btn" style="background:none;color:var(--blue)" id="dlg-back">Volver al módulo</button></div>`,
      () => { closeOverlay(); startRound(shuffle(failed), true); },
      () => { closeOverlay(); renderModule(mod); });
  }
  function showFail() {
    showDialog(`<div class="center-col">
      <div class="result-icon no">${icon('refresh', 40, '#5C5159')}</div>
      <div class="result-title">Casi lo tienes</div>
      <div class="result-sub">Fallaste otra vez. Repite el quiz completo para pasar.</div>
      <button class="btn blue" id="dlg-ok">Reintentar</button>
      <div style="height:12px"></div><button class="btn" style="background:none;color:var(--blue)" id="dlg-back">Volver al módulo</button></div>`,
      () => { closeOverlay(); startRound(shuffle(lesson.quizQuestions), false); },
      () => { closeOverlay(); renderModule(mod); });
  }
  startRound(shuffle(lesson.quizQuestions), false);
}

let _dismissGuard = null; // when set, returns true if dismissing the sheet needs confirmation
function closeOverlay() {
  _dismissGuard = null;
  document.getElementById('overlay').classList.remove('active');

  s.style.transform = ''; s.style.transition = '';

// Slide the sheet down then tear it down — for user-initiated dismissals only
// (tap-outside / drag). Internal handoffs keep calling closeOverlay() directly.
function animateDismiss() {
  const s = document.getElementById('sheet');
  s.style.transition = 'transform .25s ease';
  s.style.transform = 'translateY(100%)';
  setTimeout(closeOverlay, 240);
}
function confirmDismiss(onYes) {
  let c = document.getElementById('confirm-pop');
  if (!c) { c = document.createElement('div'); c.id = 'confirm-pop'; c.className = 'confirm-pop'; document.body.appendChild(c); }

    <button class="btn" id="confirm-leave" style="background:none;color:var(--blue);font-weight:700">Salir</button>
  </div>`;
  c.classList.add('show');
  document.getElementById('confirm-stay').onclick = () => c.classList.remove('show');
  document.getElementById('confirm-leave').onclick = () => { c.classList.remove('show'); onYes(); };
}
function requestDismiss() {
  const s = document.getElementById('sheet');
  if (_dismissGuard && _dismissGuard()) {
    s.style.transition = 'transform .2s ease'; s.style.transform = 'translateY(0)';
    confirmDismiss(animateDismiss);
  } else {
    animateDismiss();

}

// A sheet is dismissible (tap-outside / drag-down) when sheet.dataset.dismissible
// is 'true'. Mini-quiz / Langles / cierre are dismissible; the final-quiz pass/fail
// dialogs are not (they require an explicit button choice, matching the app).
(function setupSheetDismiss() {
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  const dismissible = () => sheet.dataset.dismissible === 'true';
  overlay.addEventListener('click', (e) => { if (e.target.id === 'overlay' && dismissible()) requestDismiss(); });
  // Drag the grab handle downward to dismiss — mouse + touch via Pointer Events.
  let startY = null, dragging = false;
  const snapBack = () => { sheet.style.transition = 'transform .2s ease'; sheet.style.transform = 'translateY(0)'; };
  sheet.addEventListener('pointerdown', (e) => {
    if (!dismissible()) return;
    const t = e.target;
    if (!(t.classList && t.classList.contains('handle'))) return;
    startY = e.clientY; dragging = true; sheet.style.transition = 'none';
    if (sheet.setPointerCapture) sheet.setPointerCapture(e.pointerId);
  });
  sheet.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    sheet.style.transform = 'translateY(' + Math.max(0, e.clientY - startY) + 'px)';
  });
  sheet.addEventListener('pointerup', (e) => {
    if (!dragging) return; dragging = false;
    if (e.clientY - startY > 110) requestDismiss(); else snapBack();
  });
  sheet.addEventListener('pointercancel', () => { if (dragging) { dragging = false; snapBack(); } });
})();

// DEBUG: complete the next pending mini-quiz of the currently open lesson, then
// re-render and re-sync progress exactly like passing it for real would. Finishing
// a module's last microlección auto-completes the module (see markQuizCompleted).
function debugFinishNextMiniQuiz() {
  const onLesson = !!CURRENT.lesson && document.getElementById('screen-lesson').classList.contains('active');
  if (!onLesson) {
    // Complete the next-in-line microlección ENTIRELY (mini-quizzes + final quiz) and refresh.
    const next = allLessons.find(l => isLessonUnlocked(l.id) && !isLessonCompleted(l.id));
    if (!next) { toast('¡Curso completado! (debug)'); return; }
    next.contentBlocks.forEach(b => {
      if (b.requiresQuizToUnlockNext && b.miniQuiz && b.miniQuiz.length && !isMiniQuizCompleted(next.id, b.id)) markMiniQuizCompleted(next, b.id);
    });
    markQuizCompleted(next.id);
    toast('Completada (debug): ' + next.title);
    if (document.getElementById('screen-module').classList.contains('active') && CURRENT.module) renderModule(CURRENT.module);
    else if (document.getElementById('screen-course').classList.contains('active')) renderCourse();
    return;
  }
  const lesson = CURRENT.lesson, mod = CURRENT.module;
  const blocks = lesson.contentBlocks;
  const lastIdx = lastUnlockedBlockIndex(lesson);
  let target = null;
  for (let i = 0; i <= lastIdx && i < blocks.length; i++) {
    const b = blocks[i];
    if (b.requiresQuizToUnlockNext && b.miniQuiz && b.miniQuiz.length && !isMiniQuizCompleted(lesson.id, b.id)) { target = b; break; }
  }
  if (!target) {
    // No pending mini-quiz: complete this microlección's FINAL quiz (which also
    // auto-completes the module if it was the last lesson). Next tap jumps onward.
    if (!isLessonCompleted(lesson.id)) {
      markQuizCompleted(lesson.id);
      updateCompletion(lesson, mod);
      toast('Quiz final completado (debug)');
      return;
    }
    const nId = nextLessonId(lesson.id);
    const nl = nId ? allLessons.find(l => l.id === nId) : null;
    if (nl) {
      const nmod = course.modules.find(mm => mm.lessons.some(l => l.id === nId)) || mod;
      openLesson(nl, nmod);
      toast('Siguiente microlección (debug)');
    } else {
      toast('¡Curso completado! (debug)');
    }
    return;
  }
  const sc = document.getElementById('lesson-scroll');
  const prev = sc ? sc.scrollTop : 0;
  markMiniQuizCompleted(lesson, target.id);
  renderLessonBody(lesson);
  requestAnimationFrame(() => {
    if (sc) sc.scrollTop = prev;
    const max = sc ? sc.scrollHeight - sc.clientHeight : 0;
    const seg = max >= 100 ? Math.min(1, Math.max(0, sc.scrollTop / max)) : 1;
    setScroll(lesson.id, seg);
    updateCompletion(lesson, mod, seg);
  });
  toast('Mini-quiz completado (debug)');
}

// DEBUG: rebuild every block's `unlocked` flag of a lesson purely from which
// mini-quizzes are currently marked done. This is the deterministic inverse of
// markMiniQuizCompleted's incremental unlocking, so clearing one `mq` flag and
// recomputing correctly re-locks whatever that mini-quiz had opened.
function debugRecomputeBlockLocks(lesson) {
  const blocks = lesson.contentBlocks;
  const L = lp(lesson.id);
  let firstGated = blocks.findIndex(b => b.type === 'teoria' && b.requiresQuizToUnlockNext);
  if (firstGated < 0) firstGated = 0;
  const gated = blocks.filter(b => b.type === 'teoria' && b.requiresQuizToUnlockNext && b.miniQuiz && b.miniQuiz.length);
  const lastGatedId = gated.length ? gated[gated.length - 1].id : null;
  const unlocked = new Set();
  for (let i = 0; i <= firstGated && i < blocks.length; i++) unlocked.add(blocks[i].id);
  gated.forEach(tb => {
    if (!(L.blocks[tb.id] && L.blocks[tb.id].mq)) return;
    const idx = blocks.findIndex(b => b.id === tb.id);
    if (tb.id === lastGatedId) { for (let i = idx + 1; i < blocks.length; i++) unlocked.add(blocks[i].id); }
    else if (idx >= 0 && idx < blocks.length - 1) unlocked.add(blocks[idx + 1].id);
  });
  blocks.forEach(b => { L.blocks[b.id] = Object.assign({}, L.blocks[b.id], { unlocked: unlocked.has(b.id) }); });
  saveProgress(PROGRESS);
}

// DEBUG: re-render the current screen after an undo, preserving lesson scroll.
function debugRefresh(onLesson, lesson, mod) {
  if (onLesson) {
    const sc = document.getElementById('lesson-scroll');
    const prev = sc ? sc.scrollTop : 0;
    renderLessonBody(lesson);
    requestAnimationFrame(() => { if (sc) sc.scrollTop = prev; updateCompletion(lesson, mod); });
  } else if (document.getElementById('screen-module').classList.contains('active') && CURRENT.module) {
    renderModule(CURRENT.module);
  } else if (document.getElementById('screen-course').classList.contains('active')) {
    renderCourse();
  }
}

// DEBUG: undo exactly ONE quiz completion, in reverse of the forward stepper:
// final quiz -> last mini-quiz -> earlier mini-quizzes -> step to previous lesson.
function debugUndoLastQuiz() {
  const onLesson = !!CURRENT.lesson && document.getElementById('screen-lesson').classList.contains('active');
  let lesson = null, mod = null;
  if (onLesson) { lesson = CURRENT.lesson; mod = CURRENT.module; }
  else {
    for (let i = allLessons.length - 1; i >= 0; i--) {
      const l = allLessons[i], p = PROGRESS[l.id];
      const hasMq = p && p.blocks && Object.keys(p.blocks).some(k => p.blocks[k] && p.blocks[k].mq);
      if (isQuizCompleted(l.id) || hasMq) { lesson = l; mod = course.modules.find(m => m.lessons.some(x => x.id === l.id)); break; }
    }
    if (!lesson) { toast('Nada que deshacer (debug)'); return; }
  }

  // 1) Final quiz completed -> undo it. Re-locks the next lesson AND clears the
  //    module-completed flag, since the module auto-completes with the last quiz.
  if (isQuizCompleted(lesson.id)) {
    const L = lp(lesson.id);
    L.quizCompleted = false;
    const nId = nextLessonId(lesson.id);
    if (nId && allLessons[0].id !== nId) lp(nId).unlocked = false; // re-lock next lesson (forward step had unlocked it)
    if (mod && PROGRESS['__modules'] && PROGRESS['__modules'][mod.id]) PROGRESS['__modules'][mod.id] = false;
    saveProgress(PROGRESS);
    debugRefresh(onLesson, lesson, mod);
    toast('Quiz final deshecho (debug): ' + lesson.title);
    return;
  }

  // 2) Undo the most recently completed mini-quiz.
  const gated = lesson.contentBlocks.filter(b => b.type === 'teoria' && b.requiresQuizToUnlockNext && b.miniQuiz && b.miniQuiz.length);
  let target = null;
  for (let i = gated.length - 1; i >= 0; i--) { if (isMiniQuizCompleted(lesson.id, gated[i].id)) { target = gated[i]; break; } }
  if (target) {
    const L = lp(lesson.id);
    L.blocks[target.id] = Object.assign({}, L.blocks[target.id], { mq: false });
    debugRecomputeBlockLocks(lesson);
    debugRefresh(onLesson, lesson, mod);
    toast('Mini-quiz deshecho (debug): ' + target.id);
    return;
  }

  // 3) Nothing left on this lesson -> step back to the previous microlección.
  const idx = allLessons.findIndex(l => l.id === lesson.id);
  const prev = idx > 0 ? allLessons[idx - 1] : null;
  if (prev && onLesson) {
    const pmod = course.modules.find(m => m.lessons.some(l => l.id === prev.id)) || mod;
    openLesson(prev, pmod);
    toast('Microlección anterior (debug)');
  } else {
    toast('Inicio del curso (debug)');
  }
}

// PLACEMENT TEST UI — drives #screen-placement using window.PLACEMENT (placement.js).
// Presents items A1→C1, stops early on a weak band, then calls onDone(result)
// where result = { nivel, module, porBanda, desc }.

let PL = null;
function startPlacement(onDone) {
  const P = window.PLACEMENT;
  PL = { order: P.order(), idx: 0, chosen: null, answers: [], t0: Date.now(), onDone: onDone, finished: false, result: null };
  document.getElementById('pl-result').hidden = true;
  document.getElementById('pl-q').hidden = false;
  show('placement');
  plItem();
}
function plItem() {
  const it = PL.order[PL.idx];
  PL.chosen = null;
  document.getElementById('pl-bubble').innerHTML = 'Completa la frase 👇';
  document.getElementById('pl-qtext').innerHTML = it.q.replace(/___/g, '<span class="gap">_____</span>');
  const host = document.getElementById('pl-opts'); host.innerHTML = '';
  const pick = (val, el) => { PL.chosen = val; [...host.children].forEach(c => c.classList.remove('sel')); el.classList.add('sel'); document.getElementById('pl-next').disabled = false; };
  window.PLACEMENT.shuffle(it.opts.length).forEach(oi => {
    const b = document.createElement('button'); b.className = 'opt';
    b.innerHTML = `<span>${escapeHtml(it.opts[oi])}</span><span class="opt-ic"></span>`;
    b.onclick = () => pick(oi, b); host.appendChild(b);
  });
  const ns = document.createElement('button'); ns.className = 'opt';
  ns.innerHTML = `<span style="color:var(--muted2);font-weight:600">No lo sé</span><span class="opt-ic"></span>`;
  ns.onclick = () => pick(-1, ns); host.appendChild(ns);
  const btn = document.getElementById('pl-next');
  btn.textContent = (PL.idx === PL.order.length - 1) ? 'Terminar' : 'Continuar';
  btn.disabled = true;
  plProgress();
}
function plProgress() {
  const pct = (PL.idx / PL.order.length) * 100;
  const bar = document.getElementById('pl-bar');
  bar.style.width = pct.toFixed(1) + '%';
  const pctEl = document.getElementById('pl-bar-pct');
  pctEl.textContent = Math.round(pct) + '%';
  bar.classList.remove('done'); pctEl.classList.remove('done');
  document.getElementById('pl-count').textContent = 'Pregunta ' + (PL.idx + 1) + ' de ' + PL.order.length;
  const s = Math.round((Date.now() - PL.t0) / 1000);
  document.getElementById('pl-time').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function plNext() {
  const it = PL.order[PL.idx];
  PL.answers.push({ id: it.id, band: it.band, ok: PL.chosen === it.a });
  const endOfBand = !PL.order[PL.idx + 1] || PL.order[PL.idx + 1].band !== it.band;
  if (endOfBand && window.PLACEMENT.shouldStop(PL.answers, it.band)) return plFinish();
  PL.idx++;
  if (PL.idx >= PL.order.length) return plFinish();
  plItem();
}
function plFinish() {
  const P = window.PLACEMENT, res = P.level(PL.answers);
  PL.finished = true; PL.result = res;
  const plBar = document.getElementById('pl-bar'); plBar.style.width = '100%'; plBar.classList.add('done');
  const plPct = document.getElementById('pl-bar-pct'); plPct.textContent = '100%'; plPct.classList.add('done');
  document.getElementById('pl-count').textContent = 'Completado';
  document.getElementById('pl-bubble').innerHTML = '¡Listo! Ya sé por dónde<br>te conviene empezar.';
  document.getElementById('pl-q').hidden = true;
  const shown = res.nivel === 'Pre-A1' ? 'A1' : res.nivel;
  const r = document.getElementById('pl-result'); r.hidden = false;
  r.innerHTML = `<div class="pl-cap">Tu nivel estimado</div><div class="pl-lv">${shown}</div>`
    + `<div class="pl-desc">${res.desc}</div>`
    + `<div class="pl-prof">` + P.BANDS.map(b => {
        const d = res.porBanda[b];
        if (!d) return `<div class="pl-prow"><span class="lb">${b}</span><span class="track"><i style="width:0"></i></span><span class="n">—</span></div>`;
        const pct = Math.round(d.ok / d.n * 100), cls = d.ok >= P.UMBRAL ? '' : (d.ok >= P.CORTE_ABANDONO + 1 ? 'low' : 'bad');
        return `<div class="pl-prow"><span class="lb">${b}</span><span class="track"><i class="${cls}" style="width:${pct}%"></i></span><span class="n">${d.ok}/${d.n}</span></div>`;
      }).join('') + `</div>`;
  const btn = document.getElementById('pl-next');
  btn.textContent = 'Continuar'; btn.disabled = false;
}
document.getElementById('pl-next').addEventListener('click', () => {
  if (!PL) return;
  if (PL.finished) { const res = PL.result, cb = PL.onDone; PL = null; cb(res); return; }
  if (PL.chosen !== null) plNext();
});

// Placement unlock + celebration.
//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// Open the course at module `lvl`: mark modules[0..lvl-1] complete + unlocked so
// the ring / level / Mi progreso reflect the placement. lvl 0 = fresh A1 start.
function applyPlacement(lvl) {
  if (!lvl || lvl < 1) return;
  const idx = Math.min(lvl, course.modules.length - 1);
  for (let i = 0; i < idx; i++) {
    course.modules[i].lessons.forEach(l => { lp(l.id).quizCompleted = true; lp(l.id).readingCompleted = true; lp(l.id).unlocked = true; });
    if (!PROGRESS['__modules']) PROGRESS['__modules'] = {};
    PROGRESS['__modules'][course.modules[i].id] = true;
  }
  const first = course.modules[idx].lessons[0];
  if (first) lp(first.id).unlocked = true;
  saveProgress(PROGRESS);
}
// Celebration overlay for placing above A1 → then reveal the module map.
function celebratePlacement(mIdx, mod) {
  const lvl = OB_LEVELS[mIdx] || 'A1';
  const ov = document.createElement('div'); ov.className = 'celebrate';
  ov.innerHTML = `<div class="cel-confetti"></div><div class="cel-card">
    <div class="cel-emoji">🎉</div>
    <div class="cel-kick">¡Te ubicamos!</div>
    <div class="cel-lv">Empiezas en ${lvl}</div>
    <div class="cel-track">${OB_LEVELS.slice(0, mIdx + 1).map((l, i) => `<span class="cel-tk" style="animation-delay:${(i * 0.16).toFixed(2)}s">${l}</span>`).join('')}</div>
    <button class="btn green cel-go">Ver mi ruta ${arrowFwd(18, '#fff', 2.8)}</button>
  </div>`;
  document.body.appendChild(ov);
  const cc = ov.querySelector('.cel-confetti'), colors = ['#3FAA24', '#1CB0F6', '#F4A720', '#FF6FA5', '#CE82FF'];
  for (let i = 0; i < 44; i++) { const p = document.createElement('i');
    p.style.cssText = `left:${(Math.random() * 100).toFixed(1)}%;background:${colors[i % 5]};animation-delay:${(Math.random() * 0.7).toFixed(2)}s`; cc.appendChild(p); }
  ov.querySelector('.cel-go').onclick = () => { ov.remove(); renderModule(mod); };
}

const OB_LAST = 6;
const OB_TAP_STEPS = [1, 2, 5];     // option lists: selecting advances, no button
const OB_LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1'];
let OB = { step: 0, name: '', mot: '', goal: '', placedModule: 0, placedLevel: 'A1' };
const OB_BUBBLES = [
  () => '¡Hola! Soy <b>Ozzy el Osito.</b><br>Empezemos.',
  () => '¿Por qué quieres aprender inglés?',
  () => '¿Empezamos por ubicarte?<br>Un test corto y sé tu nivel.',
  () => '¿Cómo te llamas?',
  () => OB.name ? `Mira, <b>${escapeHtml(OB.name)}</b>, esto vamos a practicar:` : 'Esto es lo que vamos a practicar:',
  () => '¿Cuál es tu meta diaria?',
  () => `¡Listo, <b>${escapeHtml(OB.name)}</b>!<br>Tu ruta ya está preparada. `,
];

function obRender() {
  document.querySelector('#screen-onboard .ob-wrap').classList.toggle('ob-intro', OB.step === 0);
  document.querySelector('#screen-onboard .ob-top').classList.toggle('can-back', OB.step > 0);
  document.getElementById('ob-segs').innerHTML = Array.from({ length: OB_LAST + 1 }, (_, i) =>
    `<div class="seg ${i < OB.step ? 'done' : (i === OB.step ? 'now' : '')}"></div>`).join('');
  document.getElementById('ob-bubble').innerHTML = OB_BUBBLES[OB.step]();
  document.querySelectorAll('#screen-onboard .ob-step').forEach(s =>
    s.classList.toggle('on', +s.dataset.step === OB.step));
  // keep the option pills' selected state in sync (matters when stepping back)
  document.querySelectorAll('.ob-opt[data-mot]').forEach(b => b.classList.toggle('sel', b.dataset.mot === OB.mot));
  document.querySelectorAll('.ob-opt[data-goal]').forEach(b => b.classList.toggle('sel', b.dataset.goal === OB.goal));
  // footer: the big button on most steps; on the LAST step the real course-foot
  // "tu primera lección" bar takes over — its CTA drops straight into the lesson.
  const isLast = OB.step === OB_LAST;
  const next = document.getElementById('ob-next');
  const foot = document.getElementById('ob-foot');
  foot.hidden = !isLast;
  next.style.display = (isLast || OB_TAP_STEPS.includes(OB.step)) ? 'none' : '';
  next.textContent = OB.step === 0 ? '¡Empecemos!' : 'Continuar';
  const needName = OB.step === 3 && !document.getElementById('ob-name').value.trim();
  next.disabled = needName;
  next.className = 'btn ' + (needName ? 'disabled' : 'green');
  if (OB.step === 3) setTimeout(() => document.getElementById('ob-name').focus(), 120);
  if (isLast) {
    const mIdx = OB.placedModule || 0;
    document.getElementById('ob-sum').innerHTML =
      `<div class="ob-chip lvl"><span class="em">🏁</span><span class="lb">Nivel ${OB_LEVELS[mIdx]}</span><div class="sb">Empiezas aquí</div></div>` +
      `<div class="ob-chip goal"><span class="em">🎯</span><span class="lb">${OB.goal || 10} min</span><div class="sb">Meta diaria</div></div>`;
    const mod = course.modules[mIdx], fl = mod.lessons[0];
    const col = modAccent(mIdx), cold = shadeHex(col, -0.24);
    const kicker = mIdx > 0 ? 'Tu punto de partida' : 'Tu primera lección';
    const title = mIdx > 0 ? ('Nivel ' + OB_LEVELS[mIdx] + ' · ' + escapeHtml(moduleName(mod))) : escapeHtml(lessonName(fl));
    const label = mIdx > 0 ? 'Ver mi ruta' : 'Empezar';
    foot.innerHTML = fl
      ? `<div class="foot-kicker" style="color:${col}">${kicker}</div>
         <div class="foot-title">${title}</div>
         <button class="cta-btn" id="ob-start" style="background:${col};--lip:${cold}">${label} ${arrowFwd(19, '#fff', 2.8)}</button>`
      : '';
    const start = document.getElementById('ob-start');
    if (start) start.onclick = obFinishToLesson;
  }
}
function obAdvance() { if (OB.step < OB_LAST) { OB.step++; obRender(); } }
// FLIP: record each element's box, run `mutate` (which relayouts them via a class
// change), then play the inverted delta so they glide from old → new geometry.
// Used to morph the big centered intro Ozzy + bubble into the small talk row.
function obFlip(els, mutate) {
  const first = els.map(el => el.getBoundingClientRect());
  mutate();
  els.forEach((el, i) => {
    const last = el.getBoundingClientRect();
    const dx = first[i].left - last.left, dy = first[i].top - last.top;
    const sx = last.width ? first[i].width / last.width : 1, sy = last.height ? first[i].height / last.height : 1;
    el.style.transformOrigin = 'top left';
    el.style.transition = 'none';
    el.style.transform = `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`;
    el.getBoundingClientRect(); // flush the inverted start before animating
    requestAnimationFrame(() => {
      el.style.transition = 'transform .5s cubic-bezier(.22,1,.36,1)';
      el.style.transform = '';
    });
    el.addEventListener('transitionend', function te() { el.style.transition = ''; el.style.transformOrigin = ''; el.removeEventListener('transitionend', te); });
  });
}
document.getElementById('ob-next').addEventListener('click', () => {
  if (OB.step === 3) {
    const v = document.getElementById('ob-name').value.trim();
    if (!v) return;
    OB.name = v.split(/\s+/)[0];
  }
  if (OB.step === OB_LAST) { obFinish(); return; }
  if (OB.step === 0) { // morph the hero Ozzy + bubble into the talk row
    obFlip([document.querySelector('.ob-bear'), document.getElementById('ob-bubble')], obAdvance);
    return;
  }
  obAdvance();
});
document.getElementById('ob-back').addEventListener('click', () => { if (OB.step > 0) { OB.step--; obRender(); } });
document.getElementById('ob-name').addEventListener('input', () => {
  if (OB.step === 3) {
    const empty = !document.getElementById('ob-name').value.trim();
    const next = document.getElementById('ob-next');
    next.disabled = empty; next.className = 'btn ' + (empty ? 'disabled' : 'green');
  }
});
document.getElementById('ob-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('ob-next').click(); }
});
document.querySelectorAll('.ob-opt').forEach(b => b.addEventListener('click', () => {
  b.parentElement.querySelectorAll('.ob-opt').forEach(x => x.classList.toggle('sel', x === b));
  if (b.dataset.choice != null) {           // step 2: take the placement test, or start fresh
    if (b.dataset.choice === 'skip') { OB.placedModule = 0; OB.placedLevel = 'A1'; setTimeout(obAdvance, 220); }
    else setTimeout(() => startPlacement(res => {
      OB.placedModule = res.module; OB.placedLevel = (res.nivel === 'Pre-A1') ? 'A1' : res.nivel;
      show('onboard'); OB.step = 3; obRender();
    }), 200);
    return;
  }
  if (b.dataset.mot != null) OB.mot = b.dataset.mot;
  else if (b.dataset.goal != null) OB.goal = b.dataset.goal;
  setTimeout(obAdvance, 220); // let the selected state read before sliding on
}));
function obSaveProfile() {
  saveProfile({ name: OB.name, goal: +OB.goal || 10, level: OB.placedLevel || 'A1',
    placedModule: OB.placedModule || 0, motive: OB.mot || '', created: new Date().toISOString() });
  saveSummary();
}
function obFinish() { obFinishToLesson(); }
// Finish onboarding: apply the placement, then celebrate → module map (placed above
// A1) or drop into the very first lesson (fresh A1 start). Called by the last-step bar.
function obFinishToLesson() {
  const mIdx = OB.placedModule || 0;
  const mod = course.modules[mIdx], fl = mod.lessons[0];
  applyPlacement(mIdx);
  obSaveProfile();
  renderCourse();
  if (mIdx > 0) celebratePlacement(mIdx, mod);
  else if (fl) openLesson(fl, mod);
  toast('¡Hola, ' + OB.name + '! Ozzy te espera 🐻');
}
function startOnboarding() { OB = { step: 0, name: '', mot: '', goal: '', placedModule: 0, placedLevel: 'A1' }; show('onboard'); obRender(); }

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// DEV/DEMO: ?seed=1 llena datos de ejemplo (una alumna con progreso real) y, con
// &go=parent|teacher, salta a ese dashboard (mismo origen → comparte localStorage).
// Sólo se activa con el parámetro; para producción puedes quitar esta función.
function devSeed() {
  const q = new URLSearchParams(location.search);
  if (!q.has('seed')) return false;
  try { localStorage.removeItem(PK); localStorage.removeItem(PROFILE_KEY); localStorage.removeItem(SUMMARY_KEY); } catch (e) {}
  PROGRESS = {};
  applyPlacement(2); // ubicada en B1 → módulos A1 y A2 completos
  course.modules[2].lessons.slice(0, 3).forEach((l, i) => {
    l.contentBlocks.forEach(b => { if (b.requiresQuizToUnlockNext && b.miniQuiz && b.miniQuiz.length) lp(l.id).blocks[b.id] = { unlocked: true, mq: true }; });
    lp(l.id).quizCompleted = true; lp(l.id).readingCompleted = true;
    lp(l.id).skillErr = { listening: { t: 3, e: i === 0 ? 1 : 0 }, reading: { t: 6, e: 0 }, writing: { t: 5, e: 1 } };
  });
  const days = [];
  for (let d = 23; d >= 0; d--) { const dt = new Date(); dt.setDate(dt.getDate() - d); days.push(dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0')); }
  PROGRESS['__days'] = days; PROGRESS['__missionXP'] = 160;
  saveProgress(PROGRESS);
  saveProfile({ name: 'Valeria', goal: 10, level: 'B1', placedModule: 2, motive: '📚 Impulsar mis estudios', created: new Date().toISOString() });
  saveSummary();
  const go = q.get('go');
  if (go === 'parent') { location.replace('Prototipo_Ingles.html?role=parent'); return true; }
  if (go === 'teacher') { location.replace('Prototipo_Ingles.html?role=teacher'); return true; }
  return false; // alumno: continúa al curso ya con datos
}

//= = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
// Boot: first run (no profile) → onboarding; otherwise straight to the course.
if (!devSeed()) { if (loadProfile()) renderCourse(); else startOnboarding(); }
